<!-- 期末复习系统 · v1.3 | visionOS 质感与动效升级 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>期末复习系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Tailwind 未配置时 darkMode 默认 media，与基于 .dark 类的切换冲突；preflight 会覆盖本文件自带的 :root/body 基础样式
    tailwind.config = { darkMode: 'class', corePlugins: { preflight: false } };
  </script>
  <style>
    :root {
      /* ---- 兼容旧变量名（老代码在用，不许删） ---- */
      --bg: #f5f3ed;
      --card-bg: #fffefa;
      --text-secondary: #6d706a;
      --border: #d8d6cd;
      --border-light: #e8e5dc;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --green: #34c759;
      --green-text: #187a35;
      --orange-text: #9a5a00;
      --red: #ff3b30;
      --purple: #af52de;
      --radius-lg: 22px;
      --radius-md: 16px;

      /* ---- 文本层级 ---- */
      --text: #20231f;
      --text-2: #4b504a;
      --text-3: #7c8078;

      /* ---- 表面层级（visionOS：越靠上越「厚」） ---- */
      --surface-0: #f5f3ed;
      --surface-1: rgba(255,254,250,.88);
      --surface-2: #fffefa;
      --surface-glass: rgba(249,247,241,.9);
      --hairline: rgba(45,47,39,.09);
      --hairline-strong: rgba(45,47,39,.15);
      --fill-quiet: rgba(72,75,66,.06);
      --fill-hover: rgba(72,75,66,.10);

      /* ---- 高度与光晕 ---- */
      --elev-1: 0 1px 2px rgba(38,36,28,.04), 0 8px 20px -16px rgba(38,36,28,.14);
      --elev-2: 0 2px 6px rgba(38,36,28,.06), 0 18px 36px -22px rgba(38,36,28,.18);
      --elev-3: 0 8px 16px rgba(0,0,0,.08), 0 40px 90px -30px rgba(0,0,0,.32);
      --elev-glow: 0 0 0 1px rgba(0,113,227,.14), 0 6px 18px -10px rgba(0,113,227,.32);
      --inset-top: inset 0 1px 0 rgba(255,255,255,.82);
      --shadow-sm: var(--elev-1);

      /* ---- 间距刻度 ---- */
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
      --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 40px;

      /* ---- 圆角 ---- */
      --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

      /* ---- 字体 ---- */
      --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-num: ui-rounded, 'SF Pro Rounded', -apple-system, 'PingFang SC', sans-serif;
      --fs-xs: 12px; --fs-sm: 13.5px; --fs-md: 15px; --fs-lg: 17px;
      --fs-xl: 22px; --fs-2xl: 28px; --fs-3xl: 34px; --fs-4xl: 44px;
      --track-tight: -0.022em;

      /* ---- 时长与曲线（Apple 手感三件套） ---- */
      --dur-1: 140ms;
      --dur-2: 260ms;
      --dur-3: 420ms;
      --ease-out: cubic-bezier(.32, .72, 0, 1);
      --ease-spring: cubic-bezier(.2, 1.3, .4, 1);
      --ease-soft: cubic-bezier(.4, 0, .2, 1);

      color-scheme: light;
    }
    .dark {
      --bg: #111310;
      --card-bg: #1b1d19;
      --text-secondary: #a3a79d;
      --border: #393b34;
      --border-light: #2b2d27;
      --accent: #0a84ff;
      --accent-hover: #409cff;
      --green: #30d158;
      --green-text: #5ee57b;
      --orange-text: #ffb340;
      --red: #ff453a;
      --purple: #bf5af2;

      --text: #f2f1e9;
      --text-2: #c7c9c0;
      --text-3: #9a9d94;

      --surface-0: #111310;
      --surface-1: rgba(28,30,25,.9);
      --surface-2: #1b1d19;
      --surface-glass: rgba(18,20,16,.88);
      --hairline: rgba(238,236,224,.10);
      --hairline-strong: rgba(238,236,224,.17);
      --fill-quiet: rgba(220,220,205,.07);
      --fill-hover: rgba(220,220,205,.12);

      --elev-1: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.7);
      --elev-2: 0 2px 8px rgba(0,0,0,.55), 0 22px 52px -20px rgba(0,0,0,.8);
      --elev-3: 0 10px 20px rgba(0,0,0,.6), 0 48px 100px -34px rgba(0,0,0,.9);
      --elev-glow: 0 0 0 1px rgba(10,132,255,.2), 0 6px 22px -10px rgba(10,132,255,.42);
      --inset-top: inset 0 1px 0 rgba(255,255,255,.07);
      --shadow-sm: var(--elev-1);

      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--surface-0); color: var(--text);
      font-family: var(--font-ui);
      font-size: var(--fs-md);
      margin: 0; padding: 0; min-height: 100vh; min-height: 100dvh; line-height: 1.5;
      letter-spacing: var(--track-tight);
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      /* 一层低对比暖光，让背景有纸面层次但不抢内容 */
      background-image: radial-gradient(1000px 560px at 100% 0%, rgba(190,176,142,.16), transparent 60%);
      background-attachment: fixed;
      transition: background-color var(--dur-2) var(--ease-soft), color var(--dur-2) var(--ease-soft);
    }
    body.dark {
      background-image: radial-gradient(1000px 560px at 100% 0%, rgba(102,126,200,.13), transparent 60%);
    }
    /* 移动端安全区：刘海屏左右内缩 + 底部 Home 指示条不被压住 */
    #app { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
    @supports (padding: max(0px)) {
      #app { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
      @media (min-width: 640px) {
        #app { padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }
      }
    }

    /* 数字统一用等宽数位，避免读数时抖动 */
    .num, #resultAcc, [id$="Count"], .stat-value { font-variant-numeric: tabular-nums; }

    /* 焦点环：只在键盘导航时出现，不破坏鼠标观感 */
    :focus-visible {
      outline: 2.5px solid var(--accent);
      outline-offset: 2px;
      border-radius: var(--r-sm);
    }
    /* 切题后会把焦点交给题目标题（读屏/键盘不迷失），那是容器不是控件，不该画焦点框 */
    [tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }
    /* ===== 表面系统：以纸面与细边为主，玻璃效果仅用于浮层 ===== */
    .glass {
      background: var(--surface-1);
      -webkit-backdrop-filter: blur(30px) saturate(1.8);
      backdrop-filter: blur(30px) saturate(1.8);
    }
    .card-elegant {
      background: var(--card-bg);
      border-radius: var(--r-lg);
      box-shadow: var(--elev-1), var(--inset-top);
      border: 0.5px solid var(--hairline);
      transition: box-shadow var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-soft), background-color var(--dur-2) var(--ease-soft);
    }
    .elev-1 { box-shadow: var(--elev-1), var(--inset-top); }
    .elev-2 { box-shadow: var(--elev-2), var(--inset-top); }
    .card-hover { cursor: pointer; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: var(--elev-2), var(--inset-top); border-color: var(--hairline-strong); }
    .card-hover:active { transform: translateY(0) scale(.992); transition-duration: var(--dur-1); }
    /* 触屏设备没有 hover，滚动手势期间不要残留悬停位移 */
    @media (hover: none) { .card-hover:hover { transform: none; } }

    /* 统一按压反馈：按下去立刻收，松手由各组件自己的过渡负责回弹 */
    .press { transition: transform var(--dur-1) var(--ease-out); }
    .press:active { transform: scale(.965); }
    .btn-primary {
      background: var(--accent); color: #fff; border: none; border-radius: var(--r-pill);
      padding: 12px 24px; font-weight: 590; font-size: var(--fs-md); cursor: pointer;
      letter-spacing: var(--track-tight); user-select: none;
      box-shadow: var(--elev-glow), inset 0 1px 0 rgba(255,255,255,.28);
      transition: transform var(--dur-1) var(--ease-spring), background-color var(--dur-2) var(--ease-soft), box-shadow var(--dur-2) var(--ease-out), opacity var(--dur-2);
    }
    .btn-primary:hover { background: var(--accent-hover); box-shadow: var(--elev-glow), var(--elev-2); transform: translateY(-1px); }
    .btn-primary:active { transform: scale(.965); box-shadow: var(--elev-glow); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-ghost {
      background: var(--fill-quiet); border: 0.5px solid var(--hairline); border-radius: var(--r-pill);
      padding: 10px 20px; font-weight: 500; font-size: var(--fs-sm); cursor: pointer;
      color: var(--text); user-select: none; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
      transition: transform var(--dur-1) var(--ease-spring), background-color var(--dur-2) var(--ease-soft), border-color var(--dur-2) var(--ease-soft), color var(--dur-2);
    }
    .btn-ghost:hover { background: var(--fill-hover); border-color: var(--hairline-strong); }
    .btn-ghost:active { transform: scale(.965); }
    .btn-icon {
      width: 36px; height: 36px; border-radius: var(--r-md); flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--fill-quiet); border: 0.5px solid var(--hairline); color: var(--text-2);
      cursor: pointer;
      transition: transform var(--dur-1) var(--ease-spring), background-color var(--dur-2) var(--ease-soft), color var(--dur-2), border-color var(--dur-2);
    }
    .btn-icon:hover { background: var(--fill-hover); color: var(--text); }
    .btn-icon:active { transform: scale(.92); }
    .btn-icon.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .option-elegant {
      background: var(--card-bg); border: 0.5px solid var(--hairline);
      border-radius: var(--r-md); padding: 15px 18px; cursor: pointer;
      display: flex; align-items: center; gap: 12px;
      width: 100%; user-select: none; font-size: var(--fs-md); color: var(--text);
      transition: transform var(--dur-1) var(--ease-spring), border-color var(--dur-2) var(--ease-soft), background-color var(--dur-2) var(--ease-soft), box-shadow var(--dur-2) var(--ease-out);
    }
    .option-elegant:active { transform: scale(.978); }
    .option-elegant:hover { border-color: var(--hairline-strong); background: var(--fill-quiet); }
    .option-elegant.selected {
      border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--card-bg));
      box-shadow: var(--elev-glow);
    }
    /* 选项字母徽章（配合 Task 8 的 DOM 结构调整） */
    .opt-key {
      width: 26px; height: 26px; border-radius: 8px; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: var(--fs-sm); font-weight: 600;
      background: var(--fill-quiet); color: var(--text-2);
      transition: background-color var(--dur-2), color var(--dur-2);
    }
    .option-elegant.selected .opt-key { background: var(--accent); color: #fff; }
    .option-elegant.correct-flash { border-color: var(--green) !important; background: color-mix(in srgb, var(--green) 10%, var(--card-bg)) !important; animation: correctPulse .5s var(--ease-spring); }
    .option-elegant.correct-flash .opt-key { background: var(--green); color: #fff; }
    .option-elegant.wrong-shake { border-color: var(--red) !important; background: color-mix(in srgb, var(--red) 10%, var(--card-bg)) !important; animation: shakeX .45s var(--ease-soft); }
    .option-elegant.wrong-shake .opt-key { background: var(--red); color: #fff; }
    @keyframes correctPulse { 0%{transform:scale(1)} 34%{transform:scale(1.022)} 100%{transform:scale(1)} }
    @keyframes shakeX { 0%,100%{transform:translateX(0)} 18%{transform:translateX(-5px)} 38%{transform:translateX(5px)} 58%{transform:translateX(-3px)} 78%{transform:translateX(2px)} }
    /* 进度条：轨道 + 发光填充，填充用 transform 而非 width（Task 9 的 JS 配合） */
    .progress-line { height:4px; border-radius: var(--r-pill); background: var(--fill-quiet); overflow: hidden; position: relative; }
    .progress-line-fill {
      height: 100%; width: 100%; transform-origin: left center; transform: scaleX(0);
      background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 62%, var(--purple)));
      border-radius: var(--r-pill);
      transition: transform var(--dur-3) var(--ease-spring);
    }
    .upload-zone {
      display: block; border: 1.5px dashed var(--hairline-strong); border-radius: var(--r-xl);
      padding: 36px 20px; text-align: center; cursor: pointer;
      background: var(--fill-quiet);
      user-select: none; -webkit-touch-callout: none;
      transition: border-color var(--dur-2) var(--ease-soft), background-color var(--dur-2) var(--ease-soft), transform var(--dur-1) var(--ease-spring);
    }
    .upload-zone:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, transparent); }
    .upload-zone:active { transform: scale(.99); }
    .upload-zone.dragover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); transform: scale(1.008); }
    .vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .input-elegant {
      border: 0.5px solid var(--hairline-strong); border-radius: var(--r-md);
      padding: 12px 15px; font-size: var(--fs-md); font-family: var(--font-ui);
      background: var(--card-bg); color: var(--text); width: 100%; outline: none;
      transition: border-color var(--dur-2) var(--ease-soft), box-shadow var(--dur-2) var(--ease-out), background-color var(--dur-2);
    }
    .input-elegant:focus { border-color: var(--accent); box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--accent) 14%, transparent); }
    .input-elegant::placeholder { color: var(--text-3); }
    textarea.input-elegant { resize: vertical; min-height: 90px; }
    .text-secondary { color: var(--text-secondary); }
    .tag-pill {
      display: inline-flex; align-items: center; padding: 3px 10px; border-radius: var(--r-pill);
      font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums;
      background: var(--fill-quiet); color: var(--text-2);
    }
    .tag-single { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
    .tag-multi { background: color-mix(in srgb, var(--purple) 14%, transparent); color: var(--purple); }
    .tag-judge { background: color-mix(in srgb, #ff9500 15%, transparent); color: var(--orange-text); }
    .tag-fill { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green-text); }
    .tag-short { background: color-mix(in srgb, #5ac8fa 16%, transparent); color: #3aa8dd; }
    .tag-comprehensive { background: color-mix(in srgb, #ffcc00 18%, transparent); color: #b8860b; }
    .tag-wrong { background: color-mix(in srgb, var(--red) 13%, transparent); color: var(--red); }
    .timeline-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hairline-strong); flex: none; }
    .timeline-line { width: 1.5px; min-height: 28px; background: var(--hairline); flex: 1; }
    .option-elegant.disabled { opacity: .6; cursor: default; }
    .option-elegant.disabled:active { transform: none; }

    /* 指标小块（首页统计 + 结果页复用） */
    .stat-tile {
      padding: 12px 8px; border-radius: var(--r-md); text-align: center;
      background: var(--fill-quiet); border: 0.5px solid var(--hairline);
    }
    .stat-tile .stat-value { font-family: var(--font-num); font-size: var(--fs-xl); font-weight: 640; letter-spacing: -0.03em; }
    .stat-tile .stat-label { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    /* 跳题条：可横向滚动的小圆点，做对绿、做错红、当前蓝且放大 */
    .jump-dot {
      flex: none; min-width: 26px; height: 26px; padding: 0 4px;
      border-radius: var(--r-pill); border: 0.5px solid var(--hairline);
      background: var(--fill-quiet); color: var(--text-2);
      font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
      cursor: pointer; font-family: var(--font-ui);
      transition: transform var(--dur-1) var(--ease-spring), background-color var(--dur-2), color var(--dur-2), border-color var(--dur-2);
    }
    .jump-dot:hover { background: var(--fill-hover); transform: translateY(-1px); }
    .jump-dot:active { transform: scale(.9); }
    .jump-dot.ok { border-color: color-mix(in srgb, var(--green) 50%, transparent); background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
    .jump-dot.bad { border-color: color-mix(in srgb, var(--red) 50%, transparent); background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
    .jump-dot.cur { background: var(--accent); border-color: var(--accent); color: #fff; transform: scale(1.12); box-shadow: var(--elev-glow); }
    #jumpBar::-webkit-scrollbar { height: 3px; }
    #jumpBar::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 2px; }
    /* 触屏：去掉双击缩放与 300ms 延迟；跳题条横向吸附 */
    button, .jump-dot, .seg-btn, .option-elegant, label, a, .upload-zone { touch-action: manipulation; }
    #jumpBar { -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; scroll-snap-type: x proximity; }
    .jump-dot { scroll-snap-align: center; }
    /* 触屏设备不显示「键盘 ← → 切题」这类桌面提示 */
    @media (hover: none) { .kbd-only { display: none !important; } }
    /* 练习页顶栏：轻微玻璃，滚动时保持在顶部 */
    .exam-bar {
      position: sticky; top: 0; z-index: 50; padding: 10px 0 12px;
      background: var(--surface-glass);
      -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8);
      border-bottom: 0.5px solid var(--hairline);
    }
    @media (max-width: 640px) {
      .option-elegant { padding: 13px 14px; font-size: 14px; overflow-wrap: anywhere; }
      .btn-primary { padding: 11px 18px; font-size: 14px; }
      .card-elegant { border-radius: var(--r-md); }
      /* 顶栏：不再换行，控件横滑；玻璃模糊降档（手机 GPU 上 24px 模糊很贵） */
      .exam-bar { padding: 8px 0 10px; -webkit-backdrop-filter: blur(14px) saturate(1.5); backdrop-filter: blur(14px) saturate(1.5); }
      .exam-bar-row { flex-wrap: nowrap !important; overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .exam-bar-row::-webkit-scrollbar { display: none; }
      .exam-bar-row > * { flex: none; }
      /* 跳题条独占一行：手指够得着，上一题/下一题 各占一边 */
      .exam-nav { flex-wrap: wrap; row-gap: 6px; }
      .exam-nav #jumpBar { order: -1; flex: 1 0 100%; justify-content: flex-start; }
      .jump-dot { min-width: 32px; height: 32px; font-size: 12px; }
      /* 顶栏分段控件收紧，320~390 宽也能露出「看题」 */
      .seg-btn { padding: 7px 11px; font-size: 13px; }
      /* 移动端不显示跳题条滚动槽（会像一条多余的灰线） */
      #jumpBar::-webkit-scrollbar { display: none; }
      #jumpBar { scrollbar-width: none; }
      /* iOS 聚焦不放大：输入控件字号 ≥16px */
      input, textarea, select { font-size: 16px; }
      /* 大面积固定渐变 + 滚动 = 移动端掉帧来源，窄屏改成随内容滚动 */
      body { background-attachment: scroll; }
      /* 窄屏卡片内边距收紧一点，题干能多显示一行 */
      #questionCard { padding: 14px; }
    }
    /* 首页：纸面主层级、克制阴影，窄屏自然纵排 */
    .home-bento { display: flex; flex-direction: column; gap: var(--sp-5); }
    .home-hero {
      position: relative; overflow: hidden; padding: 28px 32px;
      background: var(--surface-2); border: 1px solid var(--hairline);
      border-radius: var(--r-xl); box-shadow: var(--elev-1), var(--inset-top);
    }
    .home-hero::before {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 4px;
      background: var(--accent);
    }
    .home-kicker {
      margin: 0 0 8px; color: var(--accent); font-size: var(--fs-xs);
      font-weight: 700; letter-spacing: .09em;

      .home-hero { padding: 22px 18px 20px 22px; border-radius: var(--r-lg); }
      .home-title { font-size: var(--fs-2xl); }

    }
    @media (min-width: 1024px) {
      /* 桌面宽屏：行动区与趋势并列，题库保持整齐两列 */
      .home-bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: stretch; }
      .home-bento > .span-hero { grid-column: span 8; }
      .home-bento > .span-side { grid-column: span 4; }

      .home-subject-grid { grid-template-columns: repeat(12, minmax(0, 1fr)); }
      .home-subject-grid > .subject-card { grid-column: span 6; }
    }

    /* ========== 动效层 ==========
       三档：.motion-full（默认）/ .motion-lite（只保留必要的位移与淡入）/ .motion-off（关闭装饰性动效，保留状态反馈）
       旧版的 .no-motion 用 `transition:none !important` 把按钮按压反馈也一起杀了，本版按档位降级而不是一刀切 */
    body { --motion-scale: 1; --motion-dist: 22px; --motion-rise: 14px; }
    /* 窄屏位移幅度减半：同样的动效，手机上更稳不晃眼 */
    @media (max-width: 640px) { body { --motion-dist: 12px; --motion-rise: 8px; } }
    .motion-lite { --motion-scale: .55; }
    .motion-off  { --motion-scale: 0; }

    /* 入场：整体上浮淡入 */
    .rise-item { animation: riseIn calc(var(--dur-3) * var(--motion-scale, 1) + 1ms) var(--ease-out) both; }
    @keyframes riseIn { from { opacity: 0; transform: translateY(var(--motion-rise, 14px)); } to { opacity: 1; transform: none; } }

    /* 子项依次入场：父加 .stagger，子元素自动递增延迟（最多 12 个） */
    .stagger > * { animation: riseIn calc(var(--dur-2) * var(--motion-scale, 1) + 1ms) var(--ease-out) both; }
    .stagger > *:nth-child(1) { animation-delay: 0ms; }
    .stagger > *:nth-child(2) { animation-delay: 35ms; }
    .stagger > *:nth-child(3) { animation-delay: 70ms; }
    .stagger > *:nth-child(4) { animation-delay: 105ms; }
    .stagger > *:nth-child(5) { animation-delay: 140ms; }
    .stagger > *:nth-child(6) { animation-delay: 175ms; }
    .stagger > *:nth-child(7) { animation-delay: 210ms; }
    .stagger > *:nth-child(8) { animation-delay: 245ms; }
    .stagger > *:nth-child(n+9) { animation-delay: 280ms; }

    /* 切题方向动画（Task 8 使用） */
    .swap-in-right { animation: swapInRight calc(var(--dur-3) * var(--motion-scale, 1) + 1ms) var(--ease-out) both; }
    .swap-in-left  { animation: swapInLeft  calc(var(--dur-3) * var(--motion-scale, 1) + 1ms) var(--ease-out) both; }
    @keyframes swapInRight { from { opacity: 0; transform: translateX(var(--motion-dist, 22px)); } to { opacity: 1; transform: none; } }
    @keyframes swapInLeft  { from { opacity: 0; transform: translateX(calc(var(--motion-dist, 22px) * -1)); } to { opacity: 1; transform: none; } }

    /* 关闭装饰动效时：去掉入场/位移/彩带，但保留 140ms 的按压与颜色反馈 */
    .motion-off .rise-item,
    .motion-off .stagger > *,
    .motion-off .swap-in-right,
    .motion-off .swap-in-left,
    .motion-off .confetti { animation: none !important; }
    .motion-off .card-hover:hover,
    .motion-off .mode-opt:hover,
    .motion-off .provider-chip:hover,
    .motion-off .btn-primary:hover { transform: none !important; }
    .motion-off .seg-ind { transition: none !important; }

    /* 系统级降级：尊重操作系统「减弱动态效果」 */
    @media (prefers-reduced-motion: reduce) {
      .rise-item, .stagger > *, .swap-in-right, .swap-in-left { animation: none !important; }
      .card-hover:hover, .mode-opt:hover, .btn-primary:hover { transform: none !important; }
      ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .01ms !important; }
    }

    /* 视图转场：只让内容区过渡，外壳（顶部/背景）保持稳定 —— 旧版对 root 整体做过渡，导致大标题卡片跟着飞 */
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
    #app { view-transition-name: app-content; }
    /* 方向通过 :root 上的 CSS 变量传递，而不是 `.vt-back ::view-transition-new(app-content)` 这类后代选择器。
       实测 Chrome 能解析那种写法（sheet.cssRules 里可见、animationName 生效），但转场时是否命中没有可靠保证；
       用变量取值不存在这个不确定性，静态也能验。 */
    :root { --vt-in: vtIn; }
    .vt-back { --vt-in: vtInLeft; }
    ::view-transition-old(app-content) {
      animation: vtOut calc(var(--dur-2) * var(--motion-scale, 1) + 1ms) var(--ease-soft) both;
    }
    ::view-transition-new(app-content) {
      animation: var(--vt-in) calc(var(--dur-3) * var(--motion-scale, 1) + 1ms) var(--ease-out) both;
    }
    @keyframes vtOut { to { opacity: 0; transform: scale(.992); } }
    @keyframes vtIn  { from { opacity: 0; transform: translateY(10px) scale(.994); } }
    @keyframes vtInLeft { from { opacity: 0; transform: translateX(-16px); } }

    /* 弹窗：移动端底部抽屉 / 桌面居中卡片，玻璃质感 */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.32);
      -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
      z-index: 1000; display: flex; align-items: flex-end; justify-content: center;
      animation: backdropIn calc(var(--dur-2) * var(--motion-scale, 1) + 1ms) var(--ease-soft) both;
    }
    @media (min-width: 640px) { .modal-backdrop { align-items: center; padding: 28px; } }
    .modal-panel {
      background: var(--surface-2); border-radius: var(--r-xl) var(--r-xl) 0 0; width: 100%; max-width: 580px;
      max-height: 88vh; overflow-y: auto; border: 0.5px solid var(--hairline);
      box-shadow: var(--elev-3), var(--inset-top);
      animation: modalIn calc(var(--dur-3) * var(--motion-scale, 1) + 1ms) var(--ease-spring) both;
      overscroll-behavior: contain;
    }
    @media (min-width: 640px) { .modal-panel { border-radius: var(--r-xl); } }
    @media (max-width: 639px) {
      .modal-panel { max-height: 92vh; padding-bottom: env(safe-area-inset-bottom, 0); }
      .seg-btn { padding: 8px 14px; }
    }

    @keyframes backdropIn { from { opacity: 0; } }
    @keyframes modalOut { to { opacity: 0; transform: translateY(18px) scale(.97); } }
    @keyframes backdropOut { to { opacity: 0; } }
    .modal-panel::-webkit-scrollbar { width: 6px; }
    .modal-panel::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 3px; }

    /* 分段控件：滑动指示器（visionOS 最标志性的一处） */
    .seg {
      display: inline-flex; position: relative; isolation: isolate;
      background: var(--fill-quiet); border: 0.5px solid var(--hairline);
      border-radius: var(--r-pill); padding: 3px; gap: 2px;
    }
    .seg-ind {
      position: absolute; top: 3px; bottom: 3px; left: 0; z-index: -1;
      border-radius: var(--r-pill); background: var(--card-bg);
      box-shadow: 0 1px 4px rgba(0,0,0,.16), var(--inset-top);
      transition: transform calc(var(--dur-2) * var(--motion-scale, 1) + 1ms) var(--ease-spring),
                  width calc(var(--dur-2) * var(--motion-scale, 1) + 1ms) var(--ease-spring);
      pointer-events: none;
    }
    .seg-btn {
      border: none; background: transparent; padding: 7px 16px; border-radius: var(--r-pill);
      font-size: var(--fs-sm); font-weight: 560; color: var(--text-2); cursor: pointer;
      position: relative; z-index: 1; font-family: var(--font-ui);

    .provider-chip {

    .select-wrap { position: relative; }
    .dropdown-panel {
      position: absolute; z-index: 80; top: calc(100% + 6px); left: 0; right: 0;

    }
    .model-item {
      display: flex; justify-content: space-between; align-items: center; width: 100%;

    .input-eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px 6px; color: var(--text-secondary); display: inline-flex; }


    /* 作答报告环形 */
    .ring-svg { transform: rotate(-90deg); }
    .ring-bg { stroke: var(--border-light); }
    #resultRing { transition: stroke-dashoffset 1.2s cubic-bezier(.32,.72,0,1); }

    .confetti {
      position: fixed; z-index: 3000; pointer-events: none;
      border-radius: 50%;
      will-change: transform, opacity;
      animation: burstOut var(--burst-dur, 1100ms) cubic-bezier(.16, .84, .34, 1) forwards;
      transform: translate(-50%, -50%);
    }
    @keyframes burstOut {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
      12%  { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--bx)), calc(-50% + var(--by))) scale(var(--bs, 1)) rotate(var(--br, 0deg)); }

    .mode-opt {
      display: flex; gap: 14px; align-items: center; padding: 15px 16px; border-radius: 18px;
      border: 1px solid var(--border-light); cursor: pointer; background: var(--card-bg); width: 100%;
      transition: transform .2s cubic-bezier(.32,.72,0,1), border-color .2s, background .2s;

    /* Toast：毛玻璃胶囊 + 状态色图标 */
    .toast-item {
      display: flex; align-items: center; gap: 9px;
      background: var(--surface-glass); border: 0.5px solid var(--hairline-strong);

      animation: toastIn calc(var(--dur-3) * var(--motion-scale, 1) + 1ms) var(--ease-spring) both;

    .toast-item::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
      background: var(--tcolor, var(--accent)); flex: none;
      box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--tcolor, var(--accent)) 22%, transparent);
    }
    .toast-item.out { animation: toastOut var(--dur-2) var(--ease-soft) both; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(28px) scale(.94); } }
    @keyframes toastOut { to { opacity: 0; transform: translateX(20px) scale(.96); } }

      function escapeHtml(str) {

      }
      function shuffleArr(a) {
        const arr = a.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }
      function fmtTime(s) {
        s = Math.max(1, Math.round(Number(s) || 0));
        const m = Math.floor(s / 60), ss = s % 60;
        return m ? m + '分' + ss + '秒' : ss + '秒';
      }
      function ensureLibrary(name) {
        const lib = LIBRARIES[name];
        if (!lib) return Promise.reject(new Error('未知组件：' + name));
        if (window[lib.global]) return Promise.resolve(window[lib.global]);
        if (libraryLoads[name]) return libraryLoads[name];
        libraryLoads[name] = new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = lib.src;
          script.async = true;
          script.onload = () => window[lib.global] ? resolve(window[lib.global]) : reject(new Error(name + ' 组件加载失败'));
          script.onerror = () => reject(new Error(name + ' 组件加载失败，请检查网络'));
          document.head.appendChild(script);
        }).catch(error => { delete libraryLoads[name]; throw error; });
        return libraryLoads[name];
      }
      async function fetchWithTimeout(url, options = {}, timeoutMs = 90000, consume = response => response) {
        const controller = new AbortController();
        const upstream = options.signal;
        const cancel = () => controller.abort();
        if (upstream?.aborted) cancel();
        else upstream?.addEventListener('abort', cancel, { once: true });
        const timer = setTimeout(cancel, timeoutMs);
        try {
          const response = await fetch(url, Object.assign({}, options, { signal: controller.signal }));
          return await consume(response);
        } catch (error) {
          if (upstream?.aborted) throw new Error('识别已取消');
          if (controller.signal.aborted || error?.name === 'AbortError') throw new Error('请求超时，请稍后重试');
          throw error;
        } finally {
          clearTimeout(timer);
          upstream?.removeEventListener('abort', cancel);

      function providerOf(cfg) {

      // ================= 存储 =================
      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const data = JSON.parse(raw);
            const cleanSubjects = Object.create(null), cleanWrongBook = Object.create(null), idMap = Object.create(null);
            for (const [oldId, rawSubject] of Object.entries(data.subjects || {})) {
              const sub = sanitizeSubject(rawSubject);
              if (!sub) continue;
              let id = isSafeSubjectId(oldId) && !cleanSubjects[oldId] ? oldId : createSubjectId();
              while (cleanSubjects[id]) id = createSubjectId();
              cleanSubjects[id] = sub;
              idMap[oldId] = id;
            }
            for (const [oldId, rawQuestions] of Object.entries(data.wrongBook || {})) {
              const id = idMap[oldId];
              if (id && rawQuestions && typeof rawQuestions === 'object') cleanWrongBook[id] = normalizeParsedQuestions(rawQuestions);
            }
            appState.subjects = cleanSubjects;
            appState.wrongBook = cleanWrongBook;
            appState.stats = sanitizeStats(data.stats, idMap);
          }
        } catch (e) { appState.subjects = {}; appState.wrongBook = {}; appState.stats = []; }
      }
      function saveData(data = appState) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ subjects: data.subjects, wrongBook: data.wrongBook, stats: data.stats }));
          return true;
        } catch (e) {
          console.error('保存失败:', e);
          showToast('保存失败：浏览器存储空间可能已满，请先导出备份','error');
          return false;
        }
      }
      function toggleDarkMode() {
        const next = !appState.darkMode;
        const apply = () => {
          appState.darkMode = next;
          document.body.classList.toggle('dark', next);
          localStorage.setItem(DARK_KEY, String(next));
          const darkBtn = document.getElementById('darkModeBtn');
          if (darkBtn) {
            darkBtn.innerHTML = iconSvg(next ? 'sun' : 'moon', 16);
            darkBtn.setAttribute('aria-label', next ? '切换到浅色模式' : '切换到深色模式');
          }
        };
        // 从按钮位置扩散的圆形揭示（Apple 手感）；不支持或不需动效时直接切换
        if (appState.motionLevel === 'off' || typeof document.startViewTransition !== 'function') { apply(); return; }
        const btn = document.getElementById('darkModeBtn');
        const r = btn ? btn.getBoundingClientRect() : { left: innerWidth - 48, top: 40, width: 0, height: 0 };
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        const radius = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy));
        const t = document.startViewTransition(apply);
        t.ready.then(() => {
          document.documentElement.animate(
            { clipPath: [`circle(0px at ${cx}px ${cy}px)`, `circle(${radius}px at ${cx}px ${cy}px)`] },
            { duration: 520, easing: 'cubic-bezier(.32,.72,0,1)', pseudoElement: '::view-transition-new(root)' }
          );
          document.documentElement.animate(
            { opacity: [1, 1] },
            { duration: 520, pseudoElement: '::view-transition-old(root)' }
          );
        }).catch(() => {});
      }

      function defaultAiConfig() {
        const p = PROVIDER_PRESETS[0];
        const savedKey = localStorage.getItem(API_KEY_STORAGE) || '';
        return {
          providerId: p.id, name: p.name, baseUrl: p.baseUrl, model: p.models[0],
          displayName: p.displayName, apiKey: savedKey, proxyUrl: '', rememberKey: Boolean(savedKey),
        };
      }
      function loadAiConfig() {
        try {
          const saved = JSON.parse(localStorage.getItem(AI_CONFIG_KEY) || 'null');
          if (saved && saved.baseUrl && saved.model) {
            saved.apiKey = saved.apiKey || localStorage.getItem(API_KEY_STORAGE) || '';
            saved.proxyUrl = saved.proxyUrl || '';
            saved.rememberKey = saved.rememberKey !== false && Boolean(saved.apiKey);
            return saved;
          }
        } catch (e) {}
        return defaultAiConfig();
      }
      function saveAiConfigToStorage(cfg) {
        try {
          const stored = Object.assign({}, cfg);
          if (!cfg.rememberKey) delete stored.apiKey;
          localStorage.setItem(AI_CONFIG_KEY, JSON.stringify(stored));
          if (cfg.rememberKey) localStorage.setItem(API_KEY_STORAGE, cfg.apiKey || '');
          else localStorage.removeItem(API_KEY_STORAGE);
          return true;
        } catch (e) {
          showToast('AI 配置保存失败，请检查浏览器存储权限','error');
          return false;
        }
      }

      // ================= 错题本 =================
      function totalWrongCount(subjectId) {
        const wb = appState.wrongBook && appState.wrongBook[subjectId];
        if (!wb) return 0;
        return ['single','multi','judge','fill','short'].reduce((s,t) => s + ((wb[t] || []).length), 0);
      }
      function addWrongToBook(subjectId, type, q) {
        const clean = Object.assign({}, q);
        delete clean._type;
        appState.wrongBook = appState.wrongBook || {};
        appState.wrongBook[subjectId] = appState.wrongBook[subjectId] || {};
        const list = appState.wrongBook[subjectId][type] || (appState.wrongBook[subjectId][type] = []);
        const key = String(clean.q || '').trim();
        const i = list.findIndex(x => String(x.q || '').trim() === key);
        if (i >= 0) list[i] = clean; else list.push(clean);
        saveData();
      }
      function removeWrongFromBook(subjectId, type, q) {
        const list = appState.wrongBook && appState.wrongBook[subjectId] && appState.wrongBook[subjectId][type];
        if (!list) return;
        const key = String(q && q.q || '').trim();
        const i = list.findIndex(x => String(x.q || '').trim() === key);
        if (i >= 0) { list.splice(i, 1); saveData(); }
      }
      function afterGrade(key, ok) {
        const idx = parseInt(String(key).replace('exam-', ''), 10);
        const q = appState.currentQuestions[idx];
        if (!q || !q._type) return;
        if (ok) removeWrongFromBook(appState.currentSubjectId, q._type, q);
        else addWrongToBook(appState.currentSubjectId, q._type, q);
      }

      // ================= 弹窗系统（焦点陷阱 + 关闭后焦点归还 + 关闭动画） =================
      let modalCloseTimer = null;
      let modalLastFocus = null;
      const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';
      function clearModalRoot() {

        const app = document.getElementById('app');
        root.innerHTML = '';
        root.style.display = 'none';
        if (app) { app.inert = false; app.removeAttribute('aria-hidden'); }
        document.body.style.overflow = '';
        if (modalLastFocus && typeof modalLastFocus.focus === 'function') {
          try { modalLastFocus.focus({ preventScroll: true }); } catch (e) {}
        }
        modalLastFocus = null;
      }
      function trapModalFocus(e) {
        if (e.key !== 'Tab') return;
        const root = document.getElementById('modalRoot');
        const items = Array.from(root.querySelectorAll(FOCUSABLE)).filter(el => el.offsetParent !== null);
        if (!items.length) return;
        const first = items[0], last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      function openModal(innerHtml, panelClass = '') {
        // 只取消未完成的关闭定时器，不做 clearModalRoot()：
        // 随即要整体覆写 root.innerHTML，多跑一次清空只会白做焦点归还。
        // 关键在于定时器必须在覆写之前被取消，否则它会在新弹窗打开后把内容清掉。
        if (modalCloseTimer) { clearTimeout(modalCloseTimer); modalCloseTimer = null; }
        modalLastFocus = document.activeElement;
        const root = document.getElementById('modalRoot');
        root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal-panel ${panelClass}" role="dialog" aria-modal="true" aria-label="对话框">${innerHtml}</div></div>`;
        root.style.display = 'block';
        const app = document.getElementById('app');
        if (app) { app.inert = true; app.setAttribute('aria-hidden', 'true'); }
        document.body.style.overflow = 'hidden';
        root.querySelector('#modalBackdrop').addEventListener('click', e => {
          if (e.target.id === 'modalBackdrop') closeModal();
        });
        root.addEventListener('keydown', trapModalFocus);
        // 焦点移入弹窗：优先第一个输入框，否则面板自身
        requestAnimationFrame(() => {
          const target = root.querySelector('input:not([type="hidden"]), textarea') || root.querySelector(FOCUSABLE) || root.querySelector('.modal-panel');
          if (target) { if (!target.hasAttribute('tabindex') && target.classList.contains('modal-panel')) target.setAttribute('tabindex', '-1'); target.focus({ preventScroll: true }); }
        });
      }
      function closeModal() {
        const root = document.getElementById('modalRoot');
        if (!root || root.style.display === 'none') return;
        if (modalCloseTimer) { clearTimeout(modalCloseTimer); modalCloseTimer = null; }
        root.removeEventListener('keydown', trapModalFocus);
        if (appState.motionLevel === 'off') { clearModalRoot(); return; }
        const backdrop = root.querySelector('.modal-backdrop');
        const panel = root.querySelector('.modal-panel');
        if (backdrop) backdrop.style.animation = 'backdropOut var(--dur-1) var(--ease-soft) both';
        if (panel) panel.style.animation = 'modalOut var(--dur-2) var(--ease-out) both';
        modalCloseTimer = setTimeout(() => { modalCloseTimer = null; clearModalRoot(); }, 200);
      }

      // ================= 视图系统（每次导航重新生成 DOM，动画必然重放） =================
      // ================= 滚动记忆 =================
      function viewKey() {
        if (appState.currentView === 'exam') {
          return ['exam', appState.currentSubjectId, appState.currentCategory, appState.currentMode].join(':');
        }
        if (appState.currentView === 'home') return 'home';
        return [appState.currentView, appState.currentSubjectId || ''].join(':');
      }
      function rememberScroll() {
        appState.scrollMemo[viewKey()] = window.scrollY || 0;
      }
      function restoreScroll(key) {
        const y = appState.scrollMemo[key];
        // 用两参数形式，瞬时定位；不加全局 scroll-behavior:smooth，否则会与 offsetWidth 强制重排打架
        if (typeof y === 'number' && y > 0) window.scrollTo(0, y);
        else window.scrollTo(0, 0);
      }
      function navigateTo(view, opts = {}) {
        const prev = appState.currentView;
        rememberScroll();
        const push = (v) => { if (appState.navStack[appState.navStack.length - 1] !== v) appState.navStack.push(v); };
        if (prev === 'upload' && view !== 'upload') window._cancelRecognition?.(true);
        const noStack = appState._suppressStack;
        appState._suppressStack = false;
        appState._navDirection = opts.back ? 'back' : 'forward';
        appState.currentView = view;
        if (!opts.replace && !noStack && !opts.back) push(view);
        renderView();
      }
      function goBack() {
        // 已在栈底就不再弹：否则连按返回会把 navStack 弹空，之后每次 _back() 都变成无效操作
        if (appState.navStack.length <= 1) return;
        rememberScroll();
        appState.navStack.pop();
        if (appState.currentView === 'result' && appState.navStack[appState.navStack.length - 1] === 'exam') appState.navStack.pop();
        const target = appState.navStack[appState.navStack.length - 1] || 'home';
        appState._suppressStack = true;
        appState._navDirection = 'back';
        navigateTo(target, { back: true, replace: true });
      }
      window._back = goBack;

      function renderView() {
        const app = document.getElementById('app');
        const html = renderCurrentView();
        const key = viewKey();
        const swapContent = (h) => {
          app.innerHTML = h;
          bindEvents();
          if (appState.currentView === 'exam') updateExamUI();
          if (appState.currentView === 'browse') window._filterBrowse?.();
          if (appState.currentView === 'result') animateResult();
          restoreScroll(key);
        };
        const dir = appState._navDirection || 'forward';
        // 只切 .vt-back：:root 默认 --vt-in: vtIn，.vt-back 覆盖为 vtInLeft
        document.documentElement.classList.toggle('vt-back', dir === 'back');
        const canVT = typeof document.startViewTransition === 'function' && appState.motionLevel !== 'off';
        if (canVT) {
          try { document.startViewTransition(() => swapContent(html)); return; } catch (e) {}
        }
        swapContent(html);
      }

      function renderCurrentView() {
        switch (appState.currentView) {
          case 'home': return renderHomePage();
          case 'subject': return renderSubjectPage();
          case 'exam': return renderExamPage();
          case 'upload': return renderUploadPage();
          case 'log': return renderLogPage();
          case 'browse': return renderBrowsePage();
          case 'changelog': return renderChangelogPage();
          case 'result': return renderResultPage();
          default: return renderHomePage();
        }
      }

      // ================= 正确率趋势卡片 =================
      function renderStatsCard() {
        const stats = (appState.stats || []).slice(-14);
        const total = (appState.stats || []).length;
        if (!stats.length) {
          return `<div class="card-elegant p-4 rise-item" style="animation-delay:80ms">
            <h2 class="font-semibold mb-1">正确率趋势</h2>
            <p class="text-xs text-secondary py-4 text-center">完成一次练习后，这里会生成正确率趋势图</p>
          </div>`;
        }
        const W = 320, H = 108, P = 10;
        const lineY = H - P - 8;
        const pts = stats.map((s, i) => ({
          x: stats.length === 1 ? W / 2 : P + (i * (W - P * 2)) / (stats.length - 1),
          y: lineY - (Math.max(0, Math.min(100, s.acc)) / 100) * (H - P * 2 - 16),
          s, i,
        }));
        const poly = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
        const areaPath = pts.length > 1 ? `M${pts[0].x},${H - P} L${pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L')} L${pts[pts.length-1].x},${H - P} Z` : '';
        const avg = Math.round(stats.reduce((s2, x) => s2 + x.acc, 0) / stats.length);
        const best = Math.max(...stats.map(s => s.acc));
        const dotColor = acc => acc >= 80 ? '#34c759' : acc >= 60 ? '#0071e3' : '#ff3b30';
        const grid = [25, 50, 75].map(g => {
          const y = lineY - (g / 100) * (H - P * 2 - 16);
          return `<line x1="${P}" y1="${y.toFixed(1)}" x2="${W - P}" y2="${y.toFixed(1)}" stroke="var(--border-light)" stroke-width="1" stroke-dasharray="3 4"/>`;
        }).join('');
        const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.2" fill="${dotColor(p.s.acc)}"><title>${escapeHtml(p.s.date)} · ${p.s.acc}%（${escapeHtml(p.s.subjectName || '')}）</title></circle>`).join('');
        return `
        <div class="card-elegant p-4 rise-item" style="animation-delay:80ms">
          <div class="flex justify-between items-center mb-2">
            <h2 class="font-semibold">正确率趋势</h2>
            <span class="text-xs text-secondary">最近 ${stats.length} 次练习</span>
          </div>
          <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="最近 ${stats.length} 次练习的正确率趋势，平均 ${avg}%，最佳 ${best}%" style="width:100%;height:auto" preserveAspectRatio="none">
            ${grid}
            ${pts.length > 1 ? `<polyline points="${poly}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
            ${pts.length > 1 ? `<path d="${areaPath}" fill="rgba(0,113,227,.06)"/>` : ''}
            ${dots}
          </svg>
          <div class="flex justify-between mt-1" style="font-size:10px;color:var(--text-secondary)">
            <span>${escapeHtml(pts[0].s.date)}</span><span>${escapeHtml(pts[pts.length-1].s.date)}</span>
          </div>
          <div class="grid grid-cols-3 gap-2 mt-3">
            <div class="stat-tile"><div class="stat-value">${total}</div><div class="stat-label">练习次数</div></div>
            <div class="stat-tile"><div class="stat-value" style="color:var(--accent)">${avg}%</div><div class="stat-label">平均正确率</div></div>
            <div class="stat-tile"><div class="stat-value" style="color:var(--green-text)">${best}%</div><div class="stat-label">最佳成绩</div></div>
          </div>
        </div>`;
      }

      function startExam(subId, cat, mode) {
        const sub = appState.subjects[subId];
        if (!sub) return;
        let items = [];
        if (cat === 'comprehensive') {
          for (const t of ['single','multi','judge','fill','short']) {
            for (const q of (sub.questions[t] || [])) items.push(Object.assign({}, q, { _type: t }));
          }
        } else if (cat === 'wrong') {
          const wb = appState.wrongBook && appState.wrongBook[subId];
          if (!wb || !totalWrongCount(subId)) { showToast('错题本是空的，完成练习后会自动收录错题','error'); return; }
          for (const t of ['single','multi','judge','fill','short']) {
            for (const q of (wb[t] || [])) items.push(Object.assign({}, q, { _type: t }));
          }
        } else {
          for (const q of (sub.questions[cat] || [])) items.push(Object.assign({}, q, { _type: cat }));
        }
        if (mode !== 'view') {
          const before = items.length;
          items = items.filter(q => !questionNeedsReview(q._type, q));
          if (before !== items.length) showToast(`${before - items.length} 道答案待核对的题目已跳过，请修正后再练习`,'info');
        }
        if (!items.length) return showToast('该分类暂无题目','error');
        appState.currentSubjectId = subId;
        appState.currentCategory = cat;
        appState._originalOrder = items;
        appState.currentQuestions = mode === 'shuffle' ? shuffleArr(items) : items.slice();
        appState.currentMode = mode;
        appState._sessionStartMode = mode;
        appState._lastAnswerMode = mode === 'view' ? 'order' : mode;
        appState.currentIndex = 0;
        appState.answeredSet = {};
        appState.userAnswers = {};
        appState.multiTempSelections = [];
        appState.examStartTime = Date.now();
        appState.lastResult = null;
        navigateTo('exam');
      }

      function updateExamUI(opts = {}) {
        const questions = appState.currentQuestions;
        if (!questions.length) return;
        const idx = appState.currentIndex;
        const qData = questions[idx];
        const cat = qData._type || appState.currentCategory;
        const isView = appState.currentMode === 'view';
        const key = `exam-${idx}`;
        const hasAnswered = appState.answeredSet[key] !== undefined;
        const inner = document.getElementById('questionInner');
        if (!inner) return;
        appState.multiTempSelections = Array.isArray(appState.userAnswers[key]) ? [...appState.userAnswers[key]] : [];
        inner.innerHTML = renderQuestionInner(qData, cat, key, hasAnswered, isView);
        if (!hasAnswered && !isView) {
          const draft = inner.querySelector('#fillInput, #shortInput');
          if (draft) draft.value = appState.userAnswers[key] || '';
        }
        // 切题方向动画：整块题目卡按方向滑入
        const dir = opts.direction || appState._qDirection || 'right';
        const card = document.getElementById('questionCard');
        if (card && appState.motionLevel !== 'off') {
          card.classList.remove('swap-in-right', 'swap-in-left');
          void card.offsetWidth; // 强制重排，让动画能重复播放
          card.classList.add(dir === 'left' ? 'swap-in-left' : 'swap-in-right');
          card.addEventListener('animationend', () => {
            card.classList.remove('swap-in-right', 'swap-in-left');
          }, { once: true });
        }
        updateHeaderStats();
        updatePagination();
        refreshSeg();
        const pf = document.getElementById('progressFill');
        if (pf) {
          const ratio = questions.length ? Object.keys(appState.answeredSet).length / questions.length : 0;
          pf.style.transform = `scaleX(${ratio})`;
        }
        const qi = document.getElementById('qIndicator');
        if (qi) qi.innerHTML = `第 ${idx+1} / ${questions.length} 题${isView?' · 看题模式':''}<span class="kbd-only"> · 键盘 ← → 切题，数字键跳题</span>`;
        const pb = document.getElementById('prevBtn');
        const nb = document.getElementById('nextBtn');
        if (pb) { pb.disabled = idx <= 0; pb.style.opacity = idx <= 0 ? '.4' : '1'; }
        if (nb) { nb.style.opacity = idx >= questions.length-1 ? '.4' : '1'; }
        const rb = document.getElementById('resultBtn');
        if (rb) {
          const answerStates = Object.values(appState.answeredSet);
          const allDone = questions.length > 0 && answerStates.length === questions.length && answerStates.every(v => v === 'correct' || v === 'wrong');
          rb.style.display = (allDone && !isView) ? '' : 'none';
        }
        const cb = document.getElementById('catalogBtn');
        if (cb) cb.style.display = isView ? '' : 'none';
        // 焦点管理：切换题目后把焦点交回题目标题，键盘/读屏用户不会迷失
        if (opts.focus !== false) {
          const h = inner.querySelector('[data-question-title]');
          if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
        }
      }

      // 只渲染题目区（供 updateExamUI 与后续局部刷新复用）
      function renderQuestionInner(qData, cat, key, hasAnswered, isView) {
        let html = `<p class="text-xs text-secondary mb-2">第 ${appState.currentIndex+1} / ${appState.currentQuestions.length} 题</p>`
                 + `<h3 class="text-lg font-medium mb-4" data-question-title>${escapeHtml(qData.q)}</h3>`;
        if (questionNeedsReview(cat, qData)) return html + '<p class="text-sm" style="color:var(--orange-text)">答案待核对，暂不能参与评分。请在导入预览中修正答案。</p>';
        const optKey = i => `<span class="opt-key">${String.fromCharCode(65+i)}</span>`;
        if (cat === 'single') {
          for (let i=0;i<qData.opts.length;i++) {
            let cls = 'option-elegant';
            if (isView) { cls += ' disabled'; if (i===qData.ans) cls += ' correct-flash'; }
            else {
              if (hasAnswered) cls += ' disabled';
              if (hasAnswered && i===qData.ans) cls += ' correct-flash';
              if (hasAnswered && appState.userAnswers[key]===i && i!==qData.ans) cls += ' wrong-shake';
              if (!hasAnswered && appState.userAnswers[key]===i) cls += ' selected';
            }
            html += `<button class="${cls} mb-2" aria-pressed="${appState.userAnswers[key]===i}"${hasAnswered||isView?' disabled aria-disabled="true"':''} onclick="window._selectSingle(${i},'${key}',${Number(qData.ans)||0})">${optKey(i)}<span class="flex-1 text-left">${escapeHtml(qData.opts[i])}</span>${(hasAnswered||isView)&&i===qData.ans?'<span style="color:var(--green-text)">✓</span>':''}</button>`;
          }
          if (hasAnswered || isView) html += `<div class="mt-3 p-3 rounded-xl text-sm" style="background:color-mix(in srgb, var(--green) 12%, transparent);color:var(--green-text)">正确答案：${String.fromCharCode(65+Number(qData.ans)||0)}. ${escapeHtml(qData.opts[qData.ans])}</div>`;
        } else if (cat === 'multi') {
          const correctAns = (qData.ans || []).map(Number);
          const userSel = appState.userAnswers[key] || [];
          for (let i=0;i<qData.opts.length;i++) {
            let cls = 'option-elegant';
            if (isView) { cls += ' disabled'; if (correctAns.includes(i)) cls += ' correct-flash'; }
            else {
              if (hasAnswered) cls += ' disabled';
              if (hasAnswered && correctAns.includes(i)) cls += ' correct-flash';
              if (hasAnswered && userSel.includes(i) && !correctAns.includes(i)) cls += ' wrong-shake';
              if (!hasAnswered && userSel.includes(i)) cls += ' selected';
            }
            html += `<button class="${cls} mb-2" aria-pressed="${userSel.includes(i)}"${hasAnswered||isView?' disabled aria-disabled="true"':''} onclick="window._toggleMulti(${i},'${key}')">${optKey(i)}<span class="flex-1 text-left">${escapeHtml(qData.opts[i])}</span></button>`;
          }
          if (!hasAnswered && !isView) html += `<button class="btn-primary w-full mt-2" onclick="window._submitMulti('${key}',[${correctAns.join(',')}])">提交答案</button>`;
          if (hasAnswered || isView) {
            const corrLabels = correctAns.map(i=>String.fromCharCode(65+i)).join(' ');
            html += `<div class="mt-3 p-3 rounded-xl text-sm" style="background:color-mix(in srgb, var(--green) 12%, transparent);color:var(--green-text)">正确答案：${corrLabels}</div>`;
          }
        } else if (cat === 'judge') {
          const labels = ['正确','错误'];
          [true,false].forEach((val,i) => {
            let cls = 'option-elegant';
            if (isView) { cls += ' disabled'; if (val===qData.ans) cls += ' correct-flash'; }
            else {
              if (hasAnswered) cls += ' disabled';
              if (hasAnswered && val===qData.ans) cls += ' correct-flash';
              if (hasAnswered && appState.userAnswers[key]===val && val!==qData.ans) cls += ' wrong-shake';
              if (!hasAnswered && appState.userAnswers[key]===val) cls += ' selected';
            }
            html += `<button class="${cls} mb-2" aria-pressed="${appState.userAnswers[key]===val}"${hasAnswered||isView?' disabled aria-disabled="true"':''} onclick="window._selectJudge(${val},'${key}',${qData.ans===true})"><span class="flex-1 text-center">${labels[i]}</span></button>`;
          });
          if (hasAnswered || isView) html += `<div class="mt-3 p-3 rounded-xl text-sm" style="background:color-mix(in srgb, var(--green) 12%, transparent);color:var(--green-text)">正确答案：${qData.ans?'正确':'错误'}</div>`;
        } else if (cat === 'fill') {
          if (hasAnswered || isView) {
            html += `<p>你的答案：<strong>${escapeHtml(appState.userAnswers[key]||'(未填写)')}</strong></p><div class="mt-2 p-3 rounded-xl text-sm" style="background:color-mix(in srgb, var(--green) 12%, transparent);color:var(--green-text)">正确答案：${escapeHtml(fillAnswersText(qData.ans))}</div>`;
          } else {
            html += `<input class="input-elegant" id="fillInput" placeholder="请输入答案" oninput="window._saveDraft('${key}',this.value)"><button class="btn-primary w-full mt-3" onclick="window._submitFill('${key}')">提交答案</button>`;
          }
        } else if (cat === 'short') {
          if (hasAnswered || isView) {
            html += `<p>你的回答：</p><p class="p-3 rounded-xl" style="background:var(--fill-quiet)">${escapeHtml(appState.userAnswers[key]||'(未填写)')}</p><div class="p-3 rounded-xl text-sm" style="background:color-mix(in srgb, var(--green) 12%, transparent);color:var(--green-text)">参考答案：${escapeHtml(qData.a)}</div>`;
            if (appState.answeredSet[key] === 'pending' && !isView) {
              html += `<div class="flex gap-2 mt-3"><button class="btn-primary" onclick="window._selfGradeShort('${key}',true)">我答对了</button><button class="btn-ghost" onclick="window._selfGradeShort('${key}',false)">我答错了</button></div>`;
            }
          } else {
            html += `<textarea class="input-elegant" id="shortInput" oninput="window._saveDraft('${key}',this.value)"></textarea><button class="btn-primary w-full mt-3" onclick="window._submitShort('${key}')">提交回答</button>`;
          }
        }
        return html;
      }

      function refreshSeg() {
        const m = appState.currentMode;
        const seg = document.getElementById('orderSeg');
        if (!seg) return;
        const btns = Array.from(seg.querySelectorAll('.seg-btn'));
        btns.forEach(b => {
          const on = b.dataset.mode === m;
          b.classList.toggle('active', on);
          b.setAttribute('aria-selected', String(on));
        });
        const ind = document.getElementById('segInd');
        const active = btns.find(b => b.dataset.mode === m);
        if (!ind || !active) return;
        // 指示器位置用 transform + width，两个属性都在 Task 4 声明了过渡
        const segRect = seg.getBoundingClientRect();
        const r = active.getBoundingClientRect();
        ind.style.width = r.width + 'px';
        ind.style.transform = `translateX(${r.left - segRect.left}px)`;
      }

      function updateHeaderStats() {
        const total = appState.currentQuestions.length;
        const answered = Object.keys(appState.answeredSet).length;
        const correct = Object.values(appState.answeredSet).filter(v => v === 'correct').length;
        const wrong = Object.values(appState.answeredSet).filter(v => v === 'wrong').length;
        const ac = document.getElementById('answeredCount');
        const cc = document.getElementById('correctCount');
        const wc = document.getElementById('wrongCount');
        if (ac) ac.textContent = `${answered}/${total}`;
        if (cc) cc.textContent = correct;
        if (wc) wc.textContent = wrong;
      }

      function fillAnswersText(ans) {
        const arr = Array.isArray(ans) ? ans : String(ans == null ? '' : ans).split('|');
        return arr.map(s => String(s).trim()).filter(Boolean).join(' 或 ') || '（未提供）';
      }
      function normalizeFillValue(s) {
        return String(s == null ? '' : s).trim().replace(/\s+/g, '').toLowerCase().replace(/[。；;，,：:！!？?]$/, '');
      }

      function updatePagination() {
        const total = appState.currentQuestions.length;
        const idx = appState.currentIndex;
        const container = document.getElementById('jumpBar') || document.getElementById('paginationDots');
        if (!container) return;
        let html = '';
        for (let i=0; i<total; i++) {
          const key = `exam-${i}`;
          const st = appState.answeredSet[key];
          let cls = 'jump-dot';
          if (st === 'correct') cls += ' ok';
          else if (st === 'wrong') cls += ' bad';
          if (i === idx) cls += ' cur';
          html += `<button class="${cls}" onclick="window._goToQ(${i})" aria-label="第 ${i+1} 题" title="第 ${i+1} 题">${i+1}</button>`;
        }
        container.innerHTML = html;
        const cur = container.querySelector('.jump-dot.cur');
        if (cur && typeof cur.scrollIntoView === 'function') {
          cur.scrollIntoView({ inline: 'center', block: 'nearest', behavior: appState.motionLevel === 'off' ? 'auto' : 'smooth' });
        }
      }

      function computeResult() {
        const vals = Object.values(appState.answeredSet);
        if (vals.length !== appState.currentQuestions.length || vals.some(v => v === 'pending')) {
          showToast('请完成全部题目，并对简答题完成自评','error');
          return false;
        }
        const correct = vals.filter(v => v === 'correct').length;
        const wrong = vals.filter(v => v !== 'correct').length;
        const seconds = Math.max(1, Math.round((Date.now() - (appState.examStartTime || Date.now())) / 1000));
        const total = appState.currentQuestions.length;
        const acc = total ? Math.round(correct / total * 100) : 0;
        appState.lastResult = { total, correct, wrong, seconds };
        // 记录正确率趋势
        const d = new Date();
        const date = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        appState.stats = appState.stats || [];
        appState.stats.push({
          t: d.getTime(), date, acc, total, correct, wrong,
          subjectId: appState.currentSubjectId,
          subjectName: (appState.subjects[appState.currentSubjectId] || {}).name || '',
          category: appState.currentCategory,
        });
        if (appState.stats.length > 200) appState.stats = appState.stats.slice(-200);
        saveData();
        return true;
      }

      // ================= 作答报告 =================
      function renderResultPage() {
        const r = appState.lastResult || { total: 0, correct: 0, wrong: 0, seconds: 0 };
        const acc = r.total ? Math.round(r.correct / r.total * 100) : 0;
        const C = 2 * Math.PI * 52;
        const ringColor = acc >= 80 ? 'var(--green)' : acc >= 60 ? 'var(--accent)' : 'var(--red)';
        const grade = acc >= 90 ? '优秀' : acc >= 75 ? '良好' : acc >= 60 ? '及格' : '需加强';
        return `
        <div class="space-y-4">
          <div class="rise-item">
            <button class="btn-ghost text-sm" onclick="window._back()">← 返回题库</button>
            <h2 class="text-xl font-semibold mt-2">${TYPE_NAMES[appState.currentCategory]||'练习'} · 作答报告</h2>
          </div>
          <div class="card-elegant p-6 text-center rise-item" style="animation-delay:60ms">
            <span class="tag-pill" style="margin-bottom:12px">${grade}</span>
            <div class="relative inline-block mt-3" style="width:172px;height:172px">
              <svg class="ring-svg" width="172" height="172" viewBox="0 0 160 160" aria-hidden="true">
                <circle class="ring-bg" cx="80" cy="80" r="52" fill="none" stroke-width="12"/>
                <circle id="resultRing" cx="80" cy="80" r="52" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="stroke:${ringColor};filter:drop-shadow(0 0 10px color-mix(in srgb, ${ringColor} 45%, transparent))"/>
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center">
                <span class="text-4xl font-bold num" id="resultAcc" style="font-family:var(--font-num);letter-spacing:-0.04em">0%</span>
                <span class="text-xs text-secondary mt-1">正确率</span>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-6">
              <div class="stat-tile"><div class="stat-value">${r.total}</div><div class="stat-label">总题数</div></div>
              <div class="stat-tile"><div class="stat-value" style="color:var(--green-text)">${r.correct}</div><div class="stat-label">答对</div></div>
              <div class="stat-tile"><div class="stat-value" style="color:var(--red)">${r.wrong}</div><div class="stat-label">答错</div></div>
            </div>
            <p class="text-sm text-secondary mt-4">用时 ${fmtTime(r.seconds)}</p>
            ${r.wrong?`<p class="text-xs text-secondary mt-2">答错的 ${r.wrong} 题已自动存入错题本，可在题库页随时复习</p>`:''}
            <div class="flex flex-wrap gap-2 justify-center mt-5">
              ${r.wrong ? `<button class="btn-primary press" onclick="window._redoWrong()">重练错题（${r.wrong}）</button>` : '<button class="btn-primary" disabled>全部答对</button>'}
              <button class="btn-ghost press" onclick="window._restartExam()">再来一遍</button>
              <button class="btn-ghost press" onclick="window._back()">返回题库</button>
            </div>
          </div>
        </div>`;
      }

      // 数字滚动：用 easeOutExpo 而非线性步进，且写等宽数字不抖
      function countUp(el, target, dur = 900) {
        if (!el) return;
        if (appState.motionLevel === 'off') { el.textContent = target + '%'; return; }
        const t0 = performance.now();
        const tick = (now) => {
          const p = Math.min(1, (now - t0) / dur);
          const eased = 1 - Math.pow(1 - p, 3);
          el.textContent = Math.round(target * eased) + '%';
          if (p < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }

      function animateResult() {
        const r = appState.lastResult || { total: 0, correct: 0 };
        const acc = r.total ? Math.round(r.correct / r.total * 100) : 0;
        const C = 2 * Math.PI * 52;
        const ring = document.getElementById('resultRing');
        const accEl = document.getElementById('resultAcc');
        requestAnimationFrame(() => {
          if (ring) ring.style.strokeDashoffset = C * (1 - acc / 100);
          countUp(accEl, acc);
        });
        if (acc === 100) burstConfetti();
      }

      // 中心爆发粒子（取代旧版从顶部飘落 5.2 秒的方片）
      function burstConfetti() {
        if (appState.motionLevel === 'off') return;
        const colors = ['#0071e3','#34c759','#ff9500','#af52de','#ffcc00','#30d158'];
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight * 0.42;
        const N = 44;
        for (let i = 0; i < N; i++) {
          const el = document.createElement('div');
          el.className = 'confetti';
          const angle = (Math.PI * 2 * i) / N + (Math.random() - 0.5) * 0.5;
          const dist = 130 + Math.random() * 260;
          const size = 5 + Math.random() * 7;
          el.style.left = cx + 'px';
          el.style.top = cy + 'px';
          el.style.width = size + 'px';
          el.style.height = size + 'px';
          el.style.background = colors[i % colors.length];
          el.style.boxShadow = `0 0 12px ${colors[i % colors.length]}66`;
          el.style.setProperty('--bx', Math.cos(angle) * dist + 'px');
          el.style.setProperty('--by', (Math.sin(angle) * dist + 120) + 'px');
          el.style.setProperty('--bs', (0.3 + Math.random() * 0.5).toFixed(2));
          el.style.setProperty('--br', (Math.random() * 360 - 180) + 'deg');
          el.style.setProperty('--burst-dur', (900 + Math.random() * 700) + 'ms');
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1900);
        }
      }

        const get = id => document.getElementById(id)?.value?.trim() || '';
        const providerId = window._modalCfg.providerId || 'custom';
        const preset = PROVIDER_PRESETS.find(p => p.id === providerId);

          providerId,
          name: providerId === 'custom' ? (get('aiNameInput') || '自定义供应商') : (preset ? preset.name : '自定义供应商'),

      function renderModelListItems() {
        const listEl = document.getElementById('aiModelItems');
        if (!listEl) return;
        const input = document.getElementById('aiModelInput');
        const kw = (input?.value || '').toLowerCase().trim();
        const pid = window._modalCfg.providerId;
        const preset = PROVIDER_PRESETS.find(p => p.id === pid);
        const pool = (window._modelCache && window._modelCache[pid] && window._modelCache[pid].length)
          ? window._modelCache[pid]
          : (preset ? preset.models : []);
        const items = pool.filter(m => !kw || String(m).toLowerCase().includes(kw));
        const cur = window._modalCfg.model;
        if (items.length) {
          listEl.innerHTML = items.map((m, i) => {
            return `<button type="button" class="model-item ${m===cur?'active':''}" data-model-index="${i}"><span class="truncate">${escapeHtml(m)}</span>${m===cur?'<span>✓</span>':''}</button>`;
          }).join('');
          listEl.onclick = e => {
            const button = e.target.closest('[data-model-index]');
            if (button && listEl.contains(button)) window._pickModel(String(items[Number(button.dataset.modelIndex)]));
          };
        } else {
          listEl.innerHTML = `<p class="text-xs text-secondary p-2">${kw ? '没有匹配的模型，可直接在上方输入' : '该供应商暂无预置模型，点击下方按钮获取'}</p>`;
        }
      }

      // ================= 日志页 =================
      function renderLogPage() {
        let logHtml = '';

          logHtml += `<div class="flex gap-3 items-start"><div class="flex flex-col items-center"><div class="timeline-dot" style="background:${i===0?'var(--accent)':i===1?'var(--purple)':'var(--green)'}"></div>${i<CHANGELOG.length-1?'<div class="timeline-line" style="min-height:40px;"></div>':''}</div><div><p class="font-semibold">${log.date} · ${log.version}</p><p class="text-sm text-secondary">${log.content}</p></div></div>`;

          <div class="card-elegant p-5 space-y-5 rise-item" style="animation-delay:50ms">${logHtml}</div>
        </div>`;
