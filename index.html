      // ================= 事件绑定（每次渲染全量绑定，保证所有入口可用） =================
      function bindEvents() {
        window._navigateTo = navigateTo;
        window._closeModal = closeModal;
        window.toggleDarkMode = toggleDarkMode;
        window._setRecognitionMode = (mode) => { window._recognitionMode = mode; };

        // 动效开关
        window._toggleMotion = () => {
          appState.motion = !appState.motion;
          localStorage.setItem(MOTION_KEY, appState.motion ? '1' : '0');
          document.body.classList.toggle('no-motion', !appState.motion);
          const b = document.getElementById('motionBtn');
          if (b) { b.classList.toggle('on', appState.motion); b.title = appState.motion ? '关闭动效' : '开启动效'; }
          showToast(appState.motion ? '动效已开启' : '动效已关闭', 'info');
        };

        // 首页 / 通用
        window._pickSubject = (action) => {
          const ids = Object.keys(appState.subjects);
          if (!ids.length) { showToast('还没有题库，请先上传题库','error'); return; }
          const rows = ids.map((id, i) => {
            const sub = appState.subjects[id];
            const qCount = (sub.questions?.single?.length||0)+(sub.questions?.multi?.length||0)+(sub.questions?.judge?.length||0)+(sub.questions?.fill?.length||0)+(sub.questions?.short?.length||0);
            return `<button class="mode-opt" onclick="window._pickSubjectGo('${id}','${action}')">
              <span class="mode-opt-icon" style="background:rgba(0,113,227,.08);color:var(--accent)">${iconSvg('book', 20)}</span>
              <span class="text-left flex-1 min-w-0"><span class="block font-semibold text-sm truncate">${escapeHtml(sub.name)}</span><span class="text-xs text-secondary">${qCount} 题 · ${escapeHtml(sub.createdAt||'')}</span></span>
              <span style="color:var(--text-secondary);display:inline-flex">${iconSvg('arrowRight', 16)}</span>
            </button>`;
          }).join('');
          openModal(`
            <div class="p-5 sm:p-6 space-y-3">
              <div class="text-center">
                <h3 class="text-lg font-semibold">选择题库</h3>
                <p class="text-sm text-secondary">共 ${ids.length} 个题库 · ${action === 'comp' ? '将进入综合测试' : '选择要复习的题库'}</p>
              </div>
              <div class="space-y-2" style="max-height:50vh;overflow-y:auto">${rows}</div>
              <button class="btn-ghost w-full" onclick="window._closeModal()">取消</button>
            </div>`);
        };
        window._pickSubjectGo = (id, action) => {
          closeModal();
          appState.currentSubjectId = id;
          if (action === 'comp') window._openModePicker('comprehensive');
          else navigateTo('subject');
        };
        window._openSubject = (id) => { appState.currentSubjectId = id; navigateTo('subject'); };
        window._resetAll = () => {
          if (confirm('确定清空所有题库、错题与统计？')) {
            appState.subjects = {};
            appState.wrongBook = {};
            appState.stats = [];
            localStorage.removeItem(STORAGE_KEY);
            navigateTo('home');
            showToast('已重置所有数据','success');
          }
        };
        window._exportBackup = () => {
          const payload = { app:'final_review_system', version:1, exportedAt:new Date().toISOString(), subjects:appState.subjects, wrongBook:appState.wrongBook, stats:appState.stats };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `期末复习系统备份-${new Date().toISOString().split('T')[0]}.json`;
          a.click();
          URL.revokeObjectURL(a.href);
          showToast('备份已导出','success');
        };
        window._importBackup = (event) => {
          const file = event.target.files?.[0];
          if (!file) return;
          readFileAsText(file).then(text => {
            try {
              const data = JSON.parse(text);
              if (!data || typeof data.subjects !== 'object') throw new Error('格式错误');
              let newCount = 0, mergeCount = 0;
              for (let [id, sub] of Object.entries(data.subjects)) {
                if (!appState.subjects[id]) { appState.subjects[id] = sub; newCount++; }
                else {
                  for (let type of ['single','multi','judge','fill','short']) {
                    appState.subjects[id].questions[type] = [...(appState.subjects[id].questions?.[type]||[]), ...(sub.questions?.[type]||[])];
                  }
                  mergeCount++;
                }
              }
              if (data.wrongBook && typeof data.wrongBook === 'object') {
                appState.wrongBook = Object.assign({}, appState.wrongBook, data.wrongBook);
              }
              if (Array.isArray(data.stats)) {
                appState.stats = [...(appState.stats || []), ...data.stats].slice(-200);
              }
              saveData(); renderView();
              showToast(`备份导入完成：新增${newCount}个题库，合并${mergeCount}个题库`,'success');
            } catch (e) { showToast('备份文件解析失败','error'); }
          });
          event.target.value = '';
        };

        // 题库主页
        window._deleteSubject = (id) => { if (confirm('删除该题库？')) { delete appState.subjects[id]; delete appState.wrongBook[id]; saveData(); navigateTo('home'); } };
        window._browseSubject = (id) => { appState.currentSubjectId = id; navigateTo('browse'); };
        window._clearWrongBook = () => {
          const n = totalWrongCount(appState.currentSubjectId);
          if (!n) return showToast('错题本已经是空的','info');
          if (!confirm(`确定清空错题本（${n} 题）？`)) return;
          delete appState.wrongBook[appState.currentSubjectId];
          saveData();
          renderView();
          showToast('错题本已清空','success');
        };
        window._openModePicker = (cat) => {
          const sub = appState.subjects[appState.currentSubjectId];
          if (!sub) return;
          const isComp = cat === 'comprehensive';
          const isWrong = cat === 'wrong';
          let count;
          if (isComp) count = ['single','multi','judge','fill','short'].reduce((s,t) => s + (sub.questions[t]?.length || 0), 0);
          else if (isWrong) count = totalWrongCount(appState.currentSubjectId);
          else count = (sub.questions[cat]?.length || 0);
          if (!count) return showToast(isWrong ? '错题本是空的，完成练习后会自动收录错题' : '该分类暂无题目','error');
          const name = isComp ? '综合测试' : isWrong ? '错题复习' : TYPE_NAMES[cat];
          const iconColor = isWrong ? 'var(--red)' : isComp ? 'var(--purple)' : 'var(--accent)';
          const iconBg = isWrong ? 'rgba(255,59,48,.1)' : isComp ? 'rgba(175,82,222,.1)' : 'rgba(0,113,227,.1)';
          const iconName = isWrong ? 'bookmark' : isComp ? 'target' : 'doc';
          openModal(`
            <div class="p-5 sm:p-6 space-y-3">
              <div class="text-center">
                <span class="mode-opt-icon" style="background:${iconBg};color:${iconColor};margin:0 auto 10px">${iconSvg(iconName, 24)}</span>
                <h3 class="text-lg font-semibold">${name}</h3>
                <p class="text-sm text-secondary">共 ${count} 题 · 选择作答方式</p>
              </div>
              <button class="mode-opt" onclick="window._startExamWith('order')">
                <span class="mode-opt-icon" style="background:rgba(0,113,227,.1);color:var(--accent)">${iconSvg('arrowRight', 22)}</span>
                <span class="text-left"><span class="block font-semibold text-sm">顺序作答</span><span class="text-xs text-secondary">按${isComp?'题型分组':'题目'}顺序逐题作答，即时批改</span></span>
              </button>
              <button class="mode-opt" onclick="window._startExamWith('shuffle')">
                <span class="mode-opt-icon" style="background:rgba(175,82,222,.1);color:var(--purple)">${iconSvg('shuffle', 22)}</span>
                <span class="text-left"><span class="block font-semibold text-sm">乱序作答${isComp?' · 推荐':''}</span><span class="text-xs text-secondary">打乱题目顺序，避免记忆题目位置</span></span>
              </button>
              <button class="mode-opt" onclick="window._startExamWith('view')">
                <span class="mode-opt-icon" style="background:rgba(52,199,89,.1);color:var(--green)">${iconSvg('eye', 22)}</span>
                <span class="text-left"><span class="block font-semibold text-sm">看题模式</span><span class="text-xs text-secondary">直接浏览全部题目与答案，不答题</span></span>
              </button>
              ${isWrong?`<p class="text-xs text-secondary text-center">答对的题目会自动移出错题本</p>`:''}
              <div class="flex gap-2">
                ${isWrong && count>0?`<button class="btn-ghost text-sm" style="color:var(--red)" onclick="window._clearWrongBook()">清空错题本</button>`:''}
                <button class="btn-ghost flex-1" onclick="window._closeModal()">取消</button>
              </div>
            </div>`);
          window._startExamWith = (mode) => { closeModal(); startExam(appState.currentSubjectId, cat, mode); };
        };

        // 浏览
        window._filterBrowse = () => {
          const keyword = document.getElementById('searchInput')?.value.toLowerCase() || '';
          const filtered = (window._allBrowseQuestions || []).filter(q => String(q.question?.q||'').toLowerCase().includes(keyword) || (Array.isArray(q.question?.opts) && q.question.opts.some(o=>String(o||'').toLowerCase().includes(keyword))));
          const container = document.getElementById('browseList');
          if (container) {
            container.innerHTML = filtered.map(q => `
              <div class="card-elegant card-hover p-3">
                <div class="flex justify-between"><span class="tag-pill tag-${q.type}">${q.typeName} #${q.index+1}</span></div>
                <p class="font-medium mt-1">${escapeHtml(q.question.q)}</p>
                ${q.type==='single'?`<div class="text-sm text-secondary">选项：${q.question.opts?.map((o,i)=>String.fromCharCode(65+i)+'. '+escapeHtml(o)).join('；')}</div><p class="text-sm" style="color:var(--green)">答案：${String.fromCharCode(65+Number(q.question.ans))}</p>`:''}
                ${q.type==='multi'?`<div class="text-sm text-secondary">选项：${q.question.opts?.map((o,i)=>String.fromCharCode(65+i)+'. '+escapeHtml(o)).join('；')}</div><p class="text-sm" style="color:var(--green)">答案：${(Array.isArray(q.question.ans)?q.question.ans:[]).map(i=>String.fromCharCode(65+Number(i))).join('')}</p>`:''}
                ${q.type==='judge'?`<p class="text-sm" style="color:var(--green)">答案：${q.question.ans?'正确':'错误'}</p>`:''}
                ${q.type==='fill'?`<p class="text-sm" style="color:var(--green)">答案：${escapeHtml(q.question.ans)}</p>`:''}
                ${q.type==='short'?`<p class="text-sm" style="color:var(--green)">参考答案：${escapeHtml(q.question.a)}</p>`:''}
              </div>`).join('') || '<p class="text-secondary">无匹配题目</p>';
          }
        };

        // 练习页
        window._selectSingle = (opt,key,correct) => { if (appState.answeredSet[key]||appState.currentMode==='view') return; appState.userAnswers[key]=opt; const ok = opt===correct; appState.answeredSet[key]=ok?'correct':'wrong'; afterGrade(key, ok); updateExamUI(); };
        window._toggleMulti = (opt,key) => { if (appState.answeredSet[key]||appState.currentMode==='view') return; const idx = appState.multiTempSelections.indexOf(opt); if(idx>=0) appState.multiTempSelections.splice(idx,1); else appState.multiTempSelections.push(opt); appState.userAnswers[key]=[...appState.multiTempSelections]; updateExamUI(); };
        window._submitMulti = (key,correct) => { if (appState.answeredSet[key]) return; const sel = [...appState.multiTempSelections]; appState.userAnswers[key]=sel; const ok = sel.sort().join(',')===correct.sort().join(','); appState.answeredSet[key]=ok?'correct':'wrong'; appState.multiTempSelections=[]; afterGrade(key, ok); updateExamUI(); };
        window._selectJudge = (val,key,correct) => { if (appState.answeredSet[key]||appState.currentMode==='view') return; appState.userAnswers[key]=val; const ok = val===correct; appState.answeredSet[key]=ok?'correct':'wrong'; afterGrade(key, ok); updateExamUI(); };
        window._submitFill = (key) => {
          if (appState.answeredSet[key]) return;
          const input = document.getElementById('fillInput');
          const ans = input?.value.trim() || '';
          const ref = appState.currentQuestions[appState.currentIndex].ans;
          const accepted = (Array.isArray(ref)?ref:String(ref||'').split('|')).map(normalizeFillValue);
          const ok = accepted.includes(normalizeFillValue(ans));
          appState.userAnswers[key]=ans;
          appState.answeredSet[key]=ok?'correct':'wrong';
          afterGrade(key, ok);
          updateExamUI();
        };
        window._submitShort = (key) => { if (appState.answeredSet[key]) return; const input=document.getElementById('shortInput'); appState.userAnswers[key]=input?.value.trim()||''; appState.answeredSet[key]='pending'; updateExamUI(); };
        window._selfGradeShort = (key, ok) => { if (appState.answeredSet[key] !== 'pending') return; appState.answeredSet[key] = ok ? 'correct' : 'wrong'; afterGrade(key, ok); updateExamUI(); };
        window._prevQuestion = () => { if (appState.currentIndex>0) { appState.currentIndex--; appState.multiTempSelections=[]; updateExamUI(); } };
        window._nextQuestion = () => {
          const total = appState.currentQuestions.length;
          if (appState.currentIndex < total - 1) { appState.currentIndex++; appState.multiTempSelections=[]; updateExamUI(); }
          else if (total && Object.keys(appState.answeredSet).length === total) { window._goToResult(); }
          else showToast('已到最后一题','info');
        };
        window._goToQ = (i) => { appState.currentIndex = i; appState.multiTempSelections=[]; updateExamUI(); };
        // 看题模式：题目目录跳转
        window._openCatalog = () => {
          const questions = appState.currentQuestions;
          if (!questions.length) return;
          const rows = questions.map((q, i) => {
            const cat = q._type || appState.currentCategory;
            const active = i === appState.currentIndex;
            return `<button class="mode-opt" onclick="window._catalogGo(${i})" style="${active?'border-color:var(--accent);background:rgba(0,113,227,.05)':''}">
              <span class="tag-pill tag-${cat}">${TYPE_NAMES[cat]||cat}</span>
              <span class="text-left flex-1 min-w-0"><span class="block text-sm truncate">${escapeHtml(q.q)}</span></span>
              <span class="text-xs" style="color:var(--text-secondary)">${i+1}</span>
            </button>`;
          }).join('');
          openModal(`
            <div class="p-5 sm:p-6 space-y-3">
              <div class="text-center"><h3 class="text-lg font-semibold">题目目录</h3><p class="text-sm text-secondary">共 ${questions.length} 题 · 点击任意题目跳转</p></div>
              <div class="space-y-2" style="max-height:55vh;overflow-y:auto">${rows}</div>
              <button class="btn-ghost w-full" onclick="window._closeModal()">关闭</button>
            </div>`);
          window._catalogGo = (i) => {
            closeModal();
            appState.currentIndex = i;
            appState.multiTempSelections = [];
            updateExamUI();
          };
        };
        window._setMode = (m) => {
          if (appState.currentMode === m) return;
          if (m === 'view') { appState.currentMode = 'view'; updateExamUI(); return; }
          if (appState.currentMode === 'view') { appState.currentMode = m; appState._lastAnswerMode = m; updateExamUI(); return; }
          if (Object.keys(appState.answeredSet).length && !confirm('切换作答顺序将清空当前答题进度，继续？')) return;
          appState.currentQuestions = m === 'shuffle' ? shuffleArr(appState._originalOrder) : appState._originalOrder.slice();
          appState.currentMode = m;
          appState._lastAnswerMode = m;
          appState.currentIndex = 0;
          appState.answeredSet = {};
          appState.userAnswers = {};
          appState.multiTempSelections = [];
          updateExamUI();
          showToast(m === 'shuffle' ? '已切换为乱序作答' : '已切换为顺序作答','success');
        };
        window._goToResult = () => {
          if (!Object.keys(appState.answeredSet).length) return showToast('还没有作答记录','error');
          computeResult();
          navigateTo('result');
        };
        window._restartExam = () => {
          if (!appState.currentSubjectId || !appState.currentCategory) return navigateTo('subject');
          startExam(appState.currentSubjectId, appState.currentCategory, appState._sessionStartMode || appState._lastAnswerMode || 'order');
        };
        window._redoWrong = () => {
          const wrongIdx = Object.entries(appState.answeredSet)
            .filter(([,v]) => v !== 'correct')
            .map(([k]) => parseInt(k.replace('exam-',''), 10))
            .filter(i => i >= 0)
            .sort((a,b) => a-b);
          if (!wrongIdx.length) return showToast('本次没有错题','success');
          const items = wrongIdx.map(i => appState._originalOrder[i]).filter(Boolean);
          if (!items.length) return showToast('没有可重练的错题','error');
          appState._originalOrder = items;
          appState.currentQuestions = items.slice();
          appState.currentMode = appState._lastAnswerMode === 'view' ? 'order' : (appState._lastAnswerMode || 'order');
          appState._sessionStartMode = appState.currentMode;
          appState.currentIndex = 0;
          appState.answeredSet = {};
          appState.userAnswers = {};
          appState.multiTempSelections = [];
          appState.examStartTime = Date.now();
          appState.lastResult = null;
          showToast(`开始重练 ${items.length} 道错题`,'success');
          navigateTo('exam');
        };

        // 上传页
        window._recognitionMode = window._recognitionMode || 'ai';
        window._readyToImport = false;
        window._parsedQuestions = null;
        window._pendingFiles = null;
        window._recognitionUsedFallback = false;

        window._handleFileUpload = (event) => {
          const files = event.target.files;
          if (!files || !files.length) return;
          const names = Array.from(files).map(f=>f.name).join(', ');
          document.getElementById('uploadStatus').innerHTML = `<span style="font-size:16px;font-weight:600;">已选择：</span><br>${escapeHtml(names)}`;
          document.getElementById('processUploadBtn').disabled = false;
          window._pendingFiles = files;
          window._readyToImport = false;
          window._parsedQuestions = null;
          window._recognitionUsedFallback = false;
          document.getElementById('processUploadBtn').textContent = '开始识别并导入';
        };
        window._parsePastedText = async () => {
          const text = document.getElementById('pasteTextarea')?.value.trim();
          if (!text) return showToast('请粘贴文本','error');
          window._pendingFiles = null;
          window._recognitionUsedFallback = false;
          const parsed = await doRecognitionV2(text);
          if (parsed) {
            displayPreview(parsed);
            window._parsedQuestions = parsed;
            window._readyToImport = true;
            document.getElementById('processUploadBtn').disabled = false;
            document.getElementById('processUploadBtn').textContent = '导入识别结果';
          }
        };
        window._processUploadedFile = async () => {
          if (window._readyToImport && window._parsedQuestions) {
            await importParsedQuestionsV2(window._parsedQuestions);
            return;
          }
          window._recognitionUsedFallback = false;
          const files = window._pendingFiles;
          if (!files || !files.length) return showToast('请选择文件或粘贴文本','error');
          document.getElementById('uploadStatus').innerHTML = '<span>正在解析文件...</span>';
          document.getElementById('processUploadBtn').disabled = true;
          let allText = '';
          for (const file of files) {
            try { allText += await extractTextFromFileV2(file) + '\n\n'; } catch(e) { showToast(`解析 ${file.name} 失败`,'error'); }
          }
          if (!allText.trim()) {
            document.getElementById('uploadStatus').innerHTML = '<span style="color:var(--red)">未提取到文本</span>';
            document.getElementById('processUploadBtn').disabled = false;
            return;
          }
          const parsed = await doRecognitionV2(allText);
          if (!parsed) { document.getElementById('processUploadBtn').disabled = false; return; }
          displayPreview(parsed);
          window._parsedQuestions = parsed;
          window._readyToImport = true;
          document.getElementById('uploadStatus').innerHTML = window._recognitionUsedFallback
            ? '<span style="color:orange">AI识别失败/不可用，已改用本地规则识别完成，请仔细核对题型。</span>'
            : '<span style="color:var(--green)">识别完成！</span>';
          document.getElementById('processUploadBtn').disabled = false;
          document.getElementById('processUploadBtn').textContent = '导入识别结果';
        };
        window._showDetailPreview = () => {
          if (!window._parsedQuestions) return;
          window._editableQuestions = JSON.parse(JSON.stringify(window._parsedQuestions));
          const editorDiv = document.getElementById('detailEditor');
          if (editorDiv) {
            editorDiv.style.display = 'block';
            editorDiv.innerHTML = renderDetailEditor();
            bindDetailEditorEvents();
            editorDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        };

        // AI 配置弹窗
        window._openAiModal = () => {
          window._modalCfg = Object.assign({}, appState.aiConfig || defaultAiConfig());
          window._modelCache = window._modelCache || {};
          openModal(`<div id="aiModalInner">${aiModalHtml()}</div>`);
        };
        window._pickProvider = (id) => {
          const keyInput = document.getElementById('aiKeyInput');
          window._modalCfg.apiKey = keyInput ? keyInput.value : window._modalCfg.apiKey;
          const p = PROVIDER_PRESETS.find(x => x.id === id);
          window._modalCfg.providerId = id;
          if (p.id !== 'custom') {
            window._modalCfg.name = p.name;
            window._modalCfg.baseUrl = p.baseUrl;
            window._modalCfg.model = p.models[0] || '';
            window._modalCfg.displayName = p.displayName;
          } else {
            window._modalCfg.name = '';
            window._modalCfg.baseUrl = '';
            window._modalCfg.model = '';
            window._modalCfg.displayName = '';
          }
          const inner = document.getElementById('aiModalInner');
          if (inner) inner.innerHTML = aiModalHtml();
        };
        window._toggleKeyVis = (btn) => {
          const inp = document.getElementById('aiKeyInput');
          if (!inp) return;
          const show = inp.type === 'password';
          inp.type = show ? 'text' : 'password';
          btn.innerHTML = iconSvg(show ? 'eyeOff' : 'eye', 16);
        };
        window._toggleModelList = () => {
          const panel = document.getElementById('aiModelList');
          if (!panel) return;
          if (panel.style.display === 'none') { panel.style.display = 'block'; window._renderModelList(); }
          else panel.style.display = 'none';
        };
        window._openModelList = () => {
          const panel = document.getElementById('aiModelList');
          if (!panel) return;
          panel.style.display = 'block';
          window._renderModelList();
          const pid = window._modalCfg.providerId;
          if (!(window._modelCache && window._modelCache[pid] && window._modelCache[pid].length)) {
            const keyInput = document.getElementById('aiKeyInput');
            const urlInput = document.getElementById('aiUrlInput');
            if (keyInput?.value && urlInput?.value) window._fetchModels(true);
          }
        };
        window._renderModelList = renderModelListItems;
        window._pickModel = (m) => {
          window._modalCfg.model = m;
          const input = document.getElementById('aiModelInput');
          if (input) input.value = m;
          const panel = document.getElementById('aiModelList');
          if (panel) panel.style.display = 'none';
          window._renderModelList();
        };
        window._fetchModels = async (silent) => {
          const cfg = readModalFields();
          const base = String(cfg.baseUrl || '').trim().replace(/\/+$/, '');
          if (!base || !cfg.apiKey) { showToast('请先填写 API 地址和 API Key','error'); return; }
          const url = base.replace(/\/chat\/completions$/i, '') + '/models';
          const btn = document.getElementById('fetchModelsBtn');
          const note = document.getElementById('modelFetchNote');
          if (note) note.textContent = '';
          if (btn) { btn.disabled = true; btn.textContent = '获取中…'; }
          try {
            const res = await fetch(url, {
              headers: { 'Authorization': 'Bearer ' + cfg.apiKey, 'Accept': 'application/json' }
            });
            if (!res.ok) throw new Error('接口返回 ' + res.status);
            const data = await res.json();
            const list = (Array.isArray(data.data) ? data.data.map(m => m.id || m) : []).filter(Boolean);
            if (!list.length) throw new Error('未解析到模型列表');
            window._modelCache = window._modelCache || {};
            window._modelCache[window._modalCfg.providerId] = list;
            window._modalCfg.model = list.includes(cfg.model) ? cfg.model : list[0];
            const mi = document.getElementById('aiModelInput');
            if (mi) mi.value = window._modalCfg.model;
            if (!silent) showToast(`已获取 ${list.length} 个可用模型`,'success');
            window._renderModelList();
          } catch (e) {
            if (note) note.textContent = '获取失败：' + (e.message || e);
            if (!silent) showToast('获取模型失败：' + (e.message || e),'error');
          } finally {
            if (btn) { btn.disabled = false; btn.textContent = '获取供应商可用模型'; }
          }
        };
        window._toggleRegList = () => {
          const el = document.getElementById('regList');
          if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
        };
        window._saveAiConfigModal = () => {
          const cfg = readModalFields();
          if (!cfg.baseUrl || !cfg.model) { showToast('请填写 API 地址和模型名称','error'); return; }
          cfg.displayName = cfg.displayName || cfg.model;
          appState.aiConfig = cfg;
          appState.apiKey = cfg.apiKey;
          saveAiConfigToStorage(cfg);
          closeModal();
          updateAiSummary();
          showToast('AI 配置已保存：' + cfg.name + ' / ' + cfg.displayName,'success');
        };

        // 详情编辑
        window._addQuestion = (type) => {
          const newQ = type==='single'?{q:'新题目',opts:['选项A','选项B','选项C','选项D'],ans:0}:
                       type==='multi'?{q:'新题目',opts:['选项A','选项B','选项C','选项D'],ans:[0]}:
                       type==='judge'?{q:'新题目',ans:true}:
                       type==='fill'?{q:'新题目',ans:'答案'}:
                       {q:'新题目',a:'参考答案'};
          window._editableQuestions[type].push(newQ);
          document.getElementById('detailEditor').innerHTML = renderDetailEditor();
          bindDetailEditorEvents();
        };
        window._deleteQuestion = (idx) => {
          const all = [];
          for (let type of ['single','multi','judge','fill','short']) {
            (window._editableQuestions[type]||[]).forEach((q, i) => all.push({ type, index: i }));
          }
          const item = all[idx];
          window._editableQuestions[item.type].splice(item.index, 1);
          document.getElementById('detailEditor').innerHTML = renderDetailEditor();
          bindDetailEditorEvents();
        };
        window._updateQ = (idx, field, value) => {
          const all = [];
          for (let type of ['single','multi','judge','fill','short']) {
            (window._editableQuestions[type]||[]).forEach((q, i) => all.push({ type, index: i, question: q }));
          }
          const item = all[idx];
          if (field === 'opts' && typeof value === 'string') value = value.split(',').map(s=>s.trim());
          window._editableQuestions[item.type][item.index][field] = value;
        };
        window._saveEdits = () => {
          window._parsedQuestions = window._editableQuestions;
          displayPreview(window._parsedQuestions);
          document.getElementById('detailEditor').style.display = 'none';
          showToast('修改已保存','success');
        };
      }

      // ================= 详情编辑渲染 =================
      function renderDetailEditor() {
        const all = [];
        for (let type of ['single','multi','judge','fill','short']) {
          (window._editableQuestions[type]||[]).forEach((q, i) => all.push({ type, index: i, question: q }));
        }
        let html = `<div class="space-y-4"><h3 class="font-semibold">题目详情编辑</h3><div class="flex gap-2 mb-3 flex-wrap"><button class="btn-ghost text-sm" onclick="window._addQuestion('single')">＋单选</button><button class="btn-ghost text-sm" onclick="window._addQuestion('multi')">＋多选</button><button class="btn-ghost text-sm" onclick="window._addQuestion('judge')">＋判断</button><button class="btn-ghost text-sm" onclick="window._addQuestion('fill')">＋填空</button><button class="btn-ghost text-sm" onclick="window._addQuestion('short')">＋简答</button></div>`;
        all.forEach((item, idx) => {
          const q = item.question;
          html += `<div class="card-elegant p-3" id="editQ-${idx}">
            <div class="flex justify-between"><span class="tag-pill tag-${item.type}">${TYPE_NAMES[item.type]||item.type} #${item.index+1}</span><button class="btn-ghost text-sm" onclick="window._deleteQuestion(${idx})" style="color:var(--red)">删除</button></div>
            <label class="text-xs">题干</label><input class="input-elegant text-sm" value="${escapeHtml(q.q)}" onchange="window._updateQ(${idx},'q',this.value)">
            ${item.type==='single'||item.type==='multi'?`<div class="mt-2"><label class="text-xs">选项（用逗号分隔）</label><input class="input-elegant text-sm" value="${escapeHtml((q.opts||[]).join(','))}" onchange="window._updateQ(${idx},'opts',this.value)"></div>`:''}
            ${item.type==='single'?`<label class="text-xs">答案（0-3）</label><input class="input-elegant text-sm w-20" type="number" min="0" value="${q.ans}" onchange="window._updateQ(${idx},'ans',parseInt(this.value))">`:''}
            ${item.type==='multi'?`<label class="text-xs">答案（索引，逗号分隔）</label><input class="input-elegant text-sm" value="${(q.ans||[]).join(',')}" onchange="window._updateQ(${idx},'ans',this.value.split(',').map(Number))">`:''}
            ${item.type==='judge'?`<label class="text-xs">答案</label><select class="input-elegant text-sm" onchange="window._updateQ(${idx},'ans',this.value==='true')"><option ${q.ans?'selected':''} value="true">正确</option><option ${!q.ans?'selected':''} value="false">错误</option></select>`:''}
            ${item.type==='fill'?`<label class="text-xs">答案</label><input class="input-elegant text-sm" value="${escapeHtml(q.ans)}" onchange="window._updateQ(${idx},'ans',this.value)">`:''}
            ${item.type==='short'?`<label class="text-xs">参考答案</label><textarea class="input-elegant text-sm" onchange="window._updateQ(${idx},'a',this.value)">${escapeHtml(q.a)}</textarea>`:''}
          </div>`;
        });
        html += `<button class="btn-primary mt-3" onclick="window._saveEdits()">保存修改并返回</button></div>`;
        return html;
      }
      function bindDetailEditorEvents() { /* 所有编辑函数已在 bindEvents 中全量绑定 */ }

      function displayPreview(parsed) {
        const area = document.getElementById('previewArea');
        const content = document.getElementById('previewContent');
        if (area) area.style.display = 'block';
        if (content) content.innerHTML = `
          <p>单选题：${parsed.single.length} 多选题：${parsed.multi.length} 判断题：${parsed.judge.length} 填空题：${parsed.fill.length} 简答题：${parsed.short.length}</p>
          <p class="mt-1"><strong>总计 ${parsed.single.length+parsed.multi.length+parsed.judge.length+parsed.fill.length+parsed.short.length} 道</strong></p>`;
      }

      // ================= V2：通用题库解析（本地规则 + 多供应商 AI） =================
      const RECOGNITION_SYSTEM_PROMPT = `你是一名专业的题库解析专家。请从用户提供的文本中提取所有题目，严格输出 JSON，不要遗漏、不要编造。

## 一、题型判定规则（最重要）
1. 单选题：题干标有“单选题/单选”，或只有一个选项字母（如答案：A），或问“正确的一项是”。答案必须是 0 开始的选项索引。
2. 多选题：题干标有“多选题/多选/不定项/至少两个/选择所有正确”，或答案字段含有两个及以上字母（如答案：AB、BCD）。即使题干没有写“多选”，只要答案有多个字母，也必须判定为多选。答案输出索引数组。
3. 判断题：题干要求判断对错、有“对/错”“正确/错误”“√/×”，或答案只有“√/×/正确/错误”。判定为判断，不要和单选混淆。
4. 填空题：题干有 “（ ）” “( )” “____” 等空缺，或题目标注“填空”。无选项。
5. 简答题：没有选项、需要文字作答，题目标注“简答/问答/论述/名词解释”，或答案是一整句解释。

## 二、填空题题干清理规则（非常重要）
如果原文题干中已经写入了答案，必须把答案从题干中删掉，换成空白，再放进 q 字段：
- “路用列车是专为运送铁路自用物资或设备的（路用）列车。答案：路用” → 输出 {"q":"路用列车是专为运送铁路自用物资或设备的（ ）列车。","ans":"路用"}
- “调车工作必须坚持（集中领导）的原则” → 输出 {"q":"调车工作必须坚持（ ）的原则","ans":"集中领导"}
- “___五短声___” → 输出 {"q":"____","ans":"五短声"}
- 答案只允许出现在 ans 字段，q 字段中不允许再出现答案内容。

## 三、输出格式
只输出一个 JSON 对象，不要输出代码块标记、不要输出其他文字。结构必须包含五个数组，没有题目也要输出空数组：
{
  "single": [{"q":"题干","opts":["选项A","选项B","选项C","选项D"],"ans":0}],
  "multi": [{"q":"题干","opts":["选项A","选项B","选项C","选项D"],"ans":[0,2]}],
  "judge": [{"q":"题干","ans":true}],
  "fill": [{"q":"含（ ）的题干","ans":"答案"}],
  "short": [{"q":"题干","a":"参考答案"}]
}
所有字符串用双引号，不要尾随逗号。单选题 ans 用数字索引；多选题 ans 用数字索引数组；判断题 ans 用 true/false。

## 四、思考要求
在输出最终 JSON 之前，先在 <thinking> 标签内逐题说明题型判断依据，重点说明“单选还是多选”和“填空题答案是否已从题干删除”。示例：
<thinking>
题目1：答案只有一个字母 A，判定单选。
题目2：答案 AB，判定多选。
题目3：题干括号内已写答案，已删除并替换为（ ）。
</thinking>`;

      function buildChatEndpoint(base) {
        let b = String(base || '').trim().replace(/\/+$/, '');
        if (!b) return '';
        if (/\/chat\/completions$/i.test(b)) return b;
        return b + '/chat/completions';
      }
      function looksLikeCorsError(e) {
        const m = String((e && e.message) || e);
        return /failed to fetch|networkerror|load failed|cors|blocked by|mixed content/i.test(m);
      }
      function chunkText(text, maxLen = 9000) {
        const blocks = splitBlocksV2(text);
        const chunks = [];
        let cur = '';
        for (const b of blocks) {
          const joinLen = cur ? cur.length + 2 + b.length : b.length;
          if (b.length > maxLen) {
            if (cur) { chunks.push(cur); cur = ''; }
            for (let p = 0; p < b.length; p += maxLen) chunks.push(b.slice(p, p + maxLen));
          } else if (joinLen > maxLen && cur) { chunks.push(cur); cur = b; }
          else cur = cur ? cur + '\n\n' + b : b;
        }
        if (cur) chunks.push(cur);
        if (!chunks.length && text.trim()) chunks.push(text.trim());
        return chunks;
      }
      function mergeParsedResults(a, b) {
        for (let type of ['single','multi','judge','fill','short']) {
          if (Array.isArray(b[type])) a[type].push(...b[type]);
        }
        return a;
      }
      function dedupeParsedQuestions(parsed) {
        for (let type of ['single','multi','judge','fill','short']) {
          const seen = new Set();
          parsed[type] = (parsed[type] || []).filter(q => {
            const key = type + '::' + String(q.q || '').trim();
            if (!q.q || seen.has(key)) return false;
            seen.add(key);
            return true;
          });
        }
        return parsed;
      }
      function parseAnswerIndices(ans, optsLen) {
        const out = [];
        const push = n => {
          n = Number(n);
          if (Number.isInteger(n) && n >= 0 && n < optsLen && !out.includes(n)) out.push(n);
        };
        if (Array.isArray(ans)) ans.forEach(push);
        else if (typeof ans === 'number') push(ans);
        else if (typeof ans === 'string') {
          const s = ans.trim();
          if (/,/.test(s)) s.split(',').forEach(x => {
            x = x.trim();
            if (/^[0-9]+$/.test(x)) push(parseInt(x, 10));
            else if (/^[A-H]$/i.test(x)) push(x.toUpperCase().charCodeAt(0) - 65);
          });
          else {
            const letters = s.toUpperCase().replace(/[^A-H0-9]/g, '');
            for (const ch of letters) {
              if (/[0-9]/.test(ch)) push(parseInt(ch, 10));
              else push(ch.charCodeAt(0) - 65);
            }
          }
        }
        return out;
      }
      function parseJudgeAnswer(ans) {
        if (typeof ans === 'boolean') return ans;
        const s = String(ans || '').trim();
        if (/^(true|t|yes|y)$/i.test(s)) return true;
        if (/^(false|f|no|n)$/i.test(s)) return false;
        return ['√','✓','对','正确','是'].includes(s);
      }
      function cleanQuestionText(q) {
        return String(q || '').replace(/[ \t]+/g, ' ').replace(/\n+/g, ' ').trim();
      }
      function stripAnswerFromFillQuestion(q, ansList) {
        let out = String(q || '');
        for (const raw of ansList) {
          const a = String(raw || '').trim();
          if (!a) continue;
          const esc = a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          out = out.replace(new RegExp('（\\s*' + esc + '\\s*）', 'g'), '（ ）');
          out = out.replace(new RegExp('\\(\\s*' + esc + '\\s*\\)', 'g'), '( )');
          out = out.replace(new RegExp('【\\s*' + esc + '\\s*】', 'g'), '【 】');
          out = out.replace(new RegExp('_{3,}\\s*' + esc + '\\s*_{3,}', 'g'), '____');
        }
        return out;
      }
      function normalizeParsedQuestions(raw) {
        const out = { single:[], multi:[], judge:[], fill:[], short:[] };
        if (!raw || typeof raw !== 'object') return out;
        const list = key => Array.isArray(raw[key]) ? raw[key] : (raw[key] ? [raw[key]] : []);
        for (const item of list('single')) {
          if (!item || typeof item.q !== 'string' || !item.q.trim()) continue;
          const opts = (Array.isArray(item.opts) ? item.opts : []).map(o => String(o ?? '').trim()).filter(Boolean);
          if (opts.length < 2) continue;
          const parsed = parseAnswerIndices(item.ans, opts.length);
          out.single.push({ q: cleanQuestionText(item.q), opts, ans: parsed.length ? parsed[0] : 0 });
        }
        for (const item of list('multi')) {
          if (!item || typeof item.q !== 'string' || !item.q.trim()) continue;
          const opts = (Array.isArray(item.opts) ? item.opts : []).map(o => String(o ?? '').trim()).filter(Boolean);
          if (opts.length < 2) continue;
          const parsed = parseAnswerIndices(item.ans, opts.length);
          out.multi.push({ q: cleanQuestionText(item.q), opts, ans: parsed.length ? parsed : [0] });
        }
        for (const item of list('judge')) {
          if (!item || typeof item.q !== 'string' || !item.q.trim()) continue;
          out.judge.push({ q: cleanQuestionText(item.q), ans: parseJudgeAnswer(item.ans) });
        }
        for (const item of list('fill')) {
          if (!item || typeof item.q !== 'string' || !item.q.trim()) continue;
          let ansList = Array.isArray(item.ans) ? item.ans : String(item.ans == null ? '' : item.ans).split('|');
          ansList = ansList.map(s => String(s).trim()).filter(Boolean);
          if (!ansList.length) continue;
          out.fill.push({ q: cleanQuestionText(stripAnswerFromFillQuestion(item.q, ansList)), ans: ansList.join('|') });
        }
        for (const item of list('short')) {
          if (!item || typeof item.q !== 'string' || !item.q.trim()) continue;
          out.short.push({ q: cleanQuestionText(item.q), a: String(item.a || '').trim() || '（参考答案略）' });
        }
        return out;
      }

      async function doRecognitionV2(text) {
        const mode = window._recognitionMode || 'ai';
        if (mode === 'local') {
          window._recognitionUsedFallback = false;
          return normalizeParsedQuestions(parseQuestionsFromTextV2(text));
        }
        return await aiRecognitionV2(text);
      }

      // ========== V2：AI 识别（流式 + 实时思考展示） ==========
      async function aiRecognitionV2(text) {
        const cfg = appState.aiConfig || loadAiConfig();
        appState.aiConfig = cfg;
        const statusEl = document.getElementById('uploadStatus');
        if (!cfg.baseUrl || !cfg.model) {
          showToast('请先在「AI 模型配置」中选择供应商并保存','error');
          window._recognitionUsedFallback = true;
          return normalizeParsedQuestions(parseQuestionsFromTextV2(text));
        }
        if (!cfg.apiKey) {
          showToast('未填写 API Key，已改用本地规则识别','error');
          if (statusEl) statusEl.innerHTML = '<span style="color:orange">未填写 API Key，已自动切换本地规则识别。</span>';
          window._recognitionUsedFallback = true;
          return normalizeParsedQuestions(parseQuestionsFromTextV2(text));
        }
        const modelLabel = cfg.displayName || cfg.model;
        const thinkBoxHtml = '<div id="thinkBox" class="think-box" style="display:none"><div class="flex items-center gap-2 mb-1"><span class="think-dot" id="thinkDot"></span><strong>AI 实时思考</strong><span class="text-xs" id="thinkState">思考中…</span></div><div id="thinkBody"></div></div>';
        if (statusEl) statusEl.innerHTML = '<span>正在调用 ' + escapeHtml(cfg.name) + '（' + escapeHtml(modelLabel) + '）识别<span id="chunkStatus"></span>…</span>' + thinkBoxHtml;

        let thinkStarted = false;
        let curChunk = -1;
        const onThink = (chunk, ci) => {
          const tb = document.getElementById('thinkBox');
          if (!tb) return;
          if (!thinkStarted) { thinkStarted = true; tb.style.display = 'block'; }
          const body = document.getElementById('thinkBody');
          if (!body) return;
          if (ci !== curChunk) {
            if (curChunk >= 0) body.innerHTML += '<div style="opacity:.5;margin:6px 0">— 第 ' + (ci + 1) + ' 段思考 —</div>';
            curChunk = ci;
          }
          body.innerHTML += escapeHtml(chunk).replace(/\n/g, '<br>');
          tb.scrollTop = tb.scrollHeight;
        };
        const finishThink = () => {
          const dot = document.getElementById('thinkDot');
          const st = document.getElementById('thinkState');
          if (dot) dot.style.animation = 'none';
          if (st) st.textContent = '思考完成';
        };

        try {
          const chunks = chunkText(text);
          const merged = { single:[], multi:[], judge:[], fill:[], short:[] };
          for (let i = 0; i < chunks.length; i++) {
            const cs = document.getElementById('chunkStatus');
            if (cs && chunks.length > 1) cs.textContent = '（' + (i + 1) + '/' + chunks.length + ' 段）';
            const { content, reasoning, streamedThinkLen } = await callProviderOnce(chunks[i], cfg, (c) => onThink(c, i));
            if (reasoning && reasoning.length > (streamedThinkLen || 0)) {
              onThink(reasoning.slice(streamedThinkLen || 0), i);
            } else if (!reasoning) {
              const m = String(content || '').match(/<thinking>([\s\S]*?)<\/thinking>/i);
              if (m) onThink(m[1].trim(), i);
            }
            let cleanContent = String(content || '').replace(/<thinking>[\s\S]*?<\/thinking>/gi, '').trim();
            cleanContent = cleanContent.replace(/```json\s*|```/g, '').trim();
            const jsonMatch = cleanContent.match(/\{[\s\S]*\}/);
            if (!jsonMatch) throw new Error('未找到有效的 JSON 对象');
            mergeParsedResults(merged, normalizeParsedQuestions(robustJSONParse(jsonMatch[0])));
          }
          if (thinkStarted) finishThink();
          const result = dedupeParsedQuestions(merged);
          const total = result.single.length + result.multi.length + result.judge.length + result.fill.length + result.short.length;
          if (!total) throw new Error('模型没有识别出任何题目');
          return result;
        } catch (error) {
          console.error('AI识别异常:', error);
          window._recognitionUsedFallback = true;
          if (statusEl) statusEl.innerHTML = '<span style="color:orange">AI识别失败：' + escapeHtml(error.message || error) + '。已自动切换本地规则识别。</span>';
          if (looksLikeCorsError(error)) {
            showToast('浏览器直连失败（很可能是 CORS 限制）。可换供应商，或在高级设置中填写反向代理地址；本次已改用本地识别。','error');
          } else {
            showToast('AI识别失败，已自动切换本地规则识别','error');
          }
          return normalizeParsedQuestions(parseQuestionsFromTextV2(text));
        }
      }

      // 单次调用：优先流式（实时输出 reasoning_content 思考），失败自动降级非流式
      async function callProviderOnce(text, cfg, onThink) {
        const endpoint = buildChatEndpoint(cfg.proxyUrl || cfg.baseUrl);
        if (!endpoint) throw new Error('API 地址为空');
        const headers = { 'Content-Type': 'application/json' };
        if (cfg.apiKey) headers['Authorization'] = 'Bearer ' + cfg.apiKey;
        const messages = [
          { role: 'system', content: RECOGNITION_SYSTEM_PROMPT },
          { role: 'user', content: '请提取以下文本中的所有题目：\n\n' + text }
        ];
        const mkBody = stream => JSON.stringify({ model: cfg.model, messages, temperature: 0.1, stream });
        let streamedThinkLen = 0;
        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers,
            body: mkBody(true)
          });
          if (!response.ok) {
            const body = await response.text().catch(() => '');
            throw new Error('接口返回 ' + response.status + ' ' + body.slice(0, 200));
          }
          if (!response.body || !response.body.getReader) throw new Error('当前浏览器不支持流式读取');
          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buf = '', content = '', reasoning = '';
          const onData = (line) => {
            const t = line.trim();
            if (!t.startsWith('data:')) return;
            const payload = t.slice(5).trim();
            if (payload === '[DONE]') return;
            let j;
            try { j = JSON.parse(payload); } catch (e) { return; }
            const delta = (j.choices && j.choices[0] && j.choices[0].delta) || {};
            if (typeof delta.reasoning_content === 'string' && delta.reasoning_content) {
              reasoning += delta.reasoning_content;
              streamedThinkLen += delta.reasoning_content.length;
              if (onThink) onThink(delta.reasoning_content);
            }
            if (typeof delta.content === 'string' && delta.content) content += delta.content;
          };
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            let idx;
            while ((idx = buf.indexOf('\n')) >= 0) {
              onData(buf.slice(0, idx));
              buf = buf.slice(idx + 1);
            }
          }
          if (content || reasoning) return { content, reasoning, streamedThinkLen };
          throw new Error('模型未返回有效内容（可尝试更换模型）');
        } catch (e) {
          if (looksLikeCorsError(e)) throw e;
          // 非流式兜底
          const response = await fetch(endpoint, {
            method: 'POST',
            headers,
            body: mkBody(false)
          });
          if (!response.ok) {
            const body = await response.text().catch(() => '');
            throw new Error('接口返回 ' + response.status + ' ' + body.slice(0, 200));
          }
          const data = await response.json();
          const msg = (data.choices && data.choices[0] && data.choices[0].message) || {};
          const content = msg.content;
          if (!content) throw new Error('模型未返回有效内容（可尝试更换模型）');
          return { content, reasoning: msg.reasoning_content || msg.reasoning || '', streamedThinkLen: 0 };
        }
      }

      // ========== V2：本地规则识别（增强版） ==========
      function splitBlocksV2(text) {
        const matches = [];
        const regex = /(?:^|\n)\s*(\d{1,3})[、．.)）]\s*/gm;
        let m;
        while ((m = regex.exec(text)) !== null) {
          const pos = m.index;
          if (!matches.length || pos - matches[matches.length - 1].index > 5) matches.push({ index: pos });
        }
        const blocks = [];
        for (let i = 0; i < matches.length; i++) {
          const start = matches[i].index;
          const end = i + 1 < matches.length ? matches[i + 1].index : text.length;
          blocks.push(text.slice(start, end).trim());
        }
        if (!blocks.length && text.trim()) blocks.push(text.trim());
        return blocks;
      }
      function extractOptionsV2(trimmed) {
        const options = [];
        const re = /(?:^|\n)\s*([A-H])[.、．:：)\s]/g;
        const matches = [];
        let m;
        while ((m = re.exec(trimmed)) !== null) matches.push({ index: m.index, len: m[0].length });
        for (let i = 0; i < matches.length; i++) {
          const start = matches[i].index + matches[i].len;
          const end = i + 1 < matches.length ? matches[i + 1].index : trimmed.length;
          options.push(trimmed.slice(start, end).replace(/\s*\n+\s*/g, ' ').trim());
        }
        return options.filter(Boolean);
      }
      function extractAnswerIndicesV2(trimmed) {
        const m = trimmed.match(/(?:标准答案|参考答案|答案)\s*[：:]\s*([A-Ha-h,，、\s]+)/i);
        if (!m) return [];
        const cleaned = m[1].toUpperCase().replace(/[^A-H]/g, '');
        return cleaned.split('').map(c => c.charCodeAt(0) - 65).filter(i => i >= 0);
      }
      function extractJudgeAnswerV2(trimmed) {
        const line = trimmed.match(/(?:标准答案|参考答案|答案)\s*[：:]\s*(√|×|✓|✗|正确|错误|对|错|[TF])/i);
        if (line) return ['√','✓','对','正确','t','T'].includes(line[1]);
        const bracket = trimmed.match(/[（(]\s*(√|×|✓|✗|正确|错误|对|错)\s*[）)]/);
        if (bracket) return ['√','✓','对','正确'].includes(bracket[1]);
        return null;
      }
      function extractFillAnswerV2(trimmed, hasLetterOptions) {
        if (hasLetterOptions) return '';
        const line = trimmed.match(/(?:标准答案|参考答案|答案)\s*[：:]\s*([^\n]+)/i);
        if (line) return line[1].trim();
        const underline = trimmed.match(/_{3,}\s*([^_]{1,40}?)\s*_{3,}/);
        if (underline) return underline[1].trim();
        const bracket = trimmed.match(/[（(【]\s*([^（）()【】\s]{1,40})\s*[）)】]/);
        if (bracket) return bracket[1].trim();
        return '';
      }
      function extractShortAnswerV2(trimmed) {
        const m1 = trimmed.match(/答\s*[：:]\s*([\s\S]+)/i);
        if (m1) return m1[1].trim();
        const m2 = trimmed.match(/(?:标准答案|参考答案|答案)\s*[：:]\s*([\s\S]+)/i);
        if (m2) return m2[1].trim();
        return '';
      }
      function cleanChoiceQuestionV2(trimmed) {
        let q = trimmed;
        q = q.replace(/(?:标准答案|参考答案|答案)\s*[：:]\s*[^\n]*/gi, '');
        q = q.replace(/[（(]\s*(?:√|×|✓|✗|正确|错误|对|错)\s*[）)]/g, '（ ）');
        q = q.replace(/(?:^|\n)\s*[A-H][.、．:：)\s][^\n]*/g, ' ');
        q = q.replace(/(?:^|\n)\s*\d{1,3}[、．.)）]\s*/, ' ');
        q = q.replace(/[【\[]\s*(单选题|多项选择题|多选题|单项选择|单项选择题|不定项选择题?|判断题|填空题|简答题|问答题)\s*[】\]]?/g, ' ');
        return cleanQuestionText(q);
      }
      function cleanFillQuestionV2(trimmed, ans) {
        let q = trimmed;
        q = q.replace(/(?:标准答案|参考答案|答案)\s*[：:]\s*[^\n]*/gi, '');
        if (ans) q = stripAnswerFromFillQuestion(q, [ans]);
        q = q.replace(/[（(【]\s*[^（）()【】]{0,40}\s*[）)】]/g, m => /^[（(【]\s*[）)】]$/.test(m.replace(/\s/g, '')) ? m : (/[（(]/.test(m) ? '（ ）' : '【 】'));
        q = q.replace(/(?:^|\n)\s*\d{1,3}[、．.)）]\s*/, ' ');
        q = q.replace(/[【\[]\s*填空题?\s*[】\]]?/g, ' ');
        return cleanQuestionText(q);
      }
      function identifyBlockV2(block) {
        const trimmed = block.trim();
        if (!trimmed || trimmed.length < 3) return null;
        const options = extractOptionsV2(trimmed);
        const hasLetterOptions = options.length >= 2;
        const answerIndices = extractAnswerIndicesV2(trimmed);
        const judgeAns = extractJudgeAnswerV2(trimmed);
        const fillAns = extractFillAnswerV2(trimmed, hasLetterOptions);
        const shortAns = extractShortAnswerV2(trimmed);
        const explicitMulti = /多选题|多项选择|不定项|多选/.test(trimmed);
        const explicitSingle = /单选题|单项选择|单选/.test(trimmed);
        const explicitJudge = /判断题|判断对错|是非题/.test(trimmed);
        const isFill = (/填空|___|____|（\s*）|\(\s*\)|【\s*】|[（(【][^（）()【】]{1,40}[）)】]/.test(trimmed)) && !hasLetterOptions;
        const isShort = /简答|问答|论述|名词解释/.test(trimmed) && !hasLetterOptions;
        if (explicitJudge || (judgeAns !== null && !hasLetterOptions && !explicitMulti && !isFill)) {
          return { type: 'judge', data: { q: cleanChoiceQuestionV2(trimmed), ans: judgeAns !== null ? judgeAns : true } };
        }
        if (isFill || (fillAns && /___|（\s*）|\(\s*\)|【\s*】|[（(【][^（）()【】]{1,40}[）)】]/.test(trimmed) && !hasLetterOptions && !explicitJudge && !explicitMulti)) {
          const cleanedAns = fillAns || '（请填写）';
          return { type: 'fill', data: { q: cleanFillQuestionV2(trimmed, cleanedAns), ans: cleanedAns } };
        }
        if (hasLetterOptions) {
          if (explicitMulti || answerIndices.length > 1) {
            return { type: 'multi', data: { q: cleanChoiceQuestionV2(trimmed), opts: options, ans: answerIndices.length ? answerIndices : [0] } };
          }
          return { type: 'single', data: { q: cleanChoiceQuestionV2(trimmed), opts: options, ans: answerIndices.length ? Math.min(answerIndices[0], options.length - 1) : 0 } };
        }
        if (isShort || shortAns) {
          return { type: 'short', data: { q: cleanQuestionText(trimmed.replace(/(?:标准答案|参考答案|答案|答)\s*[：:]\s*[\s\S]*$/i, '')), a: shortAns || '（参考答案略）' } };
        }
        return null;
      }
      function parseQuestionsFromTextV2(text) {
        const result = { single:[], multi:[], judge:[], fill:[], short:[] };
        for (const block of splitBlocksV2(text)) {
          const qObj = identifyBlockV2(block);
          if (qObj) result[qObj.type].push(qObj.data);
        }
        return dedupeParsedQuestions(normalizeParsedQuestions(result));
      }

      // ========== 文件文本提取 ==========
      function readFileAsText(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result || '');
          reader.onerror = reject;
          reader.readAsText(file, 'UTF-8');
        });
      }
      function extractDocx(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = async () => {
            try {
              if (typeof mammoth !== 'undefined') {
                const result = await mammoth.extractRawText({ arrayBuffer: reader.result });
                resolve(result.value || '');
              } else resolve('');
            } catch(e) { reject(e); }
          };
          reader.onerror = reject;
          reader.readAsArrayBuffer(file);
        });
      }
      function extractExcel(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              if (typeof XLSX !== 'undefined') {
                const wb = XLSX.read(new Uint8Array(reader.result), { type: 'array' });
                let text = '';
                wb.SheetNames.forEach(name => text += XLSX.utils.sheet_to_csv(wb.Sheets[name]) + '\n');
                resolve(text);
              } else resolve('');
            } catch(e) { reject(e); }
          };
          reader.onerror = reject;
          reader.readAsArrayBuffer(file);
        });
      }
      function extractPdf(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = async () => {
            try {
              if (typeof pdfjsLib !== 'undefined') {
                const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(reader.result) }).promise;
                let text = '';
                for (let i=1; i<=pdf.numPages; i++) {
                  const page = await pdf.getPage(i);
                  const content = await page.getTextContent();
                  text += content.items.map(it => it.str).join(' ') + '\n';
                }
                resolve(text);
              } else resolve('');
            } catch(e) { reject(e); }
          };
          reader.onerror = reject;
          reader.readAsArrayBuffer(file);
        });
      }
      function readTextSmart(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const buf = reader.result;
              if (typeof TextDecoder !== 'undefined') {
                try { resolve(new TextDecoder('utf-8', { fatal: true }).decode(buf)); }
                catch (e) {
                  try { resolve(new TextDecoder('gbk').decode(buf)); }
                  catch (e2) { resolve(new TextDecoder('utf-8').decode(buf)); }
                }
              } else resolve('');
            } catch (e) { reject(e); }
          };
          reader.onerror = reject;
          reader.readAsArrayBuffer(file);
        });
      }
      async function extractTextFromFileV2(file) {
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext === 'txt' || ext === 'csv') return readTextSmart(file);
        if (ext === 'doc') throw new Error('旧版 .doc 暂不支持，请用 Word 另存为 .docx 后重新上传');
        if (ext === 'docx') return extractDocx(file);
        if (ext === 'xlsx' || ext === 'xls') return extractExcel(file);
        if (ext === 'pdf') return extractPdf(file);
        return readTextSmart(file);
      }

      // ========== 导入题库 ==========
      async function importParsedQuestionsV2(parsed) {
        const normalized = normalizeParsedQuestions(parsed);
        const total = normalized.single.length + normalized.multi.length + normalized.judge.length + normalized.fill.length + normalized.short.length;
        if (!total) { showToast('没有可导入的有效题目，请检查识别结果','error'); return; }
        const nameInput = document.getElementById('subjectNameInput');
        const select = document.getElementById('existingSubjectSelect');
        const targetId = select?.value;
        const customName = nameInput?.value?.trim();
        let skipped = 0;
        if (targetId && appState.subjects[targetId]) {
          const sub = appState.subjects[targetId];
          sub.questions = sub.questions || { single:[], multi:[], judge:[], fill:[], short:[] };
          for (let type of ['single','multi','judge','fill','short']) {
            sub.questions[type] = sub.questions[type] || [];
            const existing = new Set(sub.questions[type].map(q => String(q.q || '').trim()));
            const fresh = normalized[type].filter(q => !existing.has(String(q.q || '').trim()));
            skipped += normalized[type].length - fresh.length;
            sub.questions[type].push(...fresh);
          }
          saveData();
          showToast(`已导入 ${total - skipped} 题到「${sub.name}」${skipped ? `，跳过重复 ${skipped} 题` : ''}`,'success');
        } else {
          const newId = 'sub_' + Date.now();
          appState.subjects[newId] = {
            name: customName || `上传题库 ${new Date().toLocaleDateString('zh-CN')}`,
            createdAt: new Date().toISOString().split('T')[0],
            questions: { single: normalized.single, multi: normalized.multi, judge: normalized.judge, fill: normalized.fill, short: normalized.short }
          };
          saveData();
          showToast(`已创建题库「${appState.subjects[newId].name}」，共 ${total} 题`,'success');
        }
        window._parsedQuestions = null;
        window._readyToImport = false;
        window._pendingFiles = null;
        navigateTo('home');
      }

      // ========== JSON 容错解析 ==========
      function robustJSONParse(jsonString) {
        try { return JSON.parse(jsonString); } catch (firstError) { console.warn('初次解析失败，尝试修复JSON...'); }
        let fixed = jsonString;
        fixed = fixed.replace(/(\{|\,)\s*(\w+)\s*\:/g, '$1"$2":');
        fixed = fixed.replace(/\:\s*(\[.*?\])/g, (match, arrStr) => {
          let inner = arrStr.slice(1, -1);
          if (!inner.trim()) return match;
          const parts = inner.split(',');
          const fixedParts = parts.map(p => {
            p = p.trim();
            if (/^".*"$/s.test(p) || /^-?\d+(\.\d+)?$/.test(p) || /^(true|false|null)$/.test(p)) return p;
            return '"' + p.replace(/"/g, '\\"') + '"';
          });
          return ': [' + fixedParts.join(',') + ']';
        });
        fixed = fixed.replace(/,\s*}/g, '}').replace(/,\s*]/g, ']');
        fixed = fixed.replace(/\\(?!["\\/bfnrtu])/g, '\\\\');
        try { return JSON.parse(fixed); } catch (e) { throw new Error('JSON解析失败，请检查题库格式或使用本地识别'); }
      }

      // ================= 全局事件 =================
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          const root = document.getElementById('modalRoot');
          if (root && root.style.display !== 'none') { closeModal(); return; }
        }
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (appState.currentView === 'exam') {
          if (e.key === 'ArrowLeft') window._prevQuestion?.();
          else if (e.key === 'ArrowRight') window._nextQuestion?.();
        }
      });

      document.addEventListener('click', e => {
        const panel = document.getElementById('aiModelList');
        if (panel && panel.style.display !== 'none' && !e.target.closest('.select-wrap')) {
          panel.style.display = 'none';
        }
      });

      document.addEventListener('dragover', e => e.preventDefault());
      document.addEventListener('drop', e => {
        e.preventDefault();
        if (appState.currentView === 'upload' && e.dataTransfer.files.length) {
          const fileInput = document.getElementById('fileInput');
          if (fileInput) {
            const dt = new DataTransfer();
            for (const f of e.dataTransfer.files) dt.items.add(f);
            fileInput.files = dt.files;
            window._handleFileUpload?.({ target: { files: dt.files } });
          }
        }
      });

      // ================= 启动 =================
      function initApp() {
        loadData();
        appState.aiConfig = loadAiConfig();
        appState.apiKey = appState.aiConfig.apiKey;
        appState.darkMode = localStorage.getItem(DARK_KEY) === 'true';
        appState.motion = localStorage.getItem(MOTION_KEY) !== '0';
        if (appState.darkMode) document.body.classList.add('dark');
        document.body.classList.toggle('no-motion', !appState.motion);
        renderView();
      }

      initApp();
      console.log('✅ 期末复习系统 v' + APP_VERSION + ' 已就绪（官方品牌Logo · 趋势统计 · 题库选择 · 弹窗动画）');
    })();
  </script>
