<html lang="zh-CN">

  <style>
    :root {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1d1d1f;
      --text-secondary: #86868b;
      --border: #d2d2d7;
      --border-light: #e8e8ed;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --green: #34c759;
      --red: #ff3b30;
      --purple: #af52de;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --radius-lg: 20px;
      --radius-md: 16px;
      color-scheme: light;
    }
    .dark {
      --bg: #0f0f12;
      --card-bg: #1c1c1e;
      --text: #f5f5f7;
      --text-secondary: #98989d;
      --border: #38383a;
      --border-light: #2c2c2e;
      --accent: #0a84ff;
      --accent-hover: #409cff;
      --green: #30d158;
      --red: #ff453a;
      --purple: #bf5af2;
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      margin: 0; padding: 0; min-height: 100vh; line-height: 1.5;
      transition: background-color 0.3s, color 0.3s;
      -webkit-font-smoothing: antialiased;
    }
    .card-elegant {
      background: var(--card-bg); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm); border: 0.5px solid var(--border-light);
      transition: all 0.2s ease;
    }
    .card-hover { transition: transform .35s cubic-bezier(.32,.72,0,1), box-shadow .35s cubic-bezier(.32,.72,0,1), border-color .2s; }
    .card-hover:hover { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(0,0,0,.09); border-color: var(--border); }
    .btn-primary {
      background: var(--accent); color: #fff; border: none; border-radius: 24px;
      padding: 12px 24px; font-weight: 500; font-size: 15px; cursor: pointer;
      transition: transform .15s cubic-bezier(.32,.72,0,1), background .2s, box-shadow .2s;
      letter-spacing: -0.01em; user-select: none;
    }
    .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 6px 18px rgba(0,113,227,.28); }
    .btn-primary:active { transform: scale(.955); }
    .btn-ghost {
      background: transparent; border: 0.5px solid var(--border); border-radius: 24px;
      padding: 10px 20px; font-weight: 500; font-size: 14px; cursor: pointer;
      color: var(--text); transition: transform .15s cubic-bezier(.32,.72,0,1), background .2s, border-color .2s;
      user-select: none; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-ghost:hover { background: rgba(128,128,128,0.08); border-color: var(--text-secondary); }
    .btn-ghost:active { transform: scale(.955); }
    .btn-icon {
      width: 36px; height: 36px; border-radius: 12px; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; border: 0.5px solid var(--border); color: var(--text-secondary);
      cursor: pointer; transition: transform .15s cubic-bezier(.32,.72,0,1), background .2s, color .2s, border-color .2s;
    }
    .btn-icon:hover { background: rgba(128,128,128,.08); color: var(--text); }
    .btn-icon:active { transform: scale(.94); }
    .btn-icon.on { color: var(--accent); border-color: var(--accent); }
    .option-elegant {
      background: var(--card-bg); border: 1px solid var(--border-light);
      border-radius: var(--radius-md); padding: 15px 18px; cursor: pointer;
      transition: transform .15s cubic-bezier(.32,.72,0,1), border-color .2s, background .2s;
      display: flex; align-items: center; gap: 12px;
      width: 100%; user-select: none; font-size: 15px;
    }
    .option-elegant:active { transform: scale(.975); }
    .option-elegant:hover { border-color: var(--border); }
    .option-elegant.selected { border-color: var(--accent); background: rgba(0,113,227,0.05); }
    .option-elegant.correct-flash { border-color: var(--green)!important; background: rgba(52,199,89,0.08)!important; animation: correctPulse 0.6s ease; }
    .option-elegant.wrong-shake { border-color: var(--red)!important; background: rgba(255,59,48,0.08)!important; animation: shakeX 0.5s ease; }
    @keyframes correctPulse { 0%{transform:scale(1)}30%{transform:scale(1.03)}60%{transform:scale(0.98)}100%{transform:scale(1)} }
    @keyframes shakeX { 0%,100%{transform:translateX(0)}15%{transform:translateX(-6px)}30%{transform:translateX(6px)} }
    .progress-line { height:3px; border-radius:2px; background:var(--border-light); overflow:hidden; }
    .progress-line-fill { height:100%; background:var(--accent); transition: width .6s cubic-bezier(.32,.72,0,1); }
    .upload-zone {
      display: block; border: 2px dashed var(--border); border-radius: var(--radius-lg);
      padding: 36px 20px; text-align: center; cursor: pointer;
      transition: border-color .2s, background .2s, transform .2s;
      user-select: none; -webkit-touch-callout: none;
    }
    .upload-zone:hover { border-color: var(--accent); background: rgba(0,113,227,0.02); }
    .upload-zone:active { transform: scale(.99); }
    .vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .input-elegant { border:0.5px solid var(--border); border-radius:12px; padding:12px 16px; font-size:15px; background:var(--card-bg); color:var(--text); width:100%; outline:none; transition: border-color .2s, box-shadow .2s; }
    .input-elegant:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,113,227,0.08); }
    textarea.input-elegant { resize: vertical; min-height: 90px; }
    .text-secondary { color: var(--text-secondary); }
    .tag-pill {
      display:inline-flex; align-items:center; padding:2px 10px; border-radius:999px;
      font-size:11px; font-weight:600; background:rgba(0,113,227,0.08); color:var(--accent);
    }
    .tag-single { background:rgba(0,113,227,0.10); color:var(--accent); }
    .tag-multi { background:rgba(175,82,222,0.10); color:var(--purple); }
    .tag-judge { background:rgba(255,149,0,0.12); color:#ff9500; }
    .tag-fill { background:rgba(52,199,89,0.12); color:var(--green); }
    .tag-short { background:rgba(90,200,250,0.12); color:#5ac8fa; }
    .tag-comprehensive { background:rgba(255,204,0,0.14); color:#ff9500; }
    .tag-wrong { background:rgba(255,59,48,0.1); color:var(--red); }
    .timeline-dot { width:8px; height:8px; border-radius:50%; background:var(--border); flex:none; }
    .timeline-line { width:2px; min-height:28px; background:var(--border-light); flex:1; }
    .option-elegant.disabled { opacity:.55; cursor:not-allowed; }
    @media (max-width:640px) {
      .option-elegant { padding:13px 14px; font-size:14px; }
      .btn-primary { padding:10px 18px; font-size:14px; }
    }

    /* ========== 动画系统（兼容 Edge / Windows，可通过顶部动效开关关闭） ========== */
    ::view-transition-old(root) { animation: vtFadeOut .22s ease both; }
    ::view-transition-new(root) { animation: vtRiseIn .42s cubic-bezier(.32,.72,0,1) both; }
    @keyframes vtFadeOut { to { opacity: 0; transform: scale(.985); } }
    @keyframes vtRiseIn { from { opacity: 0; transform: translateY(16px) scale(.99); } }

    .rise-item { animation: riseIn .55s cubic-bezier(.32,.72,0,1) both; }
    @keyframes riseIn { from { opacity:0; transform: translateY(18px) scale(.985); } to { opacity:1; transform:none; } }

    .no-motion *, .no-motion *::before, .no-motion *::after {
      animation: none !important;
      transition: none !important;
    }

    /* 弹窗（移动端为底部抽屉式，关闭也有动画） */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.35);
      backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
      z-index: 1000; display: flex; align-items: flex-end; justify-content: center;
      animation: backdropIn .28s ease both;
    }
    @media (min-width: 640px) { .modal-backdrop { align-items: center; padding: 28px; } }
    .modal-panel {
      background: var(--card-bg); border-radius: 26px; width: 100%; max-width: 580px;
      max-height: 88vh; overflow-y: auto; border: 0.5px solid var(--border-light);
      box-shadow: 0 32px 90px rgba(0,0,0,.32);
      animation: modalIn .38s cubic-bezier(.32,.72,0,1) both;
    }
    @media (max-width: 639px) {
      .modal-panel { border-radius: 26px 26px 0 0; max-height: 92vh; }
      .seg-btn { padding: 8px 14px; }
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(32px) scale(.96); } }
    @keyframes backdropIn { from { opacity: 0; } }
    @keyframes modalOut { to { opacity: 0; transform: translateY(24px) scale(.96); } }
    @keyframes backdropOut { to { opacity: 0; } }
    .modal-panel::-webkit-scrollbar { width: 6px; }
    .modal-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* 分段控件 */
    .seg { display: inline-flex; background: rgba(128,128,128,.12); border-radius: 999px; padding: 3px; gap: 2px; }
    .seg-btn {
      border: none; background: transparent; padding: 7px 16px; border-radius: 999px;
      font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer;
      transition: all .28s cubic-bezier(.32,.72,0,1); user-select: none;
    }
    .seg-btn:hover { color: var(--text); }
    .seg-btn.active { background: var(--card-bg); color: var(--text); box-shadow: 0 1px 5px rgba(0,0,0,.14); }

    /* 供应商 chip */
    .provider-chip {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 14px;
      border: 1px solid var(--border-light); background: var(--card-bg); cursor: pointer;
      font-size: 13px; font-weight: 500; color: var(--text);
      transition: transform .18s cubic-bezier(.32,.72,0,1), border-color .2s, background .2s, box-shadow .2s;
      user-select: none;
    }
    .provider-chip:hover { transform: translateY(-1px); border-color: var(--border); }
    .provider-chip:active { transform: scale(.96); }
    .provider-chip.active { border-color: var(--bc, var(--accent)); background: rgba(0,113,227,.05); box-shadow: 0 0 0 3px rgba(0,113,227,.08); }
    .provider-logo { display: inline-flex; flex: none; }

    /* 模型下拉 */
    .select-wrap { position: relative; }
    .dropdown-panel {
      position: absolute; z-index: 80; top: calc(100% + 6px); left: 0; right: 0;
      background: var(--card-bg); border: 0.5px solid var(--border); border-radius: 16px;
      box-shadow: 0 18px 52px rgba(0,0,0,.18); padding: 10px;
      animation: riseIn .22s ease both;
    }
    .model-item {
      display: flex; justify-content: space-between; align-items: center; width: 100%;
      padding: 9px 12px; border-radius: 10px; font-size: 14px; cursor: pointer;
      border: none; background: transparent; color: var(--text); text-align: left;
      transition: background .15s;
    }
    .model-item:hover { background: rgba(128,128,128,.09); }
    .model-item.active { background: rgba(0,113,227,.09); color: var(--accent); font-weight: 600; }
    .input-eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px 6px; color: var(--text-secondary); display: inline-flex; }

    /* 思考过程实时展示 */
    .think-box {
      margin-top: 10px; font-size: 12.5px; line-height: 1.75; color: var(--text-secondary);
      background: var(--border-light); border-radius: 14px; padding: 12px 14px;
      max-height: 240px; overflow-y: auto; word-break: break-word;
      border: 0.5px solid var(--border-light);
    }
    .think-box::-webkit-scrollbar { width: 6px; }
    .think-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .think-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulseDot 1.1s ease-in-out infinite; flex: none; }
    @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .2; } }

    /* 作答报告环形 */
    .ring-svg { transform: rotate(-90deg); }
    .ring-bg { stroke: var(--border-light); }
    #resultRing { transition: stroke-dashoffset 1.2s cubic-bezier(.32,.72,0,1); }

    /* 彩带 */
    .confetti {
      position: fixed; top: -20px; z-index: 3000; pointer-events: none; border-radius: 2px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      from { transform: translateY(-24px) rotate(0deg); opacity: 1; }
      to { transform: translateY(108vh) rotate(760deg); opacity: .85; }
    }

    /* 作答方式选择行 */
    .mode-opt {
      display: flex; gap: 14px; align-items: center; padding: 15px 16px; border-radius: 18px;
      border: 1px solid var(--border-light); cursor: pointer; background: var(--card-bg); width: 100%;
      transition: transform .2s cubic-bezier(.32,.72,0,1), border-color .2s, background .2s;
      text-align: left; font: inherit; color: var(--text);
    }
    .mode-opt:hover { border-color: var(--accent); background: rgba(0,113,227,.04); transform: translateY(-2px); }
    .mode-opt:active { transform: scale(.98); }
    .mode-opt-icon {
      width: 46px; height: 46px; border-radius: 14px; flex: none;
      display: flex; align-items: center; justify-content: center;
    }

    .field-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; margin-bottom: 6px; display: block; }

    /* Toast 毛玻璃 */
    .toast-item {
      display: flex; align-items: center; gap: 8px;
      background: rgba(28,28,30,.82); border: 0.5px solid rgba(255,255,255,.14);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      color: #fff; padding: 11px 20px; border-radius: 999px; font-size: 13.5px;
      box-shadow: 0 14px 44px rgba(0,0,0,.28); pointer-events: auto; max-width: 340px;
      animation: toastIn .38s cubic-bezier(.32,.72,0,1);
    }
    .toast-item::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--tcolor, #0a84ff); flex: none; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(36px) scale(.96); } }
  </style>
</head>

      function shuffleArr(a) {
        const arr = a.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }
      function fmtTime(s) {
        s = Math.max(1, Math.round(Number(s) || 0));

      }
      function showToast(msg, type = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast-item';
        const color = type === 'error' ? '#ff453a' : type === 'success' ? '#30d158' : '#0a84ff';
        toast.style.setProperty('--tcolor', color);
        toast.textContent = msg;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateX(40px)';
          toast.style.transition = '.3s';

      }
      function providerOf(cfg) {
        return PROVIDER_PRESETS.find(x => x.id === cfg.providerId) || PROVIDER_PRESETS[0];
      }

      // ================= 存储 =================
      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const data = JSON.parse(raw);
            appState.subjects = data.subjects || {};
            appState.wrongBook = (data.wrongBook && typeof data.wrongBook === 'object') ? data.wrongBook : {};
            appState.stats = Array.isArray(data.stats) ? data.stats : [];
            for (const [id, sub] of Object.entries(appState.subjects)) {
              if (sub && typeof sub === 'object') {
                sub.questions = sub.questions || {};
                for (let type of ['single','multi','judge','fill','short']) {
                  if (!Array.isArray(sub.questions[type])) sub.questions[type] = [];
                }
              } else {
                delete appState.subjects[id];
              }
            }
          }
        } catch (e) { appState.subjects = {}; appState.wrongBook = {}; appState.stats = []; }
      }
      function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ subjects: appState.subjects, wrongBook: appState.wrongBook, stats: appState.stats }));
      }
      function toggleDarkMode() {
        appState.darkMode = !appState.darkMode;
        document.body.classList.toggle('dark', appState.darkMode);
        localStorage.setItem(DARK_KEY, appState.darkMode);
        const darkBtn = document.getElementById('darkModeBtn');
        if (darkBtn) darkBtn.innerHTML = iconSvg(appState.darkMode ? 'sun' : 'moon', 16);
      }

      function defaultAiConfig() {
        const p = PROVIDER_PRESETS[0];
        return {
          providerId: p.id, name: p.name, baseUrl: p.baseUrl, model: p.models[0],
          displayName: p.displayName, apiKey: localStorage.getItem(API_KEY_STORAGE) || '', proxyUrl: '',
        };
      }
      function loadAiConfig() {
        try {
          const saved = JSON.parse(localStorage.getItem(AI_CONFIG_KEY) || 'null');
          if (saved && saved.baseUrl && saved.model) {
            saved.apiKey = saved.apiKey || localStorage.getItem(API_KEY_STORAGE) || '';
            saved.proxyUrl = saved.proxyUrl || '';
            return saved;
          }
        } catch (e) {}
        return defaultAiConfig();
      }
      function saveAiConfigToStorage(cfg) {
        localStorage.setItem(AI_CONFIG_KEY, JSON.stringify(cfg));
        localStorage.setItem(API_KEY_STORAGE, cfg.apiKey || '');
      }

      // ================= 错题本 =================
      function totalWrongCount(subjectId) {
        const wb = appState.wrongBook && appState.wrongBook[subjectId];
        if (!wb) return 0;
        return ['single','multi','judge','fill','short'].reduce((s,t) => s + ((wb[t] || []).length), 0);
      }
      function addWrongToBook(subjectId, type, q) {
        const clean = Object.assign({}, q);
        delete clean._type;
        appState.wrongBook = appState.wrongBook || {};
        appState.wrongBook[subjectId] = appState.wrongBook[subjectId] || {};
        const list = appState.wrongBook[subjectId][type] || (appState.wrongBook[subjectId][type] = []);
        const key = String(clean.q || '').trim();
        const i = list.findIndex(x => String(x.q || '').trim() === key);
        if (i >= 0) list[i] = clean; else list.push(clean);
        saveData();
      }
      function removeWrongFromBook(subjectId, type, q) {
        const list = appState.wrongBook && appState.wrongBook[subjectId] && appState.wrongBook[subjectId][type];
        if (!list) return;
        const key = String(q && q.q || '').trim();
        const i = list.findIndex(x => String(x.q || '').trim() === key);
        if (i >= 0) { list.splice(i, 1); saveData(); }
      }
      function afterGrade(key, ok) {
        const idx = parseInt(String(key).replace('exam-', ''), 10);
        const q = appState.currentQuestions[idx];
        if (!q || !q._type) return;
        if (ok) removeWrongFromBook(appState.currentSubjectId, q._type, q);
        else addWrongToBook(appState.currentSubjectId, q._type, q);
      }

      // ================= 弹窗系统（带关闭动画） =================
      let modalCloseTimer = null;
      function clearModalRoot() {
        const root = document.getElementById('modalRoot');
        root.innerHTML = '';
        root.style.display = 'none';
        document.body.style.overflow = '';
      }
      function openModal(innerHtml, panelClass = '') {
        if (modalCloseTimer) { clearTimeout(modalCloseTimer); modalCloseTimer = null; }
        const root = document.getElementById('modalRoot');
        root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal-panel ${panelClass}">${innerHtml}</div></div>`;
        root.style.display = 'block';
        document.body.style.overflow = 'hidden';
        root.querySelector('#modalBackdrop').addEventListener('click', e => {
          if (e.target.id === 'modalBackdrop') closeModal();
        });
      }
      function closeModal() {
        const root = document.getElementById('modalRoot');
        if (!root || root.style.display === 'none') return;
        if (modalCloseTimer) { clearTimeout(modalCloseTimer); modalCloseTimer = null; }
        if (document.body.classList.contains('no-motion')) { clearModalRoot(); return; }
        const backdrop = root.querySelector('.modal-backdrop');
        const panel = root.querySelector('.modal-panel');
        if (backdrop) backdrop.style.animation = 'backdropOut .18s ease both';
        if (panel) panel.style.animation = 'modalOut .22s cubic-bezier(.32,.72,0,1) both';
        modalCloseTimer = setTimeout(() => { modalCloseTimer = null; clearModalRoot(); }, 220);
      }

      // ================= 视图系统（每次导航重新生成 DOM，动画必然重放） =================
      function navigateTo(view) {
        appState.currentView = view;
        if (view === 'exam') {
          appState.currentIndex = 0;
          appState.answeredSet = {};
          appState.userAnswers = {};
          appState.multiTempSelections = [];
        }
        renderView();
      }

      function renderView() {
        const app = document.getElementById('app');
        const html = renderCurrentView();
        const doSwap = () => {
          app.innerHTML = html;
          bindEvents();
          if (appState.currentView === 'exam') updateExamUI();
          if (appState.currentView === 'browse') window._filterBrowse?.();
          if (appState.currentView === 'result') animateResult();
          window.scrollTo(0, 0);
        };
        if (document.startViewTransition && !document.body.classList.contains('no-motion')) {
          try {
            document.startViewTransition(doSwap);
            return;
          } catch (e) {}
        }
        doSwap();
      }

      function renderCurrentView() {
        switch (appState.currentView) {
          case 'home': return renderHomePage();
          case 'subject': return renderSubjectPage();
          case 'exam': return renderExamPage();
          case 'upload': return renderUploadPage();
          case 'log': return renderLogPage();
          case 'browse': return renderBrowsePage();
          case 'result': return renderResultPage();
          default: return renderHomePage();
        }
      }

      // ================= 正确率趋势卡片 =================
      function renderStatsCard() {
        const stats = (appState.stats || []).slice(-14);
        const total = (appState.stats || []).length;
        if (!stats.length) {
          return `<div class="card-elegant p-4 rise-item" style="animation-delay:80ms">
            <h2 class="font-semibold mb-1">正确率趋势</h2>
            <p class="text-xs text-secondary py-4 text-center">完成一次练习后，这里会生成正确率趋势图</p>
          </div>`;
        }
        const W = 320, H = 108, P = 10;
        const lineY = H - P - 8;
        const pts = stats.map((s, i) => ({
          x: stats.length === 1 ? W / 2 : P + (i * (W - P * 2)) / (stats.length - 1),
          y: lineY - (Math.max(0, Math.min(100, s.acc)) / 100) * (H - P * 2 - 16),
          s, i,
        }));
        const poly = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
        const areaPath = pts.length > 1 ? `M${pts[0].x},${H - P} L${pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L')} L${pts[pts.length-1].x},${H - P} Z` : '';
        const avg = Math.round(stats.reduce((s2, x) => s2 + x.acc, 0) / stats.length);
        const best = Math.max(...stats.map(s => s.acc));
        const dotColor = acc => acc >= 80 ? '#34c759' : acc >= 60 ? '#0071e3' : '#ff3b30';
        const grid = [25, 50, 75].map(g => {
          const y = lineY - (g / 100) * (H - P * 2 - 16);
          return `<line x1="${P}" y1="${y.toFixed(1)}" x2="${W - P}" y2="${y.toFixed(1)}" stroke="var(--border-light)" stroke-width="1" stroke-dasharray="3 4"/>`;
        }).join('');
        const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.2" fill="${dotColor(p.s.acc)}"><title>${escapeHtml(p.s.date)} · ${p.s.acc}%（${escapeHtml(p.s.subjectName || '')}）</title></circle>`).join('');
        return `
        <div class="card-elegant p-4 rise-item" style="animation-delay:80ms">
          <div class="flex justify-between items-center mb-2">
            <h2 class="font-semibold">正确率趋势</h2>
            <span class="text-xs text-secondary">最近 ${stats.length} 次练习</span>
          </div>
          <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" preserveAspectRatio="none">
            ${grid}
            ${pts.length > 1 ? `<polyline points="${poly}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
            ${pts.length > 1 ? `<path d="${areaPath}" fill="rgba(0,113,227,.06)"/>` : ''}
            ${dots}
          </svg>
          <div class="flex justify-between mt-1" style="font-size:10px;color:var(--text-secondary)">
            <span>${pts[0].s.date}</span><span>${pts[pts.length-1].s.date}</span>
          </div>
          <div class="grid grid-cols-3 gap-2 mt-3 text-center">
            <div class="p-2 rounded-xl" style="background:var(--border-light)"><div class="font-bold">${total}</div><div style="font-size:10px;color:var(--text-secondary)">练习次数</div></div>
            <div class="p-2 rounded-xl" style="background:var(--border-light)"><div class="font-bold" style="color:var(--accent)">${avg}%</div><div style="font-size:10px;color:var(--text-secondary)">平均正确率</div></div>
            <div class="p-2 rounded-xl" style="background:var(--border-light)"><div class="font-bold" style="color:var(--green)">${best}%</div><div style="font-size:10px;color:var(--text-secondary)">最佳成绩</div></div>
          </div>
        </div>`;
      }

      // ================= 首页 =================
      function renderHomePage() {
        let cards = '';
        const ids = Object.keys(appState.subjects);
        ids.forEach((id, i) => {
          const sub = appState.subjects[id];
          const qCount = (sub.questions?.single?.length||0)+(sub.questions?.multi?.length||0)+(sub.questions?.judge?.length||0)+(sub.questions?.fill?.length||0)+(sub.questions?.short?.length||0);
          cards += `<div class="card-elegant card-hover p-4 cursor-pointer rise-item" style="animation-delay:${100+i*60}ms" onclick="window._openSubject('${id}')"><div class="flex justify-between"><div><h3 class="font-semibold">${escapeHtml(sub.name)}</h3><p class="text-xs text-secondary">${qCount}题 · ${escapeHtml(sub.createdAt||'')}</p></div><svg width="20" height="20" viewBox="0 0 20 20"><path d="M7 4l8 6-8 6" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></div></div>`;
        });
        let logHtml = '';
        CHANGELOG.forEach((log, i) => {
          logHtml += `<div class="flex gap-3 items-start"><div class="flex flex-col items-center"><div class="timeline-dot" style="background:${i===0?'var(--accent)':i===1?'var(--purple)':'var(--green)'}"></div>${i<CHANGELOG.length-1?'<div class="timeline-line" style="min-height:28px;"></div>':''}</div><div><p class="font-medium text-sm">${log.date} · ${log.version}</p><p class="text-xs text-secondary">${log.content}</p></div></div>`;
        });
        const firstId = ids[0];
        return `
        <div class="space-y-4">
          <div class="card-elegant p-6 sm:p-8 rise-item" style="background:linear-gradient(135deg, rgba(0,113,227,.07), rgba(175,82,222,.07))">
            <div class="flex justify-between items-start gap-3 flex-wrap">
              <div>
                <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">期末复习系统</h1>
                <p class="text-sm text-secondary mt-1">v${APP_VERSION} · 正式上线</p>
              </div>
              <div class="flex gap-2 items-center">
                <button class="btn-icon ${appState.motion?'on':''}" id="motionBtn" onclick="window._toggleMotion()" title="${appState.motion?'关闭动效':'开启动效'}">${iconSvg('motion', 16)}</button>
                <button class="btn-icon" id="darkModeBtn" onclick="window.toggleDarkMode()" title="深浅色模式">${iconSvg(appState.darkMode?'sun':'moon', 16)}</button>
              </div>
            </div>
            <div class="flex flex-wrap gap-2 mt-4">
              <button class="btn-primary" onclick="window._navigateTo('upload')">上传题库</button>
              ${firstId?`<button class="btn-ghost" onclick="window._pickSubject('open')">开始复习</button>`:''}
              ${firstId?`<button class="btn-ghost" onclick="window._pickSubject('comp')">去综合测试</button>`:''}
            </div>
          </div>
          <div class="card-elegant p-4 rise-item" style="animation-delay:60ms;border-left:3px solid var(--accent);max-height:380px;overflow-y:auto;">
            <h2 class="font-semibold mb-3">更新日志</h2><div class="space-y-3">${logHtml}</div>
          </div>
          ${renderStatsCard()}
          <div class="flex items-center justify-between rise-item" style="animation-delay:100ms">
            <h2 class="font-semibold text-lg">我的题库</h2>
          </div>
          <div class="grid gap-3">
            ${cards || `
            <div class="card-elegant p-10 text-center rise-item">
              <span style="color:var(--text-secondary);display:inline-flex">${iconSvg('book', 46)}</span>
              <p class="font-semibold text-lg mt-3">还没有题库</p>
              <p class="text-sm text-secondary mt-1">上传你的复习资料，AI 帮你识别成可练习的题库</p>
              <button class="btn-primary mt-5" onclick="window._navigateTo('upload')">去上传题库</button>
            </div>`}
          </div>
          <div class="flex gap-2 flex-wrap rise-item" style="animation-delay:120ms">
            <button class="btn-ghost text-sm" onclick="window._navigateTo('upload')">上传文件</button>
            <button class="btn-ghost text-sm" onclick="window._navigateTo('log')">完整日志</button>
            <button class="btn-ghost text-sm" onclick="window._exportBackup()">导出备份</button>
            <button class="btn-ghost text-sm" onclick="document.getElementById('backupImportInput').click()">导入备份</button>
            <input type="file" id="backupImportInput" accept=".json,application/json" class="vh" onchange="window._importBackup(event)">
            <button class="btn-ghost text-sm" onclick="window._resetAll()" style="color:var(--red)">重置数据</button>
          </div>
        </div>`;
      }

      // ================= 题库主页 =================
      function renderSubjectPage() {
        const sub = appState.subjects[appState.currentSubjectId];
        if (!sub) { navigateTo('home'); return ''; }
        const cats = [
          { key:'single', name:'单选题', count:sub.questions?.single?.length||0 },
          { key:'multi', name:'多选题', count:sub.questions?.multi?.length||0 },
          { key:'judge', name:'判断题', count:sub.questions?.judge?.length||0 },
          { key:'fill', name:'填空题', count:sub.questions?.fill?.length||0 },
          { key:'short', name:'简答题', count:sub.questions?.short?.length||0 },
        ];
        const total = cats.reduce((s, c) => s + c.count, 0);
        const wrongTotal = totalWrongCount(appState.currentSubjectId);
        let catCards = '';
        cats.forEach((c, i) => {
          catCards += `<div class="card-elegant card-hover p-4 cursor-pointer rise-item" style="animation-delay:${80+i*50}ms" onclick="window._openModePicker('${c.key}')"><div class="flex justify-between items-center"><div><div class="font-semibold">${c.name}</div><p class="text-xs text-secondary">${c.count}题 · 选择作答方式</p></div><span class="tag-pill tag-${c.key}">${c.count}</span></div></div>`;
        });
        return `
        <div class="space-y-4">
          <div class="rise-item">
            <button class="btn-ghost text-sm" onclick="window._navigateTo('home')">← 返回</button>
            <h2 class="text-xl font-semibold mt-2">${escapeHtml(sub.name)}</h2>
          </div>
          <div class="card-elegant card-hover p-4 cursor-pointer rise-item" style="animation-delay:50ms;border-left:3px solid var(--purple)" onclick="window._openModePicker('comprehensive')">
            <div class="flex items-center gap-3">
              <span class="mode-opt-icon" style="background:rgba(175,82,222,.1);color:var(--purple)">${iconSvg('target', 22)}</span>
              <div class="flex-1"><div class="font-semibold">综合测试</div><p class="text-xs text-secondary">全题型混合 · 共 ${total} 题</p></div>
              <span class="tag-pill tag-comprehensive">${total} 题</span>
            </div>
          </div>
          <div class="card-elegant card-hover p-4 cursor-pointer rise-item" style="animation-delay:60ms;border-left:3px solid var(--red)" onclick="window._openModePicker('wrong')">
            <div class="flex items-center gap-3">
              <span class="mode-opt-icon" style="background:rgba(255,59,48,.1);color:var(--red)">${iconSvg('bookmark', 22)}</span>
              <div class="flex-1"><div class="font-semibold">错题复习</div><p class="text-xs text-secondary">${wrongTotal>0?`共 ${wrongTotal} 道错题 · 答对自动移出`:'暂无错题 · 答错后自动收录'}</p></div>
              <span class="tag-pill tag-wrong">${wrongTotal}</span>
            </div>
          </div>
          <div class="flex gap-2 flex-wrap rise-item" style="animation-delay:70ms">
            <button class="btn-ghost text-sm" onclick="window._browseSubject('${appState.currentSubjectId}')">浏览全部题目</button>
            ${wrongTotal>0?`<button class="btn-ghost text-sm" style="color:var(--red)" onclick="window._clearWrongBook()">清空错题本</button>`:''}
            <button class="btn-ghost text-sm" style="color:var(--red)" onclick="window._deleteSubject('${appState.currentSubjectId}')">删除题库</button>
          </div>
          <div class="grid gap-3 sm:grid-cols-2">${catCards}</div>
        </div>`;
      }

      // ================= 浏览 =================
      function renderBrowsePage() {
        const sub = appState.subjects[appState.currentSubjectId];
        if (!sub) { navigateTo('home'); return ''; }
        let allQuestions = [];
        for (let [type, arr] of Object.entries(sub.questions)) {
          if (arr && arr.length) {
            arr.forEach((q, i) => allQuestions.push({ type, typeName: TYPE_NAMES[type] || type, index: i, question: q }));
          }
        }
        window._allBrowseQuestions = allQuestions;
        return `
        <div class="space-y-4">
          <div class="rise-item">
            <button class="btn-ghost text-sm" onclick="window._navigateTo('subject')">← 返回</button>
            <h2 class="text-xl font-semibold mt-2">浏览题库：${escapeHtml(sub.name)}</h2>
          </div>
          <input type="text" class="input-elegant" id="searchInput" placeholder="搜索题目..." oninput="window._filterBrowse()">
          <div id="browseList" class="space-y-3"></div>
        </div>`;
      }

      // ================= 练习页（顺序 / 乱序 / 看题 三模式） =================
      function renderExamPage() {
        const questions = appState.currentQuestions;
        if (!questions.length) { navigateTo('home'); return ''; }
        const total = questions.length;
        const answered = Object.keys(appState.answeredSet).length;
        const correct = Object.values(appState.answeredSet).filter(v=>v==='correct').length;
        const mode = appState.currentMode;
        const cat = appState.currentCategory;
        return `
        <div class="space-y-4">
          <div class="flex items-center gap-2 flex-wrap rise-item">
            <button class="btn-ghost text-sm" onclick="window._navigateTo('subject')">← 返回</button>
            <span class="tag-pill tag-${cat}">${TYPE_NAMES[cat]||cat}</span>
            <div class="seg" id="orderSeg">
              <button class="seg-btn ${mode==='order'?'active':''}" data-mode="order" onclick="window._setMode('order')">顺序</button>
              <button class="seg-btn ${mode==='shuffle'?'active':''}" data-mode="shuffle" onclick="window._setMode('shuffle')">乱序</button>
              <button class="seg-btn ${mode==='view'?'active':''}" data-mode="view" onclick="window._setMode('view')">看题</button>
            </div>
            <button class="btn-ghost text-sm" id="catalogBtn" onclick="window._openCatalog()" style="display:none">目录</button>
            <button class="btn-primary text-sm ml-auto" id="resultBtn" onclick="window._goToResult()" style="display:none">查看结果</button>
          </div>
          <div class="card-elegant p-3 rise-item" style="animation-delay:50ms"><div class="flex items-center gap-2"><span class="text-sm">进度</span><span class="font-semibold text-sm" id="answeredCount">${answered}/${total}</span><div class="flex-1 progress-line"><div class="progress-line-fill" id="progressFill" style="width:${total?answered/total*100:0}%"></div></div><span class="text-sm" style="color:var(--green)" id="correctCount">${correct}</span><span class="text-sm" style="color:var(--red)" id="wrongCount">${answered-correct}</span></div></div>
          <div class="card-elegant p-4 sm:p-5 rise-item" style="animation-delay:90ms" id="questionCard"><div id="questionInner"></div></div>
          <div class="flex justify-between items-center rise-item" style="animation-delay:120ms">
            <button class="btn-ghost text-sm" onclick="window._prevQuestion()" id="prevBtn">上一题</button>
            <div id="paginationDots" class="flex gap-1 flex-wrap justify-center"></div>
            <button class="btn-ghost text-sm" onclick="window._nextQuestion()" id="nextBtn">下一题</button>
          </div>
          <p class="text-center text-xs text-secondary rise-item" style="animation-delay:140ms" id="qIndicator"></p>
        </div>`;
      }

      function startExam(subId, cat, mode) {
        const sub = appState.subjects[subId];
        if (!sub) return;
        let items = [];
        if (cat === 'comprehensive') {
          for (const t of ['single','multi','judge','fill','short']) {
            for (const q of (sub.questions[t] || [])) items.push(Object.assign({}, q, { _type: t }));
          }
        } else if (cat === 'wrong') {
          const wb = appState.wrongBook && appState.wrongBook[subId];
          if (!wb || !totalWrongCount(subId)) { showToast('错题本是空的，完成练习后会自动收录错题','error'); return; }
          for (const t of ['single','multi','judge','fill','short']) {
            for (const q of (wb[t] || [])) items.push(Object.assign({}, q, { _type: t }));
          }
        } else {
          for (const q of (sub.questions[cat] || [])) items.push(Object.assign({}, q, { _type: cat }));
        }
        if (!items.length) return showToast('该分类暂无题目','error');
        appState.currentSubjectId = subId;
        appState.currentCategory = cat;
        appState._originalOrder = items;
        appState.currentQuestions = mode === 'shuffle' ? shuffleArr(items) : items.slice();
        appState.currentMode = mode;
        appState._sessionStartMode = mode;
        appState._lastAnswerMode = mode === 'view' ? 'order' : mode;
        appState.currentIndex = 0;
        appState.answeredSet = {};
        appState.userAnswers = {};
        appState.multiTempSelections = [];
        appState.examStartTime = Date.now();
        appState.lastResult = null;
        navigateTo('exam');
      }

      function updateExamUI() {
        const questions = appState.currentQuestions;
        if (!questions.length) return;
        const idx = appState.currentIndex;
        const qData = questions[idx];
        const cat = qData._type || appState.currentCategory;
        const isView = appState.currentMode === 'view';
        const key = `exam-${idx}`;
        const hasAnswered = appState.answeredSet[key] !== undefined;
        const inner = document.getElementById('questionInner');
        if (!inner) return;
        let html = `<p class="text-xs text-secondary mb-2">第 ${idx+1} / ${questions.length} 题${isView?' · 看题模式':''}</p><h3 class="text-lg font-medium mb-4">${escapeHtml(qData.q)}</h3>`;
        if (cat === 'single') {
          for (let i=0;i<qData.opts.length;i++) {
            let cls = 'option-elegant';
            if (isView) { cls += ' disabled'; if (i===qData.ans) cls += ' correct-flash'; }
            else {
              if (hasAnswered) cls += ' disabled';
              if (hasAnswered && i===qData.ans) cls += ' correct-flash';
              if (hasAnswered && appState.userAnswers[key]===i && i!==qData.ans) cls += ' wrong-shake';
              if (!hasAnswered && appState.userAnswers[key]===i) cls += ' selected';
            }
            html += `<button class="${cls}" onclick="window._selectSingle(${i},'${key}',${Number(qData.ans)||0})"><span style="font-weight:600">${String.fromCharCode(65+i)}</span><span>${escapeHtml(qData.opts[i])}</span>${(hasAnswered||isView)&&i===qData.ans?'<span>✓</span>':''}</button>`;
          }
          if (hasAnswered || isView) html += `<div class="mt-3 p-3 rounded-xl text-sm" style="background:rgba(52,199,89,0.1);color:var(--green)">正确答案：${String.fromCharCode(65+qData.ans)}. ${escapeHtml(qData.opts[qData.ans])}</div>`;
        } else if (cat === 'multi') {
          const correctAns = qData.ans || [];
          const userSel = appState.userAnswers[key] || [];
          for (let i=0;i<qData.opts.length;i++) {
            let cls = 'option-elegant';
            if (isView) { cls += ' disabled'; if (correctAns.includes(i)) cls += ' correct-flash'; }
            else {
              if (hasAnswered) cls += ' disabled';
              if (hasAnswered && correctAns.includes(i)) cls += ' correct-flash';
              if (hasAnswered && userSel.includes(i) && !correctAns.includes(i)) cls += ' wrong-shake';
              if (!hasAnswered && appState.multiTempSelections.includes(i)) cls += ' selected';
            }
            html += `<button class="${cls}" onclick="window._toggleMulti(${i},'${key}')"><span style="font-weight:600">${String.fromCharCode(65+i)}</span><span>${escapeHtml(qData.opts[i])}</span></button>`;
          }
          if (!hasAnswered && !isView) html += `<button class="btn-primary w-full mt-3" onclick="window._submitMulti('${key}',[${correctAns.map(Number).join(',')}])">提交答案</button>`;
          if (hasAnswered || isView) {
            const corrLabels = correctAns.map(i=>String.fromCharCode(65+i)).join('');
            html += `<div class="mt-3 p-3 rounded-xl text-sm" style="background:rgba(52,199,89,0.1);color:var(--green)">正确答案：${corrLabels}</div>`;
          }
        } else if (cat === 'judge') {
          const labels = ['正确','错误'];
          [true,false].forEach((val,i) => {
            let cls = 'option-elegant';
            if (isView) { cls += ' disabled'; if (val===qData.ans) cls += ' correct-flash'; }
            else {
              if (hasAnswered) cls += ' disabled';
              if (hasAnswered && val===qData.ans) cls += ' correct-flash';
              if (hasAnswered && appState.userAnswers[key]===val && val!==qData.ans) cls += ' wrong-shake';
              if (!hasAnswered && appState.userAnswers[key]===val) cls += ' selected';
            }
            html += `<button class="${cls}" onclick="window._selectJudge(${val},'${key}',${qData.ans===true})">${labels[i]}</button>`;
          });
          if (hasAnswered || isView) html += `<div class="mt-3 p-3 rounded-xl text-sm" style="background:rgba(52,199,89,0.1);color:var(--green)">正确答案：${qData.ans?'正确':'错误'}</div>`;
        } else if (cat === 'fill') {
          if (hasAnswered || isView) {
            html += `<p>你的答案：<strong>${escapeHtml(appState.userAnswers[key]||'(未填写)')}</strong></p><div class="mt-2 p-3 rounded-xl text-sm" style="background:rgba(52,199,89,0.1);color:var(--green)">正确答案：${escapeHtml(fillAnswersText(qData.ans))}</div>`;
          } else {
            html += `<input class="input-elegant" id="fillInput" placeholder="请输入答案" value="${escapeHtml(appState.userAnswers[key]||'')}"><button class="btn-primary w-full mt-3" onclick="window._submitFill('${key}')">提交答案</button>`;
          }
        } else if (cat === 'short') {
          if (hasAnswered || isView) {
            html += `<p>你的回答：</p><p class="p-3 rounded-xl" style="background:var(--border-light)">${escapeHtml(appState.userAnswers[key]||'(未填写)')}</p><div class="p-3 rounded-xl text-sm" style="background:rgba(52,199,89,0.1);color:var(--green)">参考答案：${escapeHtml(qData.a)}</div>`;
            if (appState.answeredSet[key] === 'pending' && !isView) {
              html += `<div class="flex gap-2 mt-3"><button class="btn-primary" onclick="window._selfGradeShort('${key}',true)">我答对了</button><button class="btn-ghost" onclick="window._selfGradeShort('${key}',false)">我答错了</button></div>`;
            }
          } else {
            html += `<textarea class="input-elegant" id="shortInput">${escapeHtml(appState.userAnswers[key]||'')}</textarea><button class="btn-primary w-full mt-3" onclick="window._submitShort('${key}')">提交回答</button>`;
          }
        }
        inner.innerHTML = html;
        updateHeaderStats();
        updatePagination();
        refreshSeg();
        const pf = document.getElementById('progressFill');
        if (pf) pf.style.width = `${questions.length?Object.keys(appState.answeredSet).length/questions.length*100:0}%`;
        const qi = document.getElementById('qIndicator');
        if (qi) qi.textContent = `第 ${idx+1} / ${questions.length} 题`;
        const pb = document.getElementById('prevBtn');
        const nb = document.getElementById('nextBtn');
        if (pb) pb.style.opacity = idx<=0?'0.4':'1';
        if (nb) nb.style.opacity = idx>=questions.length-1?'0.4':'1';
        const rb = document.getElementById('resultBtn');
        if (rb) {
          const allDone = questions.length > 0 && Object.keys(appState.answeredSet).length === questions.length;
          rb.style.display = (allDone && !isView) ? '' : 'none';
        }
        const cb = document.getElementById('catalogBtn');
        if (cb) cb.style.display = isView ? '' : 'none';
      }

      function refreshSeg() {
        const m = appState.currentMode;
        document.querySelectorAll('#orderSeg .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
      }

      function updateHeaderStats() {
        const total = appState.currentQuestions.length;
        const answered = Object.keys(appState.answeredSet).length;
        const correct = Object.values(appState.answeredSet).filter(v => v === 'correct').length;
        const wrong = Object.values(appState.answeredSet).filter(v => v !== 'correct').length;
        const ac = document.getElementById('answeredCount');
        const cc = document.getElementById('correctCount');
        const wc = document.getElementById('wrongCount');
        if (ac) ac.textContent = `${answered}/${total}`;
        if (cc) cc.textContent = correct;
        if (wc) wc.textContent = wrong;
      }

      function fillAnswersText(ans) {
        const arr = Array.isArray(ans) ? ans : String(ans == null ? '' : ans).split('|');
        return arr.map(s => String(s).trim()).filter(Boolean).join(' 或 ') || '（未提供）';
      }
      function normalizeFillValue(s) {
        return String(s == null ? '' : s).trim().replace(/\s+/g, '').toLowerCase().replace(/[。；;，,：:！!？?]$/, '');
      }

      function updatePagination() {
        const total = appState.currentQuestions.length;
        const idx = appState.currentIndex;
        const container = document.getElementById('paginationDots');
        if (!container) return;
        let html = '';
        for (let i=Math.max(0,idx-3); i<Math.min(total,idx+4); i++) {
          const key = `exam-${i}`;
          let style = 'cursor:pointer;padding:4px 9px;border-radius:16px;border:0.5px solid var(--border);font-size:11px;';
          if (i===idx) style += 'background:var(--accent);color:#fff;';
          else if (appState.answeredSet[key]==='correct') style += 'border-color:var(--green);background:rgba(52,199,89,0.1);';
          else if (appState.answeredSet[key]!==undefined && appState.answeredSet[key]!=='correct') style += 'border-color:var(--red);background:rgba(255,59,48,0.1);';
          html += `<span style="${style}" onclick="window._goToQ(${i})">${i+1}</span>`;
        }
        container.innerHTML = html;
      }

      function computeResult() {
        const vals = Object.values(appState.answeredSet);
        const correct = vals.filter(v => v === 'correct').length;
        const wrong = vals.filter(v => v !== 'correct').length;
        const seconds = Math.max(1, Math.round((Date.now() - (appState.examStartTime || Date.now())) / 1000));
        const total = appState.currentQuestions.length;
        const acc = total ? Math.round(correct / total * 100) : 0;
        appState.lastResult = { total, correct, wrong, seconds };
        // 记录正确率趋势
        const d = new Date();
        const date = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        appState.stats = appState.stats || [];
        appState.stats.push({
          t: d.getTime(), date, acc, total, correct, wrong,
          subjectId: appState.currentSubjectId,
          subjectName: (appState.subjects[appState.currentSubjectId] || {}).name || '',
          category: appState.currentCategory,
        });
        if (appState.stats.length > 200) appState.stats = appState.stats.slice(-200);
        saveData();
      }

      // ================= 作答报告 =================
      function renderResultPage() {
        const r = appState.lastResult || { total: 0, correct: 0, wrong: 0, seconds: 0 };
        const acc = r.total ? Math.round(r.correct / r.total * 100) : 0;
        const C = 2 * Math.PI * 52;
        const ringColor = acc >= 80 ? 'var(--green)' : acc >= 60 ? 'var(--accent)' : 'var(--red)';
        return `
        <div class="space-y-4">
          <div class="rise-item">
            <button class="btn-ghost text-sm" onclick="window._navigateTo('subject')">← 返回题库</button>
            <h2 class="text-xl font-semibold mt-2">${TYPE_NAMES[appState.currentCategory]||'练习'} · 作答报告</h2>
          </div>
          <div class="card-elegant p-6 text-center rise-item" style="animation-delay:60ms">
            <h3 class="text-lg font-semibold">本次作答报告</h3>
            <div class="relative inline-block mt-5" style="width:160px;height:160px">
              <svg class="ring-svg" width="160" height="160" viewBox="0 0 160 160">
                <circle class="ring-bg" cx="80" cy="80" r="52" fill="none" stroke-width="13"/>
                <circle id="resultRing" cx="80" cy="80" r="52" fill="none" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="stroke:${ringColor}"/>
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center">
                <span class="text-4xl font-bold tracking-tight" id="resultAcc">0%</span>
                <span class="text-xs text-secondary mt-1">正确率</span>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-6 text-center">
              <div class="p-3 rounded-2xl" style="background:var(--border-light)"><div class="text-xl font-bold">${r.total}</div><div class="text-xs text-secondary">总题数</div></div>
              <div class="p-3 rounded-2xl" style="background:var(--border-light)"><div class="text-xl font-bold" style="color:var(--green)">${r.correct}</div><div class="text-xs text-secondary">答对</div></div>
              <div class="p-3 rounded-2xl" style="background:var(--border-light)"><div class="text-xl font-bold" style="color:var(--red)">${r.wrong}</div><div class="text-xs text-secondary">答错</div></div>
            </div>
            <p class="text-sm text-secondary mt-4">用时 ${fmtTime(r.seconds)}</p>
            ${r.wrong?`<p class="text-xs text-secondary mt-2">答错的 ${r.wrong} 题已自动存入错题本，可在题库页随时复习</p>`:''}
            <div class="flex flex-wrap gap-2 justify-center mt-5">
              ${r.wrong ? `<button class="btn-primary" onclick="window._redoWrong()">重练错题（${r.wrong}）</button>` : '<button class="btn-primary">全部答对</button>'}
              <button class="btn-ghost" onclick="window._restartExam()">再来一遍</button>
              <button class="btn-ghost" onclick="window._navigateTo('subject')">返回题库</button>
            </div>
          </div>
        </div>`;
      }

      function animateResult() {
        const r = appState.lastResult || { total: 0, correct: 0 };
        const acc = r.total ? Math.round(r.correct / r.total * 100) : 0;
        const C = 2 * Math.PI * 52;
        const ring = document.getElementById('resultRing');
        const accEl = document.getElementById('resultAcc');
        requestAnimationFrame(() => {
          if (ring) ring.style.strokeDashoffset = C * (1 - acc / 100);
        });
        if (accEl) {
          let cur = 0;
          const step = () => {
            cur = Math.min(acc, cur + Math.max(1, Math.round(acc / 36)));
            accEl.textContent = cur + '%';
            if (cur < acc) requestAnimationFrame(step);
          };
          step();
        }
        if (acc === 100) spawnConfetti();
      }

      function spawnConfetti() {
        const colors = ['#0071e3','#34c759','#ff3b30','#ff9500','#af52de','#ffcc00','#30d158'];
        for (let i = 0; i < 70; i++) {
          const el = document.createElement('div');
          el.className = 'confetti';
          el.style.left = (Math.random() * 100) + 'vw';
          el.style.background = colors[i % colors.length];

      function renderModelListItems() {
        const listEl = document.getElementById('aiModelItems');

          ? window._modelCache[pid]
          : (preset ? preset.models : []);

          listEl.innerHTML = items.map(m => {
            const safe = String(m).replace(/'/g, "\\'");
            return `<button type="button" class="model-item ${m===cur?'active':''}" onclick="window._pickModel('${safe}')"><span class="truncate">${escapeHtml(m)}</span>${m===cur?'<span>✓</span>':''}</button>`;
          }).join('');
        } else {
          listEl.innerHTML = `<p class="text-xs text-secondary p-2">${kw ? '没有匹配的模型，可直接在上方输入' : '该供应商暂无预置模型，点击下方按钮获取'}</p>`;
