      // ================= 事件绑定（每次渲染全量绑定，保证所有入口可用） =================
      function bindEvents() {
        window._navigateTo = navigateTo;
        window._back = goBack;
        window._closeModal = closeModal;
        window.toggleDarkMode = toggleDarkMode;
        window._setRecognitionMode = (mode) => { window._recognitionMode = mode; };

        // 动效开关由 window._cycleMotion 承担（Task 4），此处不再重复绑定

        // 首页 / 通用
        window._pickSubject = (action) => {
          const ids = Object.keys(appState.subjects);
          if (!ids.length) { showToast('还没有题库，请先上传题库','error'); return; }
          const rows = ids.map((id, i) => {
            const sub = appState.subjects[id];
            const qCount = (sub.questions?.single?.length||0)+(sub.questions?.multi?.length||0)+(sub.questions?.judge?.length||0)+(sub.questions?.fill?.length||0)+(sub.questions?.short?.length||0);
            return `<button class="mode-opt" onclick="window._pickSubjectGo('${id}','${action}')">
              <span class="mode-opt-icon" style="background:rgba(0,113,227,.08);color:var(--accent)">${iconSvg('book', 20)}</span>
              <span class="text-left flex-1 min-w-0"><span class="block font-semibold text-sm truncate">${escapeHtml(sub.name)}</span><span class="text-xs text-secondary">${qCount} 题 · ${escapeHtml(sub.createdAt||'')}</span></span>
              <span style="color:var(--text-secondary);display:inline-flex">${iconSvg('arrowRight', 16)}</span>
            </button>`;
          }).join('');
          openModal(`
            <div class="p-5 sm:p-6 space-y-3">
              <div class="text-center">
                <h3 class="text-lg font-semibold">选择题库</h3>
                <p class="text-sm text-secondary">共 ${ids.length} 个题库 · ${action === 'comp' ? '将进入综合测试' : '选择要复习的题库'}</p>
              </div>
              <div class="space-y-2" style="max-height:50vh;overflow-y:auto">${rows}</div>
              <button class="btn-ghost w-full" onclick="window._closeModal()">取消</button>
            </div>`);
        };
        window._pickSubjectGo = (id, action) => {
          closeModal();
          appState.currentSubjectId = id;
          if (action === 'comp') window._openModePicker('comprehensive');
          else navigateTo('subject');
        };
        window._openSubject = (id) => { appState.currentSubjectId = id; navigateTo('subject'); };
        window._resetAll = () => {
          if (confirm('确定清空所有题库、错题与统计？')) {
            appState.subjects = {};
            appState.wrongBook = {};
            appState.stats = [];
            localStorage.removeItem(STORAGE_KEY);
            navigateTo('home');
            showToast('已重置所有数据','success');
          }
        };
        window._exportBackup = () => {
          const payload = { app:'final_review_system', version:1, exportedAt:new Date().toISOString(), subjects:appState.subjects, wrongBook:appState.wrongBook, stats:appState.stats };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `期末复习系统备份-${new Date().toISOString().split('T')[0]}.json`;
          a.click();
          URL.revokeObjectURL(a.href);
          showToast('备份已导出','success');
        };
        window._importBackup = (event) => {
          const file = event.target.files?.[0];
          if (!file) return;
          if (file.size > 5 * 1024 * 1024) { showToast('备份文件不能超过 5MB','error'); event.target.value = ''; return; }
          readFileAsText(file).then(text => {
            try {
              const data = JSON.parse(text);
              if (!data || !data.subjects || typeof data.subjects !== 'object' || Array.isArray(data.subjects)) throw new Error('格式错误');
              let newCount = 0, mergeCount = 0;
              const idMap = Object.create(null);
              const subjects = Object.assign(Object.create(null), appState.subjects);
              const wrongBook = Object.assign(Object.create(null), appState.wrongBook);
              for (const [oldId, rawSubject] of Object.entries(data.subjects)) {
                const sub = sanitizeSubject(rawSubject);
                if (!sub) continue;
                const id = isSafeSubjectId(oldId) ? oldId : createSubjectId();
                idMap[oldId] = id;
                if (!subjects[id]) { subjects[id] = sub; newCount++; }
                else {
                  const merged = { ...subjects[id], questions: { ...subjects[id].questions } };
                  for (let type of ['single','multi','judge','fill','short']) {
                    merged.questions[type] = [...(merged.questions[type] || []), ...(sub.questions[type] || [])];
                  }
                  merged.questions = dedupeParsedQuestions(normalizeParsedQuestions(merged.questions));
                  subjects[id] = merged;
                  mergeCount++;
                }
              }
              if (data.wrongBook && typeof data.wrongBook === 'object') {
                for (const [oldId, rawQuestions] of Object.entries(data.wrongBook)) {
                  const id = idMap[oldId];
                  if (!id || !rawQuestions || typeof rawQuestions !== 'object') continue;
                  const incoming = normalizeParsedQuestions(rawQuestions);
                  const current = wrongBook[id] || {};
                  for (const type of ['single','multi','judge','fill','short']) current[type] = [...(current[type] || []), ...(incoming[type] || [])];
                  wrongBook[id] = dedupeParsedQuestions(normalizeParsedQuestions(current));
                }
              }
              const stats = [...(appState.stats || []), ...sanitizeStats(data.stats, idMap)].slice(-200);
              if (saveData({ subjects, wrongBook, stats })) {
                appState.subjects = subjects;
                appState.wrongBook = wrongBook;
                appState.stats = stats;
                renderView();
                showToast(`备份导入完成：新增${newCount}个题库，合并${mergeCount}个题库`,'success');
              }
            } catch (e) { showToast('备份文件解析失败','error'); }
          });
          event.target.value = '';
        };

        // 题库主页
        window._deleteSubject = (id) => { if (confirm('删除该题库？')) { delete appState.subjects[id]; delete appState.wrongBook[id]; saveData(); navigateTo('home'); } };
        window._browseSubject = (id) => { appState.currentSubjectId = id; navigateTo('browse'); };
        window._clearWrongBook = () => {
          const n = totalWrongCount(appState.currentSubjectId);
          if (!n) return showToast('错题本已经是空的','info');
          if (!confirm(`确定清空错题本（${n} 题）？`)) return;
          delete appState.wrongBook[appState.currentSubjectId];
          saveData();
          renderView();
          showToast('错题本已清空','success');
        };
        window._openModePicker = (cat) => {
          const sub = appState.subjects[appState.currentSubjectId];
          if (!sub) return;
          const isComp = cat === 'comprehensive';
          const isWrong = cat === 'wrong';
          let count;
          if (isComp) count = ['single','multi','judge','fill','short'].reduce((s,t) => s + (sub.questions[t]?.length || 0), 0);
          else if (isWrong) count = totalWrongCount(appState.currentSubjectId);
          else count = (sub.questions[cat]?.length || 0);
          if (!count) return showToast(isWrong ? '错题本是空的，完成练习后会自动收录错题' : '该分类暂无题目','error');
          const name = isComp ? '综合测试' : isWrong ? '错题复习' : TYPE_NAMES[cat];
          const iconColor = isWrong ? 'var(--red)' : isComp ? 'var(--purple)' : 'var(--accent)';
          const iconBg = isWrong ? 'color-mix(in srgb, var(--red) 10%, transparent)' : isComp ? 'color-mix(in srgb, var(--purple) 10%, transparent)' : 'color-mix(in srgb, var(--accent) 10%, transparent)';
          const iconName = isWrong ? 'bookmark' : isComp ? 'target' : 'doc';
          openModal(`
            <div class="p-5 sm:p-6 space-y-3">
              <div class="text-center">
                <span class="mode-opt-icon" style="background:${iconBg};color:${iconColor};margin:0 auto 10px">${iconSvg(iconName, 24)}</span>
                <h3 class="text-lg font-semibold">${name}</h3>
                <p class="text-sm text-secondary">共 ${count} 题 · 选择作答方式</p>
              </div>
              <button class="mode-opt" onclick="window._startExamWith('order')">
                <span class="mode-opt-icon" style="background:color-mix(in srgb, var(--accent) 10%, transparent);color:var(--accent)">${iconSvg('arrowRight', 22)}</span>
                <span class="text-left"><span class="block font-semibold text-sm">顺序作答</span><span class="text-xs text-secondary">按${isComp?'题型分组':'题目'}顺序逐题作答，即时批改</span></span>
              </button>
              <button class="mode-opt" onclick="window._startExamWith('shuffle')">
                <span class="mode-opt-icon" style="background:color-mix(in srgb, var(--purple) 10%, transparent);color:var(--purple)">${iconSvg('shuffle', 22)}</span>
                <span class="text-left"><span class="block font-semibold text-sm">乱序作答${isComp?' · 推荐':''}</span><span class="text-xs text-secondary">打乱题目顺序，避免记忆题目位置</span></span>
              </button>
              <button class="mode-opt" onclick="window._startExamWith('view')">
                <span class="mode-opt-icon" style="background:color-mix(in srgb, var(--green) 10%, transparent);color:var(--green-text)">${iconSvg('eye', 22)}</span>
                <span class="text-left"><span class="block font-semibold text-sm">看题模式</span><span class="text-xs text-secondary">直接浏览全部题目与答案，不答题</span></span>
              </button>
              ${isWrong?`<p class="text-xs text-secondary text-center">答对的题目会自动移出错题本</p>`:''}
              <div class="flex gap-2">
                ${isWrong && count>0?`<button class="btn-ghost text-sm" style="color:var(--red)" onclick="window._clearWrongBook()">清空错题本</button>`:''}
                <button class="btn-ghost flex-1" onclick="window._closeModal()">取消</button>
              </div>
            </div>`);
          window._startExamWith = (mode) => { closeModal(); startExam(appState.currentSubjectId, cat, mode); };
        };

        // 浏览
        window._filterBrowse = () => {
          const keyword = document.getElementById('searchInput')?.value.toLowerCase() || '';
          const filtered = (window._allBrowseQuestions || []).filter(q => String(q.question?.q||'').toLowerCase().includes(keyword) || (Array.isArray(q.question?.opts) && q.question.opts.some(o=>String(o||'').toLowerCase().includes(keyword))));
          const container = document.getElementById('browseList');
          if (container) {
            container.innerHTML = filtered.map(q => `
              <div class="card-elegant card-hover p-3">
                <div class="flex justify-between"><span class="tag-pill tag-${q.type}">${q.typeName} #${q.index+1}</span></div>
                <p class="font-medium mt-1">${escapeHtml(q.question.q)}</p>
                ${q.type==='single'?`<div class="text-sm text-secondary">选项：${q.question.opts?.map((o,i)=>String.fromCharCode(65+i)+'. '+escapeHtml(o)).join('；')}</div><p class="text-sm" style="color:var(--green-text)">答案：${String.fromCharCode(65+Number(q.question.ans))}</p>`:''}
                ${q.type==='multi'?`<div class="text-sm text-secondary">选项：${q.question.opts?.map((o,i)=>String.fromCharCode(65+i)+'. '+escapeHtml(o)).join('；')}</div><p class="text-sm" style="color:var(--green-text)">答案：${(Array.isArray(q.question.ans)?q.question.ans:[]).map(i=>String.fromCharCode(65+Number(i))).join('')}</p>`:''}
                ${q.type==='judge'?`<p class="text-sm" style="color:var(--green-text)">答案：${q.question.ans?'正确':'错误'}</p>`:''}
                ${q.type==='fill'?`<p class="text-sm" style="color:var(--green-text)">答案：${escapeHtml(q.question.ans)}</p>`:''}
                ${q.type==='short'?`<p class="text-sm" style="color:var(--green-text)">参考答案：${escapeHtml(q.question.a)}</p>`:''}
              </div>`).join('') || '<p class="text-secondary">无匹配题目</p>';
          }
        };

        // 练习页
        const answerFx = (ok) => {
          if (appState.motionLevel === 'off') return;
          if (navigator.vibrate) { try { navigator.vibrate(ok ? 12 : [10, 40, 10]); } catch (e) {} }
        };
        window._saveDraft = (key, value) => { if (appState.answeredSet[key] === undefined) appState.userAnswers[key] = value; };
        window._selectSingle = (opt,key,correct) => { if (appState.answeredSet[key]||appState.currentMode==='view') return; appState.userAnswers[key]=opt; const ok = opt===correct; appState.answeredSet[key]=ok?'correct':'wrong'; afterGrade(key, ok); answerFx(ok); updateExamUI({ focus: false }); };
        window._toggleMulti = (opt,key) => { if (appState.answeredSet[key]||appState.currentMode==='view') return; const selected = [...(appState.userAnswers[key] || [])]; const idx = selected.indexOf(opt); if(idx>=0) selected.splice(idx,1); else selected.push(opt); appState.userAnswers[key]=selected; updateExamUI({ focus: false }); };
        window._submitMulti = (key,correct) => { if (appState.answeredSet[key]) return; const sel = [...(appState.userAnswers[key] || [])]; appState.userAnswers[key]=sel; const ok = sel.slice().sort().join(',')===correct.slice().sort().join(','); appState.answeredSet[key]=ok?'correct':'wrong'; afterGrade(key, ok); answerFx(ok); updateExamUI({ focus: false }); };
        window._selectJudge = (val,key,correct) => { if (appState.answeredSet[key]||appState.currentMode==='view') return; appState.userAnswers[key]=val; const ok = val===correct; appState.answeredSet[key]=ok?'correct':'wrong'; afterGrade(key, ok); answerFx(ok); updateExamUI({ focus: false }); };
        window._submitFill = (key) => {
          if (appState.answeredSet[key]) return;
          const input = document.getElementById('fillInput');
          const ans = input?.value.trim() || '';
          const ref = appState.currentQuestions[appState.currentIndex].ans;
          const accepted = (Array.isArray(ref)?ref:String(ref||'').split('|')).map(normalizeFillValue);
          const ok = accepted.includes(normalizeFillValue(ans));
          appState.userAnswers[key]=ans;
          appState.answeredSet[key]=ok?'correct':'wrong';
          afterGrade(key, ok);
          updateExamUI({ focus: false });
        };
        window._submitShort = (key) => { if (appState.answeredSet[key]) return; const input=document.getElementById('shortInput'); appState.userAnswers[key]=input?.value.trim()||''; appState.answeredSet[key]='pending'; updateExamUI({ focus: false }); };
        window._selfGradeShort = (key, ok) => { if (appState.answeredSet[key] !== 'pending') return; appState.answeredSet[key] = ok ? 'correct' : 'wrong'; afterGrade(key, ok); updateExamUI({ focus: false }); };
        window._prevQuestion = () => {
          if (appState.currentIndex <= 0) return;
          appState.currentIndex--;
          appState.multiTempSelections = [];
          appState._qDirection = 'left';
          updateExamUI({ direction: 'left' });
        };
        window._nextQuestion = () => {
          const total = appState.currentQuestions.length;
          if (appState.currentIndex < total - 1) {
            appState.currentIndex++;
            appState.multiTempSelections = [];
            appState._qDirection = 'right';
            updateExamUI({ direction: 'right' });
          } else if (total && Object.keys(appState.answeredSet).length === total) {
            window._goToResult();
          } else {
            showToast('已到最后一题','info');
          }
        };
        window._goToQ = (i) => {
          const from = appState.currentIndex;
          appState.currentIndex = i;
          appState.multiTempSelections = [];
          appState._qDirection = i < from ? 'left' : 'right';
          updateExamUI({ direction: appState._qDirection });
        };
        // 看题模式：题目目录跳转
        window._openCatalog = () => {
          const questions = appState.currentQuestions;
          if (!questions.length) return;
          const rows = questions.map((q, i) => {
            const cat = q._type || appState.currentCategory;
            const active = i === appState.currentIndex;
            return `<button class="mode-opt" onclick="window._catalogGo(${i})" style="${active?'border-color:var(--accent);background:color-mix(in srgb, var(--accent) 5%, transparent)':''}">
              <span class="tag-pill tag-${cat}">${TYPE_NAMES[cat]||cat}</span>
              <span class="text-left flex-1 min-w-0"><span class="block text-sm truncate">${escapeHtml(q.q)}</span></span>
              <span class="text-xs" style="color:var(--text-secondary)">${i+1}</span>
            </button>`;
          }).join('');
          openModal(`
            <div class="p-5 sm:p-6 space-y-3">
              <div class="text-center"><h3 class="text-lg font-semibold">题目目录</h3><p class="text-sm text-secondary">共 ${questions.length} 题 · 点击任意题目跳转</p></div>
              <div class="space-y-2" style="max-height:55vh;overflow-y:auto">${rows}</div>
              <button class="btn-ghost w-full" onclick="window._closeModal()">关闭</button>
            </div>`);
          window._catalogGo = (i) => {
            closeModal();
            appState.currentIndex = i;
            appState.multiTempSelections = [];
            updateExamUI();
          };
        };
        window._setMode = (m) => {
          if (appState.currentMode === m) return;
          if (m === 'view') { appState.currentMode = 'view'; updateExamUI(); return; }
          if (appState.currentMode === 'view' && m === appState._lastAnswerMode && appState.currentQuestions.every(q => !questionNeedsReview(q._type, q))) {
            appState.currentMode = m; updateExamUI(); return;
          }
          if (Object.keys(appState.answeredSet).length && !confirm('切换作答顺序将清空当前答题进度，继续？')) return;
          const available = appState._originalOrder.filter(q => !questionNeedsReview(q._type, q));
          if (!available.length) return showToast('所有题目答案待核对，暂不能作答','error');
          appState.currentQuestions = m === 'shuffle' ? shuffleArr(available) : available;
          appState.currentMode = m;
          appState._lastAnswerMode = m;
          appState.currentIndex = 0;
          appState.answeredSet = {};
          appState.userAnswers = {};
          appState.multiTempSelections = [];
          updateExamUI();
          showToast(m === 'shuffle' ? '已切换为乱序作答' : '已切换为顺序作答','success');
        };
        window._goToResult = () => {
          if (!Object.keys(appState.answeredSet).length) return showToast('还没有作答记录','error');
          if (computeResult()) navigateTo('result');
        };
        window._restartExam = () => {
          if (!appState.currentSubjectId || !appState.currentCategory) return navigateTo('subject');
          startExam(appState.currentSubjectId, appState.currentCategory, appState._sessionStartMode || appState._lastAnswerMode || 'order');
        };
        window._redoWrong = () => {
          const wrongIdx = Object.entries(appState.answeredSet)
            .filter(([,v]) => v !== 'correct')
            .map(([k]) => parseInt(k.replace('exam-',''), 10))
            .filter(i => i >= 0)
            .sort((a,b) => a-b);
          if (!wrongIdx.length) return showToast('本次没有错题','success');
          const items = wrongIdx.map(i => appState.currentQuestions[i]).filter(Boolean);
          if (!items.length) return showToast('没有可重练的错题','error');
          appState._originalOrder = items;
          appState.currentQuestions = items.slice();
          appState.currentMode = appState._lastAnswerMode === 'view' ? 'order' : (appState._lastAnswerMode || 'order');
          appState._sessionStartMode = appState.currentMode;
          appState.currentIndex = 0;
          appState.answeredSet = {};
          appState.userAnswers = {};
          appState.multiTempSelections = [];
          appState.examStartTime = Date.now();
          appState.lastResult = null;
          showToast(`开始重练 ${items.length} 道错题`,'success');
          navigateTo('exam');
        };

        // 上传页
        window._recognitionMode = window._recognitionMode || 'ai';
        window._readyToImport = false;
        window._parsedQuestions = null;
        window._pendingFiles = null;
        window._recognitionUsedFallback = false;
        window._cancelRecognition = (silent = false) => {
          recognitionController?.abort();
          if (recognitionWorker) recognitionWorker.terminate().catch(() => {});
          if (!silent) {
            const status = document.getElementById('uploadStatus');
            if (status) status.textContent = '已取消识别';
          }
        };
        const setRecognitionBusy = busy => {
          const cancel = document.getElementById('cancelRecognitionBtn');
          const process = document.getElementById('processUploadBtn');
          if (cancel) cancel.style.display = busy ? '' : 'none';
          if (process) process.disabled = busy;
        };

        window._handleFileUpload = (event) => {
          const files = event.target.files;
          if (!files || !files.length) return;
          const oversized = Array.from(files).find(file => file.size > 30 * 1024 * 1024);
          if (oversized) { showToast(`${oversized.name} 超过 30MB，请拆分后再上传`,'error'); event.target.value = ''; return; }
          const names = Array.from(files).map(f=>f.name).join(', ');
          document.getElementById('uploadStatus').innerHTML = `<span style="font-size:16px;font-weight:600;">已选择：</span><br>${escapeHtml(names)}`;
          document.getElementById('processUploadBtn').disabled = false;
          window._pendingFiles = files;
          window._readyToImport = false;
          window._parsedQuestions = null;
          window._recognitionUsedFallback = false;
          document.getElementById('processUploadBtn').textContent = '开始识别并导入';
        };
        window._parsePastedText = async () => {
          const text = document.getElementById('pasteTextarea')?.value.trim();
          if (!text) return showToast('请粘贴文本','error');
          window._pendingFiles = null;
          window._recognitionUsedFallback = false;
          recognitionController?.abort();
          const controller = new AbortController();
          recognitionController = controller;
          setRecognitionBusy(true);
          try {
            const parsed = await doRecognitionV2(text);
            throwIfRecognitionCancelled();
            if (parsed && appState.currentView === 'upload') {
              displayPreview(parsed);
              window._parsedQuestions = parsed;
              window._readyToImport = true;
              document.getElementById('processUploadBtn').textContent = '导入识别结果';
            }
          } catch (e) {
            if (!controller.signal.aborted) showToast(`识别出错：${e.message || e}`,'error');
          } finally {
            if (recognitionController === controller) { recognitionController = null; setRecognitionBusy(false); }
          }
        };
        window._processUploadedFile = async () => {
          if (window._readyToImport && window._parsedQuestions) {
            await importParsedQuestionsV2(window._parsedQuestions);
            return;
          }
          window._recognitionUsedFallback = false;
          const files = window._pendingFiles;
          if (!files || !files.length) return showToast('请选择文件或粘贴文本','error');
          recognitionController?.abort();
          const controller = new AbortController();
          recognitionController = controller;
          setRecognitionBusy(true);
          try {
            const status = document.getElementById('uploadStatus');
            if (status) status.textContent = '正在解析文件...';
            let allText = '';
            for (const file of files) {
              throwIfRecognitionCancelled();
              try { allText += await extractTextFromFileV2(file) + '\n\n'; }
              catch(e) { if (controller.signal.aborted) throw e; showToast(`解析 ${file.name} 失败：${e.message || '未知错误'}`,'error'); }
            }
            throwIfRecognitionCancelled();
            if (!allText.trim()) throw new Error('未提取到文本；图片型 PDF 需要联网加载 OCR 模型');
            const parsed = await doRecognitionV2(allText);
            throwIfRecognitionCancelled();
            if (!parsed || appState.currentView !== 'upload') return;
            displayPreview(parsed);
            window._parsedQuestions = parsed;
            window._readyToImport = true;
            document.getElementById('uploadStatus').innerHTML = window._recognitionUsedFallback
              ? '<span style="color:var(--orange-text)">AI识别失败/不可用，已改用本地规则识别完成，请仔细核对题型。</span>'
              : '<span style="color:var(--green-text)">识别完成！</span>';
            document.getElementById('processUploadBtn').textContent = '导入识别结果';
          } catch (e) {
            if (!controller.signal.aborted) {
              const status = document.getElementById('uploadStatus');
              if (status) status.textContent = '识别出错：' + (e.message || String(e));
              showToast('识别出错，请检查文件或网络','error');
            }
          } finally {
            if (recognitionController === controller) { recognitionController = null; setRecognitionBusy(false); }
          }
        };
        window._showDetailPreview = () => {
          if (!window._parsedQuestions) return;
          window._editableQuestions = JSON.parse(JSON.stringify(window._parsedQuestions));
          const editorDiv = document.getElementById('detailEditor');
          if (editorDiv) {
            editorDiv.style.display = 'block';
            editorDiv.innerHTML = renderDetailEditor();
            bindDetailEditorEvents();
            editorDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        };

        // AI 配置弹窗
        window._openAiModal = () => {
          window._modalCfg = Object.assign({}, appState.aiConfig || defaultAiConfig());
          window._modelCache = window._modelCache || {};
          openModal(`<div id="aiModalInner">${aiModalHtml()}</div>`);
        };
        window._pickProvider = (id) => {
          const keyInput = document.getElementById('aiKeyInput');
          window._modalCfg.apiKey = keyInput ? keyInput.value : window._modalCfg.apiKey;
          window._modalCfg.rememberKey = Boolean(document.getElementById('rememberAiKey')?.checked);
          const p = PROVIDER_PRESETS.find(x => x.id === id);
          window._modalCfg.providerId = id;
          if (p.id !== 'custom') {
            window._modalCfg.name = p.name;
            window._modalCfg.baseUrl = p.baseUrl;
            window._modalCfg.model = p.models[0] || '';
            window._modalCfg.displayName = p.displayName;
          } else {
            window._modalCfg.name = '';
            window._modalCfg.baseUrl = '';
            window._modalCfg.model = '';
            window._modalCfg.displayName = '';
          }
          const inner = document.getElementById('aiModalInner');
          if (inner) inner.innerHTML = aiModalHtml();
        };
        window._toggleKeyVis = (btn) => {
          const inp = document.getElementById('aiKeyInput');
          if (!inp) return;
          const show = inp.type === 'password';
          inp.type = show ? 'text' : 'password';
          btn.innerHTML = iconSvg(show ? 'eyeOff' : 'eye', 16);
        };
        window._toggleModelList = () => {
          const panel = document.getElementById('aiModelList');
          if (!panel) return;
          if (panel.style.display === 'none') { panel.style.display = 'block'; window._renderModelList(); }
          else panel.style.display = 'none';
        };
        window._openModelList = () => {
          const panel = document.getElementById('aiModelList');
          if (!panel) return;
          panel.style.display = 'block';
          window._renderModelList();
          const pid = window._modalCfg.providerId;
          if (!(window._modelCache && window._modelCache[pid] && window._modelCache[pid].length)) {
            const keyInput = document.getElementById('aiKeyInput');
            const urlInput = document.getElementById('aiUrlInput');
            if (keyInput?.value && urlInput?.value) window._fetchModels(true);
          }
        };
        window._renderModelList = renderModelListItems;
        window._pickModel = (m) => {
          window._modalCfg.model = m;
          const input = document.getElementById('aiModelInput');
          if (input) input.value = m;
          const panel = document.getElementById('aiModelList');
          if (panel) panel.style.display = 'none';
          window._renderModelList();
        };
        window._fetchModels = async (silent) => {
          const cfg = readModalFields();
          const base = String(cfg.baseUrl || '').trim().replace(/\/+$/, '');
          if (!base || !cfg.apiKey) { showToast('请先填写 API 地址和 API Key','error'); return; }
          const url = base.replace(/\/chat\/completions$/i, '') + '/models';
          const btn = document.getElementById('fetchModelsBtn');
          const note = document.getElementById('modelFetchNote');
          if (note) note.textContent = '';
          if (btn) { btn.disabled = true; btn.textContent = '获取中…'; }
          try {
            const data = await fetchWithTimeout(url, {
              headers: { 'Authorization': 'Bearer ' + cfg.apiKey, 'Accept': 'application/json' }
            }, 30000, async res => {
              if (!res.ok) throw new Error('接口返回 ' + res.status);
              return res.json();
            });
            const list = (Array.isArray(data.data) ? data.data.map(m => m.id || m) : []).filter(Boolean);
            if (!list.length) throw new Error('未解析到模型列表');
            window._modelCache = window._modelCache || {};
            window._modelCache[window._modalCfg.providerId] = list;
            window._modalCfg.model = list.includes(cfg.model) ? cfg.model : list[0];
            const mi = document.getElementById('aiModelInput');
            if (mi) mi.value = window._modalCfg.model;
            if (!silent) showToast(`已获取 ${list.length} 个可用模型`,'success');
            window._renderModelList();
          } catch (e) {
            if (note) note.textContent = '获取失败：' + (e.message || e);
            if (!silent) showToast('获取模型失败：' + (e.message || e),'error');
          } finally {
            if (btn) { btn.disabled = false; btn.textContent = '获取供应商可用模型'; }
          }
        };
        window._toggleRegList = () => {
          const el = document.getElementById('regList');
          if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
        };
        window._saveAiConfigModal = () => {
          const cfg = readModalFields();
          if (!cfg.baseUrl || !cfg.model) { showToast('请填写 API 地址和模型名称','error'); return; }
          cfg.displayName = cfg.displayName || cfg.model;
          appState.aiConfig = cfg;
          appState.apiKey = cfg.apiKey;
          if (!saveAiConfigToStorage(cfg)) return;
          closeModal();
          updateAiSummary();
          showToast('AI 配置已保存：' + cfg.name + ' / ' + cfg.displayName,'success');
        };

        // 详情编辑
        window._addQuestion = (type) => {
          const newQ = type==='single'?{q:'新题目',opts:['选项A','选项B','选项C','选项D'],ans:null}:
                       type==='multi'?{q:'新题目',opts:['选项A','选项B','选项C','选项D'],ans:null}:
                       type==='judge'?{q:'新题目',ans:null}:
                       type==='fill'?{q:'新题目',ans:null}:
                       {q:'新题目',a:''};
          window._editableQuestions[type].push(newQ);
          document.getElementById('detailEditor').innerHTML = renderDetailEditor();
          bindDetailEditorEvents();
        };
        window._deleteQuestion = (idx) => {
          const all = [];
          for (let type of ['single','multi','judge','fill','short']) {
            (window._editableQuestions[type]||[]).forEach((q, i) => all.push({ type, index: i }));
          }
          const item = all[idx];
          window._editableQuestions[item.type].splice(item.index, 1);
          document.getElementById('detailEditor').innerHTML = renderDetailEditor();
          bindDetailEditorEvents();
        };
        window._updateQ = (idx, field, value) => {
          const all = [];
          for (let type of ['single','multi','judge','fill','short']) {
            (window._editableQuestions[type]||[]).forEach((q, i) => all.push({ type, index: i, question: q }));
          }
          const item = all[idx];
          if (field === 'opts' && typeof value === 'string') {
            const previous = item.question.opts || [];
            const next = value.split(/\r?\n/).map(s=>s.trim());
            const indices = Array.isArray(item.question.ans) ? item.question.ans : [item.question.ans];
            if (indices.every(Number.isInteger)) {
              const mapped = indices.map(i => next.map((text, j) => text && text === previous[i] ? j : -1).filter(j => j >= 0));
              item.question.ans = mapped.every(matches => matches.length === 1)
                ? (item.type === 'multi' ? mapped.map(matches => matches[0]) : mapped[0][0]) : null;
            }
            value = next;
          }
          window._editableQuestions[item.type][item.index][field] = value;
        };
        window._saveEdits = () => {
          window._parsedQuestions = normalizeParsedQuestions(window._editableQuestions);
          window._editableQuestions = JSON.parse(JSON.stringify(window._parsedQuestions));
          displayPreview(window._parsedQuestions);
          document.getElementById('detailEditor').style.display = 'none';
          showToast('修改已保存','success');
        };
      }

      // ================= 详情编辑渲染 =================
      function renderDetailEditor() {
        const all = [];
        for (let type of ['single','multi','judge','fill','short']) {
          (window._editableQuestions[type]||[]).forEach((q, i) => all.push({ type, index: i, question: q }));
        }
        let html = `<div class="space-y-4"><h3 class="font-semibold">题目详情编辑</h3><div class="flex gap-2 mb-3 flex-wrap"><button class="btn-ghost text-sm" onclick="window._addQuestion('single')">＋单选</button><button class="btn-ghost text-sm" onclick="window._addQuestion('multi')">＋多选</button><button class="btn-ghost text-sm" onclick="window._addQuestion('judge')">＋判断</button><button class="btn-ghost text-sm" onclick="window._addQuestion('fill')">＋填空</button><button class="btn-ghost text-sm" onclick="window._addQuestion('short')">＋简答</button></div>`;
        all.forEach((item, idx) => {
          const q = item.question;
          html += `<div class="card-elegant p-3" id="editQ-${idx}">
            <div class="flex justify-between"><span class="tag-pill tag-${item.type}">${TYPE_NAMES[item.type]||item.type} #${item.index+1}${questionNeedsReview(item.type, q)?' · 待核对':''}</span><button class="btn-ghost text-sm" onclick="window._deleteQuestion(${idx})" style="color:var(--red)">删除</button></div>
            <label class="text-xs">题干</label><input class="input-elegant text-sm" value="${escapeHtml(q.q)}" oninput="window._updateQ(${idx},'q',this.value)">
            ${item.type==='single'||item.type==='multi'?`<div class="mt-2"><label class="text-xs">选项（每行一个，可包含逗号）</label><textarea class="input-elegant text-sm" oninput="window._updateQ(${idx},'opts',this.value)">${escapeHtml((q.opts||[]).join('\n'))}</textarea></div>`:''}
            ${item.type==='single'?`<label class="text-xs">答案索引（A=0，B=1，依此类推）</label><input class="input-elegant text-sm w-20" type="number" min="0" value="${q.ans ?? ''}" oninput="window._updateQ(${idx},'ans',this.value===''?null:Number(this.value))">`:''}
            ${item.type==='multi'?`<label class="text-xs">答案索引（逗号分隔，如 0,2）</label><input class="input-elegant text-sm" value="${Array.isArray(q.ans)?q.ans.join(','):''}" oninput="window._updateQ(${idx},'ans',this.value.trim()?this.value.split(',').map(x=>x.trim()):null)">`:''}
            ${item.type==='judge'?`<label class="text-xs">答案</label><select class="input-elegant text-sm" onchange="window._updateQ(${idx},'ans',this.value===''?null:this.value==='true')"><option value="" ${q.ans===null?'selected':''}>待核对</option><option ${q.ans===true?'selected':''} value="true">正确</option><option ${q.ans===false?'selected':''} value="false">错误</option></select>`:''}
            ${item.type==='fill'?`<label class="text-xs">答案</label><input class="input-elegant text-sm" value="${escapeHtml(q.ans)}" oninput="window._updateQ(${idx},'ans',this.value)">`:''}
            ${item.type==='short'?`<label class="text-xs">参考答案</label><textarea class="input-elegant text-sm" oninput="window._updateQ(${idx},'a',this.value)">${escapeHtml(q.a)}</textarea>`:''}
          </div>`;
        });
        html += `<button class="btn-primary mt-3" onclick="window._saveEdits()">保存修改并返回</button></div>`;
        return html;
      }
      function bindDetailEditorEvents() { /* 所有编辑函数已在 bindEvents 中全量绑定 */ }

      function displayPreview(parsed) {
        const area = document.getElementById('previewArea');
        const content = document.getElementById('previewContent');
        if (area) area.style.display = 'block';
        const pending = ['single','multi','judge','fill','short'].reduce((sum,type) => sum + parsed[type].filter(q => questionNeedsReview(type,q)).length, 0);
        if (content) content.innerHTML = `
          <p>单选题：${parsed.single.length} 多选题：${parsed.multi.length} 判断题：${parsed.judge.length} 填空题：${parsed.fill.length} 简答题：${parsed.short.length}</p>
          <p class="mt-1"><strong>总计 ${parsed.single.length+parsed.multi.length+parsed.judge.length+parsed.fill.length+parsed.short.length} 道</strong>${pending?` · <span style="color:var(--orange-text)">${pending} 道答案待核对，暂不参与练习</span>`:''}</p>`;
      }

      // ================= V2：通用题库解析（本地规则 + 多供应商 AI） =================
      const RECOGNITION_SYSTEM_PROMPT = `你是一名专业的题库解析专家。请从用户提供的文本中提取所有题目，严格输出 JSON，不要遗漏、不要编造。

## 一、题型判定规则（最重要）
1. 单选题：题干标有“单选题/单选”，或只有一个选项字母（如答案：A），或问“正确的一项是”。答案必须是 0 开始的选项索引。
2. 多选题：题干标有“多选题/多选/不定项/至少两个/选择所有正确”，或答案字段含有两个及以上字母（如答案：AB、BCD）。即使题干没有写“多选”，只要答案有多个字母，也必须判定为多选。答案输出索引数组。

        const explicitJudge = /判断题|判断对错|是非题/.test(trimmed);
        const isFill = (/填空|___|____|（\s*）|\(\s*\)|【\s*】|[（(【][^（）()【】]{1,40}[）)】]/.test(trimmed)) && !hasLetterOptions;
        const isShort = /简答|问答|论述|名词解释/.test(trimmed) && !hasLetterOptions;
        if (explicitJudge || (judgeAns !== null && !hasLetterOptions && !explicitMulti && !isFill)) {
          return { type: 'judge', data: { q: cleanChoiceQuestionV2(trimmed), ans: judgeAns } };
        }
        if (isFill || (fillAns && /___|（\s*）|\(\s*\)|【\s*】|[（(【][^（）()【】]{1,40}[）)】]/.test(trimmed) && !hasLetterOptions && !explicitJudge && !explicitMulti)) {
          const cleanedAns = fillAns || null;
          return { type: 'fill', data: { q: cleanFillQuestionV2(trimmed, cleanedAns), ans: cleanedAns } };
        }
        if (hasLetterOptions) {
          if (explicitMulti || answerIndices.length > 1) {
            return { type: 'multi', data: { q: cleanChoiceQuestionV2(trimmed), opts: options, ans: answerIndices.length ? answerIndices : null } };
          }
          return { type: 'single', data: { q: cleanChoiceQuestionV2(trimmed), opts: options, ans: answerIndices.length ? answerIndices[0] : null } };
        }
        if (isShort || shortAns) {
          return { type: 'short', data: { q: cleanQuestionText(trimmed.replace(/(?:标准答案|参考答案|答案|答)\s*[：:]\s*[\s\S]*$/i, '')), a: shortAns || '' } };
        }
        return null;
      }
      function parseQuestionsFromTextV2(text) {
        const result = { single:[], multi:[], judge:[], fill:[], short:[] };
        for (const block of splitBlocksV2(text)) {
          const qObj = identifyBlockV2(block);
          if (qObj) result[qObj.type].push(qObj.data);
        }
        return dedupeParsedQuestions(normalizeParsedQuestions(result));
      }

      // ========== 文件文本提取 ==========
      function readFileAsText(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result || '');
          reader.onerror = reject;
          reader.readAsText(file, 'UTF-8');
        });
      }
      async function extractDocx(file) {
        await ensureLibrary('mammoth');
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = async () => {
            try {
              if (typeof mammoth !== 'undefined') {
                const result = await mammoth.extractRawText({ arrayBuffer: reader.result });
                resolve(result.value || '');
              } else resolve('');
            } catch(e) { reject(e); }
          };
          reader.onerror = reject;
          reader.readAsArrayBuffer(file);
        });
      }
      async function extractExcel(file) {
        await ensureLibrary('xlsx');
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              if (typeof XLSX !== 'undefined') {
                const wb = XLSX.read(new Uint8Array(reader.result), { type: 'array' });
                let text = '';
                wb.SheetNames.forEach(name => text += XLSX.utils.sheet_to_csv(wb.Sheets[name]) + '\n');
                resolve(text);
              } else resolve('');
            } catch(e) { reject(e); }
          };
          reader.onerror = reject;
          reader.readAsArrayBuffer(file);
        });
      }
      // ===== 图片型 PDF 兜底：pdf.js 取不到文字层时，页面内 OCR（tesseract.js） =====
      const OCR_CDN = {
        workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
        corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/',
        langPath: 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/chi_sim@1.0.0/4.0.0_best_int'
      };
      function setUploadStatus(html) {
        const el = document.getElementById('uploadStatus');
        if (el) el.innerHTML = html;
      }
      function readFileBuffer(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(new Uint8Array(reader.result));
          reader.onerror = reject;
          reader.readAsArrayBuffer(file);
        });
      }
      async function extractPdfTextLayer(file) {
        await ensureLibrary('pdf');
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf = await pdfjsLib.getDocument({ data: await readFileBuffer(file) }).promise;
        if (pdf.numPages > 100) throw new Error('PDF 超过 100 页，请拆分后再识别');
        let text = '';
        for (let i=1; i<=pdf.numPages; i++) {
          throwIfRecognitionCancelled();
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          throwIfRecognitionCancelled();
          text += content.items.map(it => it.str).join(' ') + '\n';
        }
        return text;
      }
      // 双栏检测：只统计「横跨整幅的长行」上的墨，这样页眉/页脚/水印不会污染栏间空白的判断；
      // 再在中间 1/3 找最空的一列（不是找最长空段——个别残墨会把空段切断），两侧都确实有字才切。
      function ocrColumnRanges(img, w, h) {
        const ink = new Array(w).fill(0);
        let longRows = 0;
        for (let y = Math.round(h * 0.05); y < Math.round(h * 0.96); y++) {
          const row = y * w * 4;
          let mn = -1, mx = -1;
          for (let x = 0; x < w; x++) {
            const i = row + x * 4;
            if (img[i] < 160 && img[i+1] < 160 && img[i+2] < 160) { if (mn < 0) mn = x; mx = x; }
          }
          if (mn < 0 || (mx - mn) < w * 0.6) continue;
          longRows++;
          for (let x = mn; x <= mx; x++) {
            const i = row + x * 4;
            if (img[i] < 160 && img[i+1] < 160 && img[i+2] < 160) ink[x]++;
          }
        }
        if (longRows < 20) return [[0, w]];
        const R = 6, s = new Array(w).fill(0);
        for (let x = 0; x < w; x++) {
          let acc = 0, n = 0;
          for (let k = -R; k <= R; k++) { const j = x + k; if (j >= 0 && j < w) { acc += ink[j]; n++; } }
          s[x] = acc / n;
        }
        const lo = Math.round(w * 0.33), hi = Math.round(w * 0.67);
        let xm = lo;
        for (let x = lo; x <= hi; x++) if (s[x] < s[xm]) xm = x;
        const lim = Math.max(0.5, s[xm] * 2.5);
        let a = xm, b = xm;
        while (a > Math.round(w * 0.15) && s[a - 1] <= lim) a--;
        while (b < Math.round(w * 0.85) && s[b + 1] <= lim) b++;
        const mean = arr => arr.length ? arr.reduce((p, c) => p + c, 0) / arr.length : 0;
        const L = mean(s.slice(Math.max(0, a - Math.round(w * 0.1)), a));
        const Rt = mean(s.slice(b, Math.min(w, b + Math.round(w * 0.1))));
        const ok = (b - a) >= w * 0.005 && s[xm] <= Math.max(0.5, Math.min(L, Rt) * 0.15) && L >= 8 && Rt >= 8;
        return ok ? [[0, a], [b, w]] : [[0, w]];
      }
      // 黄底 = 正确答案：按 OCR 行框在画布上采样黄色占比
      function ocrYellowRatio(img, w, x0, y0, x1, y1) {
        let yellow = 0, total = 0;
        const xe = Math.min(w, Math.ceil(x1));
        for (let y = Math.max(0, Math.floor(y0)); y < Math.ceil(y1); y++) {
          const row = y * w * 4;
          for (let x = Math.max(0, Math.floor(x0)); x < xe; x++) {
            const i = row + x * 4;
            total++;
            if (img[i] > 240 && img[i+1] > 240 && img[i+2] < 80) yellow++;
          }
        }
        return total ? yellow / total : 0;
      }
      // 逐行输出；命中的选项行后面补「答案：X」，让本地规则也能判成单选并带上正确答案
      function ocrOptionLetter(s) {
        const head = s.slice(0, 10);
        const bracketed = /[（(【《〈＜«]\s*([A-H])\s*[）)】》〉]/.exec(head);
        if (bracketed) return bracketed[1];
        const bare = /^[\s“”"'']*([A-H])\s*[.、．:：)）]/.exec(head);
        return bare ? bare[1] : '';
      }
      function ocrLinesWithAnswers(data, img, w, offsetX) {
        if (!data.lines || !data.lines.length) return data.text || '';
        const out = [];
        let optIdx = 0;
        let pendingAns = '';
        const flushAns = () => { if (pendingAns && out.length) { out[out.length - 1] += ' 答案：' + pendingAns; pendingAns = ''; } };
        for (const l of data.lines) {
          let s = (l.text || '').trim();
          if (!s) { continue; }
          const isQ = /^\d{1,3}\s*[、.．]/.test(s);
          const letter = isQ ? '' : (ocrOptionLetter(s) || (/[（(【《〈＜«]\s*[A-H]\s*[）)】》〉]/.test(s.slice(0, 10)) ? ('ABCDEFGH'[optIdx] || '') : ''));
          if (isQ) optIdx = 0;
          // 折行的续行先贴回上一行，再落答案，否则「答案：X」会插进选项中间
          if (!isQ && !letter && out.length) { out[out.length - 1] += s; continue; }
          flushAns();
          if (letter && l.bbox) {
            optIdx++;
            const b = l.bbox;
            if (ocrYellowRatio(img, w, b.x0 + offsetX, b.y0, b.x1 + offsetX, b.y1) > 0.35) pendingAns = letter;
          }
          out.push(s);
        }
        flushAns();
        return out.join('\n');
      }
      function ocrCrop(canvas, x0, x1) {
        const c = document.createElement('canvas');
        c.width = x1 - x0; c.height = canvas.height;
        c.getContext('2d').drawImage(canvas, x0, 0, x1 - x0, canvas.height, 0, 0, x1 - x0, canvas.height);
        return c;
      }
      // 逐页渲染成 canvas 再 OCR；tesseract 首次会下载中文模型（约 1.7MB，之后走 IndexedDB 缓存）
      async function ocrPdf(file) {
        await ensureLibrary('pdf');
        await ensureLibrary('tesseract');
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf = await pdfjsLib.getDocument({ data: await readFileBuffer(file) }).promise;
        if (pdf.numPages > 100) throw new Error('PDF 超过 100 页，请拆分后再识别');
        const startedAt = Date.now();
        setUploadStatus('<span>检测到图片型 PDF，正在加载中文 OCR 模型…（首次约 3.5MB，请稍候）</span>');
        const worker = await Tesseract.createWorker('chi_sim', 1, OCR_CDN);
        recognitionWorker = worker;
        let text = '';
        try {
          for (let i=1; i<=pdf.numPages; i++) {
            throwIfRecognitionCancelled();
            const secs = Math.round((Date.now() - startedAt) / 1000);
            setUploadStatus(`<span style="color:var(--accent)">图片型 PDF，正在识别… 第 ${i}/${pdf.numPages} 页（已用 ${secs} 秒，请勿关闭页面）</span>`);
            const page = await pdf.getPage(i);
            const viewport = page.getViewport({ scale: 2 });
            const canvas = document.createElement('canvas');
            canvas.width = Math.ceil(viewport.width);
            canvas.height = Math.ceil(viewport.height);
            const ctx = canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport }).promise;
            throwIfRecognitionCancelled();
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            // 双栏试卷按栏切开分别识别，否则 tesseract 会把左右两栏串成一行
            for (const [x0, x1] of ocrColumnRanges(imgData, canvas.width, canvas.height)) {
              const target = (x0 === 0 && x1 === canvas.width) ? canvas : ocrCrop(canvas, x0, x1);
              const { data } = await worker.recognize(target);
              throwIfRecognitionCancelled();
              text += ocrLinesWithAnswers(data, imgData, canvas.width, x0) + '\n';
            }
            canvas.width = 0; canvas.height = 0;
          }
        } finally {
          try { await worker.terminate(); } catch(e) {}
          if (recognitionWorker === worker) recognitionWorker = null;
        }
        return text;
      }
      async function extractPdf(file) {
        const layer = await extractPdfTextLayer(file);
        if (layer.replace(/\s/g, '').length >= 20) return layer;  // 有文字层，零成本
        return await ocrPdf(file);                                 // 图片型 PDF，走 OCR 兜底
      }
      function readTextSmart(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const buf = reader.result;
              if (typeof TextDecoder !== 'undefined') {
                try { resolve(new TextDecoder('utf-8', { fatal: true }).decode(buf)); }
                catch (e) {
                  try { resolve(new TextDecoder('gbk').decode(buf)); }
                  catch (e2) { resolve(new TextDecoder('utf-8').decode(buf)); }
                }
              } else resolve('');
            } catch (e) { reject(e); }
          };
          reader.onerror = reject;
          reader.readAsArrayBuffer(file);
        });
      }
      async function extractTextFromFileV2(file) {
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext === 'txt' || ext === 'csv') return readTextSmart(file);
        if (ext === 'doc') throw new Error('旧版 .doc 暂不支持，请用 Word 另存为 .docx 后重新上传');
        if (ext === 'docx') return extractDocx(file);
        if (ext === 'xlsx' || ext === 'xls') return extractExcel(file);
        if (ext === 'pdf') return extractPdf(file);
        return readTextSmart(file);
      }

      // ========== 导入题库 ==========
      async function importParsedQuestionsV2(parsed) {
        const normalized = normalizeParsedQuestions(parsed);
        const total = normalized.single.length + normalized.multi.length + normalized.judge.length + normalized.fill.length + normalized.short.length;
        if (!total) { showToast('没有可导入的有效题目，请检查识别结果','error'); return; }
        const pending = ['single','multi','judge','fill','short'].reduce((sum,type) => sum + normalized[type].filter(q => questionNeedsReview(type,q)).length, 0);
        if (pending) {
          showToast(`${pending} 道题答案待核对，请先在详情中补全后再导入`,'error');
          window._showDetailPreview?.();
          return;
        }
        const nameInput = document.getElementById('subjectNameInput');
        const select = document.getElementById('existingSubjectSelect');
        const targetId = select?.value;
        const customName = nameInput?.value?.trim();
        let skipped = 0;
        const subjects = Object.assign(Object.create(null), appState.subjects);
        let message;
        if (targetId && appState.subjects[targetId]) {
          const sub = { ...appState.subjects[targetId], questions: { ...appState.subjects[targetId].questions } };
          subjects[targetId] = sub;
          for (let type of ['single','multi','judge','fill','short']) {
            sub.questions[type] = [...(sub.questions[type] || [])];
            const existing = new Set(sub.questions[type].map(q => String(q.q || '').trim()));
            const fresh = normalized[type].filter(q => !existing.has(String(q.q || '').trim()));
            skipped += normalized[type].length - fresh.length;
            sub.questions[type].push(...fresh);
          }
          message = `已导入 ${total - skipped} 题到「${sub.name}」${skipped ? `，跳过重复 ${skipped} 题` : ''}`;
        } else {
          let newId = createSubjectId();
          while (subjects[newId]) newId = createSubjectId();
          subjects[newId] = {
            name: customName || `上传题库 ${new Date().toLocaleDateString('zh-CN')}`,
            createdAt: new Date().toISOString().split('T')[0],
            questions: { single: normalized.single, multi: normalized.multi, judge: normalized.judge, fill: normalized.fill, short: normalized.short }
          };
          message = `已创建题库「${subjects[newId].name}」，共 ${total} 题`;
        }
        if (!saveData({ subjects, wrongBook: appState.wrongBook, stats: appState.stats })) return;
        appState.subjects = subjects;
        showToast(message,'success');
        window._parsedQuestions = null;
        window._readyToImport = false;
        window._pendingFiles = null;
        navigateTo('home');
      }

      // ========== JSON 容错解析 ==========
      function robustJSONParse(jsonString) {
        try { return JSON.parse(jsonString); } catch (firstError) { console.warn('初次解析失败，尝试修复JSON...'); }
        let fixed = jsonString;
        fixed = fixed.replace(/(\{|\,)\s*(\w+)\s*\:/g, '$1"$2":');
        fixed = fixed.replace(/\:\s*(\[.*?\])/g, (match, arrStr) => {
          let inner = arrStr.slice(1, -1);
          if (!inner.trim()) return match;
          const parts = inner.split(',');
          const fixedParts = parts.map(p => {
            p = p.trim();
            if (/^".*"$/s.test(p) || /^-?\d+(\.\d+)?$/.test(p) || /^(true|false|null)$/.test(p)) return p;
            return '"' + p.replace(/"/g, '\\"') + '"';
          });
          return ': [' + fixedParts.join(',') + ']';
        });
        fixed = fixed.replace(/,\s*}/g, '}').replace(/,\s*]/g, ']');
        fixed = fixed.replace(/\\(?!["\\/bfnrtu])/g, '\\\\');
        try { return JSON.parse(fixed); } catch (e) { throw new Error('JSON解析失败，请检查题库格式或使用本地识别'); }
      }

      // ================= 全局事件 =================
      document.addEventListener('keydown', e => {
        const inField = ['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON', 'A'].includes(e.target.tagName) || e.target.isContentEditable || Boolean(e.target.closest?.('[role="button"], [role="tab"]'));
        const modalOpen = (document.getElementById('modalRoot') || {}).style?.display !== 'none';
        if (e.key === 'Escape') {
          if (modalOpen) { closeModal(); return; }
          if (appState.currentView !== 'home') { goBack(); return; }
        }
        if (inField) return;
        if (appState.currentView === 'exam' && !modalOpen) {
          if (e.key === 'ArrowLeft') { e.preventDefault(); window._prevQuestion?.(); }
          else if (e.key === 'ArrowRight') { e.preventDefault(); window._nextQuestion?.(); }
          else if (e.key === ' ') { e.preventDefault(); window._nextQuestion?.(); }
        }
        // 数字键 1-9 直接跳题（仅答题页）
        if (appState.currentView === 'exam' && !modalOpen && /^[1-9]$/.test(e.key)) {
          const i = Number(e.key) - 1;
          if (i < appState.currentQuestions.length) { e.preventDefault(); window._goToQ?.(i); }
        }
      });

      document.addEventListener('click', e => {
        const panel = document.getElementById('aiModelList');
        if (panel && panel.style.display !== 'none' && !e.target.closest('.select-wrap')) {
          panel.style.display = 'none';
        }
      });

      document.addEventListener('dragover', e => {
        e.preventDefault();
        const z = document.getElementById('uploadZone');
        if (z && appState.currentView === 'upload') z.classList.add('dragover');
      });
      document.addEventListener('dragleave', e => {
        const z = document.getElementById('uploadZone');
        if (z && !e.relatedTarget) z.classList.remove('dragover');
      });
      document.addEventListener('drop', e => {
        e.preventDefault();
        document.getElementById('uploadZone')?.classList.remove('dragover');
        if (appState.currentView === 'upload' && e.dataTransfer.files.length) {
          const fileInput = document.getElementById('fileInput');
          if (fileInput) {
            const dt = new DataTransfer();
            for (const f of e.dataTransfer.files) dt.items.add(f);
            fileInput.files = dt.files;
            window._handleFileUpload?.({ target: { files: dt.files } });
          }
        }
      });

      // ================= 动效档位 =================
      function applyMotionLevel(level) {
        const b = document.body;
        b.classList.remove('motion-full', 'motion-lite', 'motion-off', 'no-motion');
        b.classList.add('motion-' + level);
        appState.motionLevel = level;
        appState.motion = level !== 'off';
      }
      function cycleMotion() {
        const order = ['full', 'lite', 'off'];
        const next = order[(order.indexOf(appState.motionLevel) + 1) % 3];
        applyMotionLevel(next);
        localStorage.setItem(MOTION_KEY, next === 'full' ? '2' : next === 'lite' ? '1' : '0');
        const btn = document.getElementById('motionBtn');
        if (btn) {
          btn.classList.toggle('on', next !== 'off');
          btn.title = next === 'full' ? '动效：完整' : next === 'lite' ? '动效：精简' : '动效：关闭';
        }
        showToast(next === 'full' ? '动效：完整' : next === 'lite' ? '动效：精简' : '动效：关闭', 'info');
      }
      window._cycleMotion = cycleMotion;

      // ================= 启动 =================
      function initApp() {
        loadData();
        appState.aiConfig = loadAiConfig();
        appState.apiKey = appState.aiConfig.apiKey;
        appState.darkMode = localStorage.getItem(DARK_KEY) === 'true';
        // 兼容旧值：旧版 '0'=关、'1'=开；新版 '2'=full '1'=lite '0'=off。必须显式处理 '1'（旧=开 / 新=精简）
        const rawMotion = localStorage.getItem(MOTION_KEY);
        appState.motionLevel = rawMotion === '0' ? 'off' : rawMotion === '1' ? 'lite' : 'full';
        appState.motion = appState.motionLevel !== 'off';
        if (appState.darkMode) document.body.classList.add('dark');
        applyMotionLevel(appState.motionLevel);
        renderView();
      }

      initApp();
      console.log('✅ 期末复习系统 v' + APP_VERSION + ' 已就绪（设计令牌 · 三档动效 · 转场 · 跳题条）');
    })();
  </script>
