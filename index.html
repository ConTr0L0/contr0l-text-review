<!-- 期末复习系统 · v1.3 | visionOS 质感与动效升级 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>期末复习系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Tailwind 未配置时 darkMode 默认 media，与基于 .dark 类的切换冲突；preflight 会覆盖本文件自带的 :root/body 基础样式
    tailwind.config = { darkMode: 'class', corePlugins: { preflight: false } };
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="mx-auto px-3 sm:px-5 py-4 sm:py-6" style="max-width:68rem"></div>
  <div id="toastContainer" aria-live="polite" aria-atomic="false" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;"></div>
  <div id="modalRoot" style="display:none;"></div>

  <script src="app.js"></script>
</body>
</html>
